<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-96.png">

<title>热血玛法 1.76 · 怀旧手机版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0805;position:fixed;inset:0;touch-action:none;
 font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#e8d9b0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hidden{display:none!important}

/* ---------- 传奇风金色边框通用 ---------- */
.gframe{background:linear-gradient(180deg,#241a0c,#16100a);border:2px solid #7a6132;border-radius:8px;
 box-shadow:0 0 0 1px #2a2010 inset,0 4px 14px #000c}
.goldbtn{background:linear-gradient(180deg,#8a6d34,#5a441e);border:1px solid #d9b96c;border-radius:6px;
 color:#ffe9b0;font-weight:bold;padding:8px 14px;font-size:14px;cursor:pointer;text-shadow:0 1px 2px #000}
.goldbtn:active{filter:brightness(1.25)}
.goldbtn.dis{filter:grayscale(.9) brightness(.6);pointer-events:none}

/* ---------- 标题画面 ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 background:radial-gradient(ellipse at 50% 22%,#3a2c10 0%,#160f04 55%,#050302 100%);overflow-y:auto;z-index:50;touch-action:pan-y;padding:24px 12px 40px}
#title h1{font-size:44px;letter-spacing:6px;margin-top:26px;text-align:center;
 background:linear-gradient(180deg,#ffe9a0,#d9a53c 55%,#8a5a18);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 0 #3a2408) drop-shadow(0 4px 10px #000c);font-weight:900}
#title .sub{color:#c9a86a;font-size:13px;letter-spacing:3px;margin-top:6px;text-shadow:0 1px 2px #000}
.verTag{margin-top:8px;font-size:11px;color:#7a6844;border:1px solid #5a4a28;border-radius:20px;padding:2px 12px;letter-spacing:2px}
#clsRow{display:flex;gap:10px;margin-top:26px;width:100%;max-width:430px;justify-content:center}
.clsCard{flex:1;max-width:132px;background:linear-gradient(180deg,#241a0c,#120c06);border:2px solid #6a5428;border-radius:10px;
 padding:10px 4px 12px;text-align:center;cursor:pointer;transition:.15s}
.clsCard.sel{border-color:#ffd870;box-shadow:0 0 16px #d9a53c66;background:linear-gradient(180deg,#3a2a10,#1a1208)}
.clsCard canvas{width:60px;height:70px;margin:0 auto;display:block}
.clsCard .cn{font-size:17px;font-weight:900;margin-top:6px;letter-spacing:2px}
.clsCard .cd{font-size:10px;color:#a89058;margin-top:4px;line-height:1.5}
.c-war{color:#ff8a70}.c-mag{color:#7ab0ff}.c-tao{color:#7ad0a0}
#nameRow{display:flex;gap:8px;margin-top:20px;align-items:center}
#nameRow input{background:#120c06;border:1px solid #7a6132;border-radius:6px;color:#ffe9b0;padding:9px 12px;font-size:15px;width:170px;text-align:center;outline:none}
#startBtn{margin-top:18px;font-size:19px;padding:12px 46px;letter-spacing:4px;border-radius:30px;
 background:linear-gradient(180deg,#a8452a,#6a2412);border:2px solid #ffd870;color:#ffe9b0;font-weight:900;cursor:pointer;
 text-shadow:0 1px 3px #000;box-shadow:0 0 20px #a8452a66}
#startBtn:active{filter:brightness(1.3)}
#contBtn{margin-top:12px;font-size:13px;padding:8px 30px}
#titleFoot{margin-top:26px;font-size:10px;color:#6a5a38;line-height:1.8;text-align:center;max-width:340px}

/* ---------- 存档槽位 ---------- */
#slotArea{margin-top:16px;width:100%;max-width:430px;display:flex;flex-direction:column;gap:9px}
#slotArea .slotHead{font-size:13px;color:#c9a86a;text-align:center;letter-spacing:2px;margin-bottom:2px}
.slotCard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid #6a5428;border-radius:10px;
 background:linear-gradient(180deg,#241a0c,#120c06);cursor:pointer;transition:.15s;position:relative}
.slotCard:active{filter:brightness(1.2)}
.slotCard.empty{border-style:dashed;opacity:.82}
.slotCard.cur{border-color:#ffd870;box-shadow:0 0 14px #d9a53c55}
.slotCard .sTag{width:44px;height:44px;flex:none;border-radius:9px;border:2px solid #b08a3c;
 display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;background:#1a1208}
.slotCard .sBody{flex:1;min-width:0}
.slotCard .sName{font-size:15px;font-weight:900;color:#ffe9b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotCard .sMeta{font-size:11px;color:#a89058;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotCard .sTime{font-size:10px;color:#6a5a38;margin-top:2px}
.slotCard .sOps{display:flex;flex-direction:column;gap:4px;flex:none}
.slotCard .sBtn{font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid #b08a3c;
 background:linear-gradient(180deg,#8a6d34,#5a441e);color:#ffe9b0;font-weight:bold;white-space:nowrap;cursor:pointer}
.slotCard .sBtn.del{background:linear-gradient(180deg,#8a2a1a,#5a180e);border-color:#c05a3a}
.slotCard .sBtn:active{filter:brightness(1.3)}
.slotCard .sEmpty{font-size:12px;color:#8a7a50}

/* ---------- 游戏HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20}
#topbar{position:absolute;top:0;left:0;right:0;height:calc(64px + env(safe-area-inset-top));
 padding:calc(6px + env(safe-area-inset-top)) 8px 0 8px}
#plFrame{position:absolute;left:8px;top:calc(6px + env(safe-area-inset-top));width:56px;height:56px;border:2px solid #b08a3c;border-radius:12px;
 background:linear-gradient(180deg,#2a1e0c,#120c06);overflow:hidden;box-shadow:0 0 10px #00000099,inset 0 0 12px #00000088;
 display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
#plFrame:active{filter:brightness(1.25)}
#plFrame canvas{width:44px;height:46px;image-rendering:pixelated;display:block;margin-top:4px}
#plCls{position:absolute;top:0;left:0;width:17px;height:17px;border-radius:0 0 9px 0;background:#1a1208e0;
 font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
#plLv{position:absolute;bottom:0;right:0;background:#5a3a10f0;border:1px solid #d9b96c;border-radius:8px 0 8px 0;
 font-size:10px;font-weight:900;padding:1px 5px;color:#ffe9b0;text-shadow:0 1px 1px #000;line-height:1.2}
#plLv::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;
 box-shadow:0 0 6px #ffd87066;pointer-events:none}
#bars{position:absolute;left:68px;right:52px;top:calc(6px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px}
#topBtns{position:absolute;right:6px;top:calc(6px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.iconBtn{width:34px;height:34px;border:1.5px solid #b08a3c;border-radius:8px;background:#1a1208d8;color:#ffe9b0;
 font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bar{height:13px;border:1px solid #000;background:#221610;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;border-radius:2px}
#hpBar i{background:linear-gradient(180deg,#ff5a3c,#a81c0c)}
#mpBar i{background:linear-gradient(180deg,#3c8aff,#103ca8)}
#xpBar{height:6px}#xpBar i{background:linear-gradient(180deg,#ffe9a0,#c8952c)}
.bar b{position:absolute;inset:0;font-size:9px;font-weight:normal;text-align:center;line-height:12px;color:#fff;text-shadow:0 1px 1px #000;font-style:normal}
#xpBar b{line-height:5px}
#mapName{font-size:11px;color:#d9b96c;text-shadow:0 1px 2px #000;text-align:center;margin-top:1px}
.iconBtn:active{background:#3a2a10}
.iconBtn{position:relative}
.iconBtn .dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;background:#ff3c1c;border-radius:50%;border:1.5px solid #ffe9b0;display:none}
#npcBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));
 background:linear-gradient(180deg,#8a6d34,#5a441e);border:2px solid #ffd870;border-radius:24px;color:#ffe9b0;
 font-weight:bold;font-size:14px;padding:10px 22px;cursor:pointer;pointer-events:auto;display:none;z-index:25;
 text-shadow:0 1px 2px #000;box-shadow:0 0 14px #00000088;white-space:nowrap}
#npcBtn:active{filter:brightness(1.3)}
.up{color:#5aff8a}.down{color:#ff5a3c}
.sellRow{display:flex;gap:8px;margin:8px 0 4px}
.sellRow .goldbtn{flex:1;padding:7px 4px;font-size:12px}
#bossBar{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:74%;max-width:340px;display:none}
#bossBar .bn{text-align:center;font-size:12px;color:#ff8a70;text-shadow:0 1px 2px #000;margin-bottom:2px;font-weight:bold}
#bossBar .bar{height:10px}#bossBar i{background:linear-gradient(180deg,#ff8a4c,#c02008)}
#guide{position:absolute;top:calc(96px + env(safe-area-inset-top));left:8px;font-size:11px;color:#ffe9b0;
 background:#00000090;border:1px solid #5a4a28;border-radius:6px;padding:5px 9px;max-width:62%;line-height:1.5;text-shadow:0 1px 1px #000;pointer-events:auto;cursor:pointer}
#logBox{position:absolute;left:8px;bottom:150px;width:56%;max-width:280px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
#logBox div{font-size:11px;color:#ffe9b0;background:#00000075;padding:2px 7px;border-radius:4px;text-shadow:0 1px 1px #000;
 animation:logIn .25s;line-height:1.4}
@keyframes logIn{from{opacity:0;transform:translateX(-12px)}}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:26px;font-weight:900;letter-spacing:4px;
 color:#ffd870;text-shadow:0 0 14px #ff8a1c88,0 2px 0 #502c00,0 3px 8px #000;opacity:0;transition:opacity .4s;pointer-events:none}
#subBanner{position:absolute;top:calc(34% + 36px);left:0;right:0;text-align:center;font-size:13px;color:#ffe9b0;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}

/* 摇杆 */
#joy{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff10;border:2px solid #ffffff2e;display:none;pointer-events:none}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:#d9b96caa;border:2px solid #ffe9b0;left:29px;top:29px}

/* 右下操作区 */
#ctrls{position:absolute;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
#skillGrid{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:7px}
.skillBtn{width:56px;height:56px;border-radius:50%;border:2.5px solid #b08a3c;background:radial-gradient(circle at 35% 30%,#3a2c14,#191108);
 color:#ffe9b0;font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;
 text-shadow:0 2px 3px #000}
.skillBtn:active{filter:brightness(1.4)}
.skillBtn .cdMask{position:absolute;inset:0;background:#00000088;display:none;align-items:center;justify-content:center;font-size:15px;color:#ffca7a}
.skillBtn .mpCost{position:absolute;bottom:2px;right:5px;font-size:9px;color:#7ab0ff;font-weight:normal}
.skillBtn.lock{filter:grayscale(1) brightness(.5)}
.skillBtn.lock .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#ffe9b0;background:#00000060}
.skillBtn.passive{border-style:dashed;filter:none}
.skillBtn .autoTag{position:absolute;top:-1px;left:-1px;width:17px;height:17px;border-radius:0 0 10px 0;
 font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;
 background:#2f8a3f;color:#e8ffe8;border:0;text-shadow:0 1px 1px #000}
.skillBtn.noauto .autoTag{background:#8a5a1a;color:#ffe9c8}
.skillBtn.noauto{filter:grayscale(.45) brightness(.78)}
.skillBtn.buffed{border-color:#5aff8a;box-shadow:0 0 14px #5aff8a88}
.skillBtn.buffed::after{content:'';position:absolute;inset:2px;border-radius:50%;border:1.5px dashed #5aff8a88}
#autoBtn{width:62px;height:62px;border-radius:50%;border:3px solid #8a7a4a;background:radial-gradient(circle at 35% 30%,#3a3418,#181408);
 color:#e8d9b0;font-size:14px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-shadow:0 1px 2px #000}
#autoBtn small{font-size:8px;font-weight:normal;color:#b8a870}
#cfgBtn{width:34px;height:34px;border-radius:50%;border:2px solid #8a7a4a;background:radial-gradient(circle at 35% 30%,#2a2418,#141008);
 color:#e8d9b0;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;
 margin-bottom:6px;text-shadow:0 1px 2px #000}
#cfgBtn:active{filter:brightness(1.35)}
#autoBtn.on{border-color:#ffca4a;background:radial-gradient(circle at 35% 30%,#8a6a18,#4a3608);box-shadow:0 0 16px #d9a53c88;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 26px #ffca4aaa}}
#leftBtns{position:absolute;left:10px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;
 grid-template-columns:46px 46px;gap:7px;pointer-events:auto}
#leftBtns .iconBtn{width:46px;height:46px;border-radius:11px;font-size:16px;font-weight:900;letter-spacing:0;
 background:linear-gradient(180deg,#241a0cc9,#120c0699);border:1.5px solid #b08a3c;line-height:1.05;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
#leftBtns .iconBtn:active{background:#3a2a10;filter:brightness(1.2)}
#leftBtns .iconBtn .sb{font-size:8px;font-weight:normal;color:#b8a870;letter-spacing:0;margin-top:1px}

/* ---------- 面板 ---------- */
#panel{position:absolute;inset:0;background:#000000a8;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#panelBox{width:92%;max-width:420px;max-height:86%;display:flex;flex-direction:column;padding:0;overflow:hidden}
#panelHead{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #5a4a28;flex:none}
#panelHead b{font-size:17px;letter-spacing:2px;color:#ffd870}
#panelClose{margin-left:auto;width:32px;height:32px;border:1px solid #b08a3c;border-radius:6px;background:#3a2a10;color:#ffe9b0;font-size:16px;cursor:pointer}
#panelBody{padding:12px;overflow-y:auto;touch-action:pan-y;flex:1}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cell{aspect-ratio:1;border:1.5px solid #5a4a28;border-radius:6px;background:#120c06;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden}
.cell img,.cell canvas{width:78%;height:78%;object-fit:contain}
.cell .qn{position:absolute;bottom:1px;right:3px;font-size:9px;color:#ffe9b0;text-shadow:0 1px 1px #000}
/* 背包角标分区（避免重叠）：
   左上 = 品质标记栈（极/劣 + 强化 +N，竖向排列，各自独立一行）
   右上 = 职业专属（战/法/道）
   右下 = 堆叠数量
   三处互不侵占：左上栈限制最大宽度，超过则缩放文字 */
.cell .marks{position:absolute;left:2px;top:2px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;pointer-events:none;max-width:calc(100% - 14px)}
.cell .mk{font-size:9px;line-height:1;padding:1px 3px;border-radius:3px;text-shadow:0 1px 1px #000;white-space:nowrap}
.cell .mk.q2s{color:#2a1c00;background:#ffca4a}          /* 小极品：金底黑字，最醒目 */
.cell .mk.q0s{color:#d8d8d0;background:#3a3a36}          /* 劣质：灰底 */
.cell .mk.pl{color:#ffd84a;background:rgba(60,42,8,.85);border:1px solid #8a6a20} /* 强化 +N */
.cell .clsTag{position:absolute;top:2px;right:3px;font-size:9px;line-height:1;padding:1px 3px;border-radius:3px;background:rgba(20,14,6,.8);text-shadow:0 1px 1px #000;pointer-events:none}
.cell .em{font-size:22px}
.q1{border-color:#8a8a82}.q2{border-color:#4a90d8}.q3{border-color:#a84ae8}.q4{border-color:#ffca4a}
.tq1{color:#d8d8d0}.tq2{color:#6ab0ff}.tq3{color:#c88aff}.tq4{color:#ffd870}
#itemDetail{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:420px;width:94%;padding:14px;z-index:41}
/* 标题画面弹窗模式：槽位覆盖/读档失败等对话框要盖过标题层(z:50) */
body.titleDlg #dtBack{z-index:55}
body.titleDlg #itemDetail{z-index:60}
/* 物品详情遮罩：z 介于"底部面板(46/40)"与"详情卡(41)"之间时详情卡仍可点，
   但遮罩盖住世界画面与右下技能区；点击遮罩任意位置即关闭详情 */
#dtBack{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.12);pointer-events:auto;cursor:pointer}
/* 存档写入失败警示条（常驻，写入成功后才收起） */
#saveWarn{position:absolute;top:calc(72px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
 z-index:44;max-width:88%;padding:7px 14px;border-radius:8px;text-align:center;
 background:linear-gradient(180deg,#8c1c14,#5a0e08);border:1.5px solid #ff6a4c;color:#ffe0d0;
 font-size:12px;font-weight:bold;line-height:1.5;box-shadow:0 0 16px #ff3c1c66;pointer-events:none}
/* 标题画面：检测到存档可能丢失时的提示条 */
#lostWarn{width:92%;max-width:420px;margin:0 auto 10px;padding:9px 12px;border-radius:8px;
 background:linear-gradient(180deg,#4a2410,#2a1408);border:1.5px solid #c88a3c;color:#ffe0b0;
 font-size:12px;line-height:1.6}
#lostWarn b{color:#ffca4a}
#lostWarn .lwBtn{margin-top:7px;display:flex;gap:6px}
#lostWarn .lwBtn button{flex:1;padding:5px 8px;font-size:11px}
.row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;border-bottom:1px dashed #3a2e18}
.row span:first-child{color:#a89058}
.equipSlot{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.bigStat{font-size:13px;line-height:2}
.bigStat b{color:#ffd870}
.mapItem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #5a4a28;border-radius:8px;margin-bottom:8px;background:#1a120866}
.mapItem .mi{flex:1}
.mapItem .mi b{font-size:15px;color:#ffe9b0}
.mapItem .mi small{display:block;color:#a89058;font-size:11px;margin-top:2px}
.shopItem{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px dashed #3a2e18}
.skItem{border:1px solid #5a4a28;border-radius:8px;padding:10px;margin-bottom:8px;background:#1a120866}
.skItem.lockd{opacity:.45}
.skItem b{color:#ffd870}
.skItem p{font-size:12px;color:#b8a870;margin-top:4px;line-height:1.5}
#toast{position:absolute;bottom:32%;left:50%;transform:translateX(-50%);background:#000000d0;border:1px solid #b08a3c;
 border-radius:8px;padding:9px 18px;font-size:13px;color:#ffe9b0;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:80%;text-align:center}
#revive{position:absolute;inset:0;background:#400505c8;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
#revive h2{color:#ff8a70;font-size:30px;letter-spacing:6px;text-shadow:0 2px 6px #000}
#revive p{margin-top:12px;color:#e8d9b0;font-size:14px}
#errFlag{position:absolute;top:40%;left:8px;right:8px;background:#800;color:#fff;font-size:11px;padding:8px;z-index:99;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<!-- 标题画面 -->
<div id="title">

/* 装备 → 所属套装列表（一件通用饰品可同属多套，按穿戴组合分别计数） */
function getSetsOf(eqId){
  const out=[];
  for(const s of SETS)if(s.ids.indexOf(eqId)>=0)out.push(s);
  return out;
}
/* 单件归属（兼容旧调用：返回优先级最高的那套） */
function getSetOf(eqId){return getSetsOf(eqId)[0]||null;}
/* 统计当前已穿戴的各套装件数 */
function setCounts(){
  const worn={};
  for(const k in equip){const e=equip[k];if(!e)continue;
    for(const s of getSetsOf(e.id))worn[s.id]=(worn[s.id]||0)+1;}
  return worn;
}
/* 当前生效的套装加成汇总：{st:{...}, luck:n, list:[...]} */
function setBonus(){
  const worn=setCounts(),out={st:{},luck:0,list:[]};
  for(const s of SETS){
    const c=worn[s.id]||0;if(c<2)continue;
    const tier=c>=6?[2,4,6]:c>=4?[2,4]:[2];
    for(const t of tier){
      const b=s['st'+t];if(!b)continue;
      for(const k in b)out.st[k]=(out.st[k]||0)+b[k];
    }
    out.list.push({set:s,count:c,tier});
    if(s.luck)out.luck+=s.luck;
  }
  return out;
}
/* 角色面板的套装进度块：列出每套的件数与档位激活情况 */
function genSetHtml(){
  const sb=setBonus();
  if(!sb.list.length)return '<div style="font-size:11px;color:#6a5a38;margin-top:8px">集齐同套装 2/4/6 件可激活档位加成（装备详情页标注「套装」）</div>';
  let html='<div style="margin-top:10px"><div style="font-size:12px;color:#ffd870;font-weight:900;margin-bottom:5px">✦ 套装加成</div>';
  for(const it of sb.list){
    const s=it.set;
    const marks=[2,4,6].map(t=>{
      const on=it.count>=t;
      const b=s['st'+t];if(!b)return '';
      const txt=Object.keys(b).map(k=>'+'+b[k]+(STAT_NAMES[k]||k)).join(' ');
      return '<span style="font-size:10px;padding:1px 6px;border-radius:4px;margin-right:4px;'+
        (on?'background:#4a3a10;color:#ffd84a;border:1px solid #8a6a20':'color:#6a5a38;border:1px solid #3a3020')+'">'+
        (on?'✓':'·')+t+'件'+txt+'</span>';
    }).join('');
    html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid '+(it.count>=6?'#8a6a20':'#5a4a28')+';border-radius:7px;margin-bottom:4px;background:rgba(0,0,0,.18)">'+
      '<b style="font-size:12px;color:'+s.color+';min-width:64px">'+s.n+'</b>'+
      '<span style="font-size:11px;color:#a89058">'+it.count+'/6件</span>'+
      '<span style="margin-left:auto">'+marks+'</span></div>';
  }
  if(sb.luck)html+='<div style="font-size:11px;color:#6ab0ff;margin-top:4px">🍀 幸运加成：金币与掉落收益 +'+Math.round(sb.luck*100)+'%</div>';
  return html+'</div>';
}

/* ============ 技能天赋树 ============ */
const TAL_MAX=3;                 // 每技能可加 3 级
const TAL_PER_LV=1;              // 每级消耗 1 技能点
const TAL_RESET_BASE=2000;       // 重置基础费用（每次递增）
function talOf(key){return (ST.talents&&ST.talents[key])||0;}
function talResetCost(){return TAL_RESET_BASE*(1+(ST.talentReset||0));}
function talentSpent(){let n=0;for(const k in ST.talents)n+=(ST.talents[k]||0);return n;}
/* 天赋汇总：各类百分比/固定加成 */
function talentBonus(){
  const out={atkPct:0,matkPct:0,defPct:0,mdefPct:0,hpPct:0,mpPct:0,
   cdCut:0,mpCut:0,dmgPct:0,healPct:0,critAdd:0,basicPct:0,rangeAdd:0,summonPct:0};
  const order=CLASSES[player.cls]?CLASSES[player.cls].skills:[];
  for(const key of order){
    const lv=talOf(key);if(!lv)continue;
    const sk=SKILLS[key];if(!sk)continue;
    /* 每个技能按其定位给予不同天赋收益 */
    if(sk.type==='passive'){                       // 被动：普攻强化
      out.basicPct+=lv*.10;out.critAdd+=lv*.02;
    }else if(sk.type==='heal'){                    // 治疗：治疗量 & CD
      out.healPct+=lv*.10;out.cdCut+=lv*.05;
    }else if(sk.type==='summon'){                  // 召唤：宠物强度
      out.summonPct+=lv*.12;
    }else if(sk.type==='buff'||sk.type==='shield'){// 增益/护盾：持续时间与CD
      out.cdCut+=lv*.06;
    }else{                                         // 输出技能：伤害/CD/耗蓝
      out.dmgPct+=lv*.08;out.cdCut+=lv*.04;out.mpCut+=lv*.05;
    }
  }
  /* 通用门槛：阶级越高收益略减，避免无脑堆满 */
  out.cdCut=Math.min(out.cdCut,.45);
  out.mpCut=Math.min(out.mpCut,.5);
  return out;
}
/* 技能实际消耗/冷却（已计入天赋） */
function skillMp(key){
  const sk=SKILLS[key];if(!sk||!sk.mp)return 0;
  const tb=talentBonus();
  return Math.max(1,Math.floor(sk.mp*(1-tb.mpCut)));
}
function skillCd(key){
  const sk=SKILLS[key];if(!sk)return 0;
  const tb=talentBonus();
  if(!sk.cd)return 0;
  return sk.cd*(1-tb.cdCut);
}
function skillDmgMul(key){
  const sk=SKILLS[key];if(!sk)return 1;
  const tb=talentBonus();
  return (sk.mult||1)*(1+tb.dmgPct);
}
function learnTalent(key){
  const sk=SKILLS[key];if(!sk){toast('技能不存在');return false;}
  if(player.level<sk.unlock){toast('需 '+sk.unlock+' 级解锁该技能');return false;}
  const cur=talOf(key);
  if(cur>=TAL_MAX){toast('「'+sk.name+'」天赋已满级');return false;}
  if((ST.skillPt||0)<TAL_PER_LV){toast('技能点不足（现有 '+(ST.skillPt||0)+' 点）');return false;}
  ST.skillPt-=TAL_PER_LV;
  ST.talents[key]=cur+1;
  recalcStats();
  SFX.lvl();
  toast('「'+sk.name+'」天赋 → Lv'+(cur+1)+'/'+TAL_MAX);
  return true;
}
function resetTalents(free){
  const spent=talentSpent();
  if(!spent){toast('尚未分配任何天赋点');return false;}
  const cost=free?0:talResetCost();
  if(!free&&ST.gold<cost){toast('金币不足（需 '+cost+'）');return false;}
  if(!free)ST.gold-=cost;
  ST.talentReset=(ST.talentReset||0)+(free?0:1);
  ST.skillPt=(ST.skillPt||0)+spent;
  ST.talents={};
  recalcStats();
  toast(free?'天赋已重置（返还 '+spent+' 点）':'已花费 '+cost+'G 重置，返还 '+spent+' 技能点');
  return true;
}

/* 挥砍偏转：攻击后的 0.3 秒内从静止角扫到接近水平再回摆 */
function weaponSwing(e){
  const t=e.weaponAnim;
  if(!(t>0))return 0;
  const p=1-t/.3;                    // 0 → 1 进度
  return -(1-Math.sin(p*Math.PI))*.95; // 中段偏移最大，两端归零（挥出再收回）
}
/* 画一把剑：以握把为原点，向 -y 方向延伸剑身（g = 2D 上下文） */
function drawBladeShape(g,st,len,thick){
  const tw=thick;
  g.fillStyle=st.blade;                       // 剑身
  g.beginPath();
  g.moveTo(-tw*.5,0);g.lineTo(tw*.5,0);
  g.lineTo(tw*.28,-len);g.lineTo(0,-len-4);g.lineTo(-tw*.28,-len);
  g.closePath();g.fill();
  g.fillStyle=st.edge;                        // 刃口高光
  g.fillRect(tw*.5-1.2,-len*.96,1.2,len*.96);
  g.fillStyle=st.guard;                       // 护手
  g.fillRect(-tw*1.5,-2.5,tw*3,3);
  g.fillStyle=st.grip;                        // 剑柄 + 配重球
  g.fillRect(-1.6,1,3.2,6.5);
  g.beginPath();g.arc(0,8.5,2.2,0,6.29);g.fill();

   g 由 render() 传入（ctx 是 render 的局部变量，模块级函数取不到） */
function drawHandWeapon(e,g,face,frame){
  if(!g)return;
  const isPl=e===player,isPet=e===pet;
  let st,len=WEAPON_LEN,grip,stOverride=null;
  if(isPl){
    st=weaponStyle(player.cls);
  }else if(isPet){
    const lvl=(pet&&pet.lvl)||0;
    st=lvl>=6?weaponStyle('womaH'):lvl>=3?weaponStyle('skelE'):weaponStyle('skel');
    grip='#d8d4c4';
  }else{
    const d=e.d||{};
    /* 人机按所扮演的职业配色；其他人形怪按自身精灵配色 */
    st=e.isBot?weaponStyle(e.botCls):weaponStyle(d.spr==='human'?d.pal:(d.pal||d.spr));
    if(d.boss){len=WEAPON_LEN+7;}                 // BOSS 武器更长更重
    else if(d.elite){len=WEAPON_LEN+3;}
    grip=d.boss?'#8a5a20':(d.elite?'#7a6020':null);
  }
  const ang=face*WEAPON_TILT+weaponSwing(e);
  g.save();
  g.translate(face*HAND_X,HAND_Y);
  g.rotate(ang);
  if(grip)st={blade:st.blade,edge:st.edge,guard:st.guard,grip:grip};
  drawBladeShape(g,st,len,3);
  /* 攻击瞬间的白色刀光（0.3 秒内淡出） */
  if(e.weaponAnim>0){
    g.globalAlpha=(e.weaponAnim/.3)*.55;
    g.strokeStyle='#ffffff';g.lineWidth=2;
    g.beginPath();g.arc(0,-len*.45,len*.62,-1.15,.45);g.stroke();
    g.globalAlpha=1;
  }
  g.restore();
}

  const n=this.ctx.sampleRate*dur,buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);

  const g=this.ctx.createGain();g.gain.value=vol||.15;
  const f=this.ctx.createBiquadFilter();f.type=fLow?'lowpass':'highpass';f.frequency.value=fLow||1200;

/* ---------------- S4.5 手感：震动 / 震屏 ----------------
   vibe()  : 手机震动。iOS Safari 无 navigator.vibrate，能力检测后静默降级。
   shake() : 渲染层震屏。与 vibe 共用 ST.vibe 开关，玩家关掉就不会再抖。 */
const VIBE_OK=!!(typeof navigator!=='undefined'&&navigator&&typeof navigator.vibrate==='function');
let _vibeLast=0;
function vibe(ms,force){
  if(!VIBE_OK||!ST.vibe)return;
  const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  /* 节流：挂机高频命中时不骚扰玩家。
     force=true 用于「阵亡」这类最高优先级事件——它必须能盖过同一帧内
     先前那次受击震动，否则 60ms 会被自己的 10ms 挡掉。 */
  if(!force&&now-_vibeLast<45)return;
  _vibeLast=now;
  try{navigator.vibrate(ms);}catch(e){}       // 隐私模式/权限被拒 → 静默忽略，绝不抛错
}
const SHAKE_DUR=0.22;                          // 震屏持续时长（秒）
function shake(amp){
  if(!ST.vibe)return;
  shakeAmp=Math.max(shakeAmp,amp||5);          // 同时多次触发时取最强，不叠加
  shakeT=SHAKE_DUR;
}

  g.fillStyle=def.pal.g;g.fillRect(0,0,Wpx,Hpx);
  for(let i=0;i<W*H/3;i++){g.fillStyle=Math.random()<.5?def.pal.g2:def.pal.g3;
   const x=rnd(0,Wpx),y=rnd(0,Hpx),s=rnd(14,46);g.beginPath();g.ellipse(x,y,s,s*rnd(.5,.9),rnd(0,3.14),0,6.29);g.fill();}
  // 装饰物（无碰撞）
  const decoN=Math.floor(W*H/28);
  for(let i=0;i<decoN;i++){
    const t=def.pal.deco;
    const kind=t==='grass'?pick(['grassT','flower','flower','grassT']):t==='cave'?pick(['bone','stalag','bone']):t==='grave'?pick(['grave','bone','grassT']):t==='lava'?pick(['lava','rock','pyre']):t==='pillar'?pick(['rock','pillar','bone']):pick(['blood','rock','blood']);
    map.deco.push({k:kind,x:rnd(40,Wpx-40),y:rnd(40,Hpx-40)});
  }
  // 障碍物（有碰撞）：散点 + 墙段走廊
  // BOSS点：对角（需先确定，障碍生成时避开）
  map.bossPt={x:Wpx-rnd(180,320),y:rnd(160,320)};
  const obsKind=t=>t==='grass'?'tree':t==='cave'?'stalag':t==='grave'?pick(['grave','rock']):t==='lava'?'rock':t==='pillar'?'pillar':'rock';
  const safeAt=(x,y)=>Math.hypot(x-map.portal.x,y-map.portal.y)>175&&Math.hypot(x-map.bossPt.x,y-map.bossPt.y)>170&&Math.hypot(x-Wpx/2,y-Hpx/2-110)>150;
  const obsN=Math.floor(W*H/55);
  for(let i=0;i<obsN;i++){
    const kind=obsKind(def.pal.deco);
    const x=rnd(60,Wpx-60),y=rnd(60,Hpx-60);
    if(!safeAt(x,y))continue;
    const sp=SPRITES[kind].f[0];
    map.obs.push({k:kind,x,y,w:sp.width,h:sp.height});
  }
  // 墙段：连续障碍形成走廊与掩体
  const wallSegs=3+Math.floor(W/18);
  for(let i=0;i<wallSegs;i++){
    const kind=obsKind(def.pal.deco);
    const sp=SPRITES[kind].f[0];
    const horiz=Math.random()<.5,len=rndi(3,6);
    const sx=rnd(130,Wpx-130),sy=rnd(130,Hpx-130);
    if(!safeAt(sx,sy))continue;
    for(let j=0;j<len;j++){
      const x=sx+(horiz?j*19:j*4),y=sy+(horiz?j*4:j*19);
      if(x<50||x>Wpx-50||y<50||y>Hpx-50)break;
      if(!safeAt(x,y))break;
      map.obs.push({k:kind,x,y,w:sp.width,h:sp.height});
    }
  }
  // 出生点：传送门上方
  map.spawn={x:map.portal.x,y:map.portal.y-110};
  map.base=c;
  return map;
}
function mapObsAt(x,y,r){
  for(const o of MAP.obs){
    if(x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)return true;
  }return false;
}
function moveEntity(e,dx,dy){
  // 逐轴移动+碰撞
  const r=10;
  let nx=clamp(e.x+dx,r,MAP.Wpx-r);
  if(!mapObsAt(nx,e.y,r))e.x=nx;
  let ny=clamp(e.y+dy,r,MAP.Hpx-r);
  if(!mapObsAt(e.x,ny,r))e.y=ny;
}
/* 怪物生成 */
function spawnMob(id,x,y){

   wanderT:0,wdx:0,wdy:0,atkT:0,stun:0,poison:0,poisonT:0,flash:0,animT:rnd(0,9),
   sx:x,sy:y,skillT:rnd(3,6),backT:0,weaponAnim:0};

}
/* 挥砍动画：任何动作（走近身/放弹幕/放技能）都触发一次手中武器挥动 */
function swingWeapon(e){if(e)e.weaponAnim=.3;}
function fillMobs(){
  MAP.mobs.length=0;
  const def=MAP.def;
  for(let i=0;i<def.max;i++)trySpawnRandomMob();
  // 精英保底：每图至少 2 只精英
  const eliteIds=def.mobs.filter(mb=>MONSTERS[mb.id].elite).map(mb=>mb.id);
  if(eliteIds.length){
    let cnt=MAP.mobs.filter(m=>m.d.elite).length;
    let guard=0;
    while(cnt<2&&guard++<8){
      const x=rnd(100,MAP.Wpx-100),y=rnd(100,MAP.Hpx-100);
      if(mapObsAt(x,y,14)||Math.hypot(x-MAP.spawn.x,y-MAP.spawn.y)<280)continue;
      spawnMob(pick(eliteIds),x,y);cnt++;

  /* 人机玩家：进入在野地图后投放（村庄/试炼塔不刷，见 spawnBots 内部守卫） */
  spawnBots();
}
/* ===== 天气专属 BOSS =====
   ① 仅在 Lv7+ 地图（骷髅洞窟以后）出现，避免新手被屠
   ② 天气切换时重新投放：旧的不匹配 BOSS 化为青烟消失，新的降临
   ③ 主动追击玩家（aggr=1 且感知半径 520），不会因玩家跑远而重置位置
   ④ 必掉 Boss 内丹；极品武器小概率掉落（见 dropLoot） */
const WEATHER_BOSS_MIN_LV=7;
function weatherBossId(){const w=curWeather();return w&&w.bossId?w.bossId:null;}
function mapAllowsWeatherBoss(){
  const d=MAP&&MAP.def;if(!d)return false;
  return (d.lv?d.lv[0]:99)>=WEATHER_BOSS_MIN_LV;
}
/* 清除当前地图上的所有天气 BOSS（含已死的残留） */
function clearWeatherBoss(){
  if(!MAP)return;
  MAP.mobs=MAP.mobs.filter(m=>!m.weatherBossKlass);
}
function spawnWeatherBoss(){
  if(!MAP||!mapAllowsWeatherBoss())return null;
  const id=weatherBossId();if(!id||!MONSTERS[id])return null;
  /* 落点：距离传送阵较远，且不在障碍里 */
  const lv=MONSTERS[id].lvHint||0;
  for(let t=0;t<24;t++){
    const x=rnd(120,MAP.Wpx-120),y=rnd(120,MAP.Hpx-120);
    if(mapObsAt(x,y,16))continue;
    if(Math.hypot(x-MAP.spawn.x,y-MAP.spawn.y)<420)continue;
    const m=spawnMob(id,x,y);
    m.isBoss=true;m.weatherBossKlass=true;
    banner('⚡ '+MONSTERS[id].n+' 降临','-'+MAP.def.n+'- · 天气之力凝聚而成');
    addLog('⚡ 天气异变：'+curWeather().n+' 引来了 '+MONSTERS[id].n+'（主动袭击玩家）');
    SFX.boss();
    return m;
  }
  return null;
}
/* 天气变化时同步天气 BOSS 的存在性 */
function weatherBossTick(){
  if(!MAP||!mapAllowsWeatherBoss())return;
  const alive=MAP.mobs.some(m=>m.weatherBossKlass&&!m.dead);
  if(alive)return;
  const want=weatherBossId();
  if(!want)return;
  /* 同一种天气 BOSS 已经死过（在冷却中）就不重复投放 */
  if(MAP.mobs.some(m=>m.weatherBossKlass))return;
  spawnWeatherBoss();
}
/* ============ 人机玩家（散人模拟）============
   在野地图生成 2~4 个"像玩家"的人机：
   · 等级贴近真人玩家 ±3 级，战士/法师/道士三种职业外观与攻击方式
   · 初次照面有 45% 概率敌意（主动袭击真人玩家）；被攻击必然反击
   · 脱战/玩家死亡后重置敌意，下次遭遇重新判定
   · 被击杀有几率爆极品首饰（玩法核心产出）；真人玩家被人机击杀也有几率掉装备 */
const BOT_NAMES=['玛法小霸王','沙城战神','一刀999','屠龙勇士','法神降临','狗道溜了','咸鱼玩家','骨灰散人','午夜屠夫','热血老兵','孤影游侠','风中追击','无名剑客','赤月猎人','白日门主','烟雨楼台','铁头娃','比奇浪人'];
const BOT_CLS_CN={warrior:'战士',mage:'法师',taoist:'道士'};
/* 按等级生成人机数值：等级贴近玩家，属性用平滑曲线，保证"打得过但要出力" */
function botDef(lv,cls){
  const ranged=cls!=='warrior';
  return{n:'散人·'+BOT_CLS_CN[cls],spr:'human',armed:1,sc:1,aggr:0,
   hp:Math.floor(150+lv*62),atk:Math.floor(7+lv*3.1),def:Math.floor(2+lv*1.05),mdef:Math.floor(2+lv*1.05),
   exp:Math.floor(25+lv*26),spd:cls==='warrior'?86:cls==='mage'?76:80,
   ranged:ranged?1:0,atkR:ranged?168:34,atkCd:cls==='warrior'?1.15:1.35,
   gold:[Math.floor(lv*3+10),Math.floor(lv*8+25)],tier:1,projColor:cls==='mage'?'#7ab0ff':'#5ad8a0'};
}
/* 生成/重置一个人机的身份（名字、等级、职业、数值、位置） */
function rollBot(m,reposition){
  const lv=clamp(player.level+rndi(-3,3),1,45);
  const cls=pick(['warrior','mage','taoist']);
  m.id='bot';m.botCls=cls;m.botName=pick(BOT_NAMES);m.botLv=lv;
  m.d=botDef(lv,cls);
  m.maxHp=m.d.hp;m.hp=m.maxHp;
  m.hostile=null;m.aggro=null;m.dead=false;m.poisonT=0;m.stun=0;m.flash=0;
  m.atkT=rnd(.5,1.5);m.wanderT=0;m.wdx=0;m.wdy=0;m.respT=0;m.botHealT=6;
  if(reposition!==false){
    for(let tries=0;tries<14;tries++){
      const x=rnd(80,MAP.Wpx-80),y=rnd(80,MAP.Hpx-80);
      if(mapObsAt(x,y,14))continue;
      if(Math.hypot(x-MAP.spawn.x,y-MAP.spawn.y)<300)continue;
      m.x=x;m.y=y;m.sx=x;m.sy=y;return;
    }
    m.x=MAP.Wpx/2;m.y=MAP.Hpx/2;m.sx=m.x;m.sy=m.y;
  }
}
/* 地图加载后投放人机：2~4 个，安全区（村庄）与试炼塔不刷 */
function spawnBots(){
  if(!MAP||ST.tower)return;
  if(MAP.def.id==='village')return;   // 村庄为安全区
  if(MAP.mobs.filter(mm=>mm.isBot).length>0)return;   // 已有人机（读档恢复场景）不重复刷
  const n=rndi(2,4);
  for(let i=0;i<n;i++){
    const m=spawnMob('bot',MAP.Wpx/2,MAP.Hpx/2);
    m.isBot=true;rollBot(m,true);
  }
}
/* 人机每帧额外逻辑：敌意判定 / 道士自愈（移动与攻击复用 updateMonster 的通用 AI） */
function updateBots(dt){
  if(!MAP||ST.tower)return;
  for(const m of MAP.mobs){
    if(!m.isBot||m.dead)continue;
    /* 玩家死亡 → 立刻脱战并重置敌意 */
    if(player.dead){if(m.aggro===player){m.aggro=null;m.hostile=null;}continue;}
    /* 视野内初次照面：45% 敌意，主动袭击真人玩家 */
    if(!m.aggro){
      const dd=dist(m,player);
      if(dd<260){
        if(m.hostile===null)m.hostile=Math.random()<.45;
        if(m.hostile){m.aggro=player;m.backT=0;}
      }
    }else if(m.aggro===player&&dist(m,player)>620){
      m.hostile=null;   // 脱战后重置，下次遭遇重新掷骰
    }
    /* 道士人机自愈：血量低于 60% 时每 6 秒回复 18% */
    if(m.botCls==='taoist'&&m.hp<m.maxHp*.6){
      m.botHealT=(m.botHealT||0)-dt;
      if(m.botHealT<=0){m.botHealT=6;m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.18);
        addText(m.x,m.y-52,'+治愈','#8aff5a',11);sparkBurst(m.x,m.y-10,'#8aff5a',6);}
    }
  }
}
/* 人机被击杀的掉落：金币必掉；35% 概率极品首饰（项链/手镯/戒指，强制小极品品质）；
   矿石/药水少量补充。极品首饰会按玩家职业过滤，保证拿到就能穿 */
function botDropLoot(m){
  const luckMul=1+nightDropBonus()+weatherDropBonus()+setBonus().luck;
  const gv=Math.max(1,Math.floor(rndi(m.d.gold[0],m.d.gold[1])*luckMul));
  MAP.drops.push({x:m.x+rnd(-16,16),y:m.y+rnd(-12,12),gold:gv,t:60,bob:0});
  if(Math.random()<.35*Math.min(2,luckMul)){
    const jew=EQUIPS.filter(e=>(e.slot==='necklace'||e.slot==='bracelet'||e.slot==='ring')
      &&e.tier>=3&&(e.cls==='all'||e.cls===player.cls));
    if(jew.length){
      const jd=pick(jew);
      MAP.drops.push({x:m.x+rnd(-24,24),y:m.y+rnd(-16,16),item:{id:jd.id,q:2,pid:0,n:1},t:150,bob:0,beam:4});
      banner('★ 极品首饰 ★','散人「'+m.botName+'」掉落了 『小极品·'+jd.n+'』');
      addLog('✦ 击败散人「'+m.botName+'」（'+BOT_CLS_CN[m.botCls]+' Lv.'+m.botLv+'），爆出极品首饰 『小极品·'+jd.n+'』');
    }
  }
  if(Math.random()<.45)MAP.drops.push({x:m.x+rnd(-18,18),y:m.y+rnd(-14,14),item:{id:'ore',pid:1,n:rndi(1,2)},t:90,bob:0});
  if(Math.random()<.3)MAP.drops.push({x:m.x+rnd(-18,18),y:m.y+rnd(-14,14),item:{id:pick(['hp_m','mp_m']),pid:1,n:1},t:90,bob:0});
}
/* 真人玩家被人机击杀的死亡掉落：
   概率 = 基础 30% + 等级差 ×2.5%（人机比玩家高则更危险），钳制 10%~60%
   掉落范围：背包全部物品 + 身上 6 部位装备中随机抽 1~3 件，直接落在原地 */
function botKillDrop(bot){
  const lvDiff=bot.botLv-player.level;
  const p=clamp(.30+lvDiff*.025,.10,.60);
  if(Math.random()>=p){addLog('您被人机「'+bot.botName+'」击杀，所幸物品没有掉落');return;}
  /* 候选池：背包物品 + 身上装备 */
  const cands=[];
  for(const it of inv)cands.push({where:'inv',it});
  for(const k in equip)if(equip[k])cands.push({where:'equip',slot:k,it:equip[k]});
  if(!cands.length){addLog('您被人机「'+bot.botName+'」击杀，但身无长物，无可失去');return;}
  const n=Math.min(cands.length,rndi(1,3));
  const invDrop=new Set(),eqDrop=[];
  for(let i=0;i<n;i++){
    const c=cands.splice(rndi(0,cands.length-1),1)[0];
    if(c.where==='inv')invDrop.add(c.it);else eqDrop.push(c.slot);
  }
  const dropped=[];
  const pushDrop=(it,label)=>{
    MAP.drops.push({x:player.x+rnd(-26,26),y:player.y+rnd(-20,20),
      item:{id:it.id,q:it.q===undefined?1:it.q,plus:it.plus||0,pid:it.pid||0,n:it.n||1},
      t:180,bob:0,beam:3});
    dropped.push(label);
  };
  /* 身上装备先处理（需清槽位 + 重算属性） */
  for(const slot of eqDrop){
    const it=equip[slot];if(!it)continue;
    pushDrop(it,'身上·'+eqName(it));
    equip[slot]=null;
  }
  /* 背包物品：倒序 splice 保证索引不乱 */
  for(let i=inv.length-1;i>=0;i--){
    if(invDrop.has(inv[i])){pushDrop(inv[i],itemName(inv[i]));inv.splice(i,1);}
  }
  if(eqDrop.length)recalcStats();
  banner('⚠ 装备掉落 ⚠','被人机「'+bot.botName+'」击杀，掉落了 '+dropped.length+' 件物品');
  addLog('☠ 被散人「'+bot.botName+'」（Lv.'+bot.botLv+'）击杀，掉落：'+dropped.join('、'));
  SFX.die();
}
/* ============ BOSS 多段特色技能 ============
   技能类型：nova(以自身为中心爆发) / volley(扇形弹幕) / slam(近身重击+击退)
             summon(召唤小怪) / burn(灼烧地带) / heal(自愈) / drain(吸血)
             rage(狂暴，血量触发，不走技能轮转) / dash(冲锋撞击) */
function mobAtkVal(m){return m.d.atk*(m.raged&&m.d.rage?m.d.rage.mult:1);}
function pickBossSkill(m){
  const list=m.d.skills;if(!list||!list.length)return null;
  const c=list.filter(sk=>{
    if(sk.t==='slam'||sk.t==='drain')return m.aggro&&dist(m,m.aggro)<(sk.r||74);
    if(sk.t==='heal')return m.hp<m.maxHp*.7;
    if(sk.t==='summon')return MAP.mobs.filter(x=>!x.dead&&x.summoned&&x.ownerM===m).length<(sk.max||4);
    return true;
  });
  return c.length?pick(c):null;
}
function bossCastSkill(m,sk){
  const t=m.aggro;if(!t)return false;
  const atk=mobAtkVal(m);
  const cry=txt=>addText(m.x,m.y-64,txt,sk.color||'#ff5a3c',14);
  switch(sk.t){
    case 'nova':{ // 地面预警圈 → 延迟爆发（复用 aoes）
      aoes.push({x:m.x,y:m.y,r:sk.r,t:1.0,max:1.0,dmg:Math.floor(atk*sk.mult),from:'m',color:sk.color});
      cry(sk.cry||m.d.n+'怒吼！');SFX.boss();return true;}
    case 'volley':{ // 扇形直线弹幕（非追踪，可走位躲避）
      const base=Math.atan2(t.y-m.y,t.x-m.x);
      for(let i=0;i<sk.n;i++){
        const a=base+(i-(sk.n-1)/2)*(sk.gap||.22);
        projectiles.push({x:m.x,y:m.y-16,vx:Math.cos(a)*sk.spd,vy:Math.sin(a)*sk.spd,
          dir:1,life:1.7,from:'m',kind:'mbolt',color:sk.color||'#ff8a2c',
          dmg:Math.floor(atk*(sk.mult||1)),src:m});
      }
      cry(sk.cry||'弹幕！');SFX.fire();return true;}
    case 'slam':{ // 近身重击 + 击退
      const dd=dist(m,t);if(dd>sk.r)return false;
      const dmg=Math.max(1,Math.floor(atk*sk.mult*rnd(.9,1.1)));
      const isPl=t===player;
      if(isPl){hurtPlayer(dmg,m);
        const kb=34/Math.max(1,dd);
        player.x+=(player.x-m.x)*kb;player.y+=(player.y-m.y)*kb;
        addText(player.x,player.y-58,'击退！','#ffca4a',11);}
      else if(pet){pet.hp-=dmg;pet.flash=.15;addText(pet.x,pet.y-40,'-'+dmg,'#ff8a70',12);if(pet.hp<=0)killPet();}
      slashes.push({x:t.x,y:t.y-10,t:.2,color:'#ff5a3c',big:1});
      sparkBurst(t.x,t.y,'#ff8a5a',12);SFX.boss();cry(sk.cry||'重击！');return true;}
    case 'dash':{ // 冲锋：朝目标高速位移，路径命中造成撞击伤害
      const dd=dist(m,t);if(dd>420||dd<50)return false;
      m.dashVX=(t.x-m.x)/dd*560;m.dashVY=(t.y-m.y)/dd*560;m.dashT=.55;m.dashHit=false;m.dashMult=sk.mult||1.5;
      cry(sk.cry||'冲锋！');SFX.boss();return true;}
    case 'summon':{ // 召唤小怪（有数量上限，防止刷屏）
      for(let i=0;i<sk.n;i++){
        const a=rnd(0,6.28),sx=m.x+Math.cos(a)*46,sy=m.y+Math.sin(a)*46;
        const sm=spawnMob(sk.mob,clamp(sx,30,MAP.Wpx-30),clamp(sy,30,MAP.Hpx-30));
        sm.summoned=true;sm.ownerM=m;sm.aggro=player;   // 召唤物直接敌对
        sparkBurst(sx,sy,'#c88aff',8);
      }
      cry(sk.cry||'召唤！');SFX.boss();return true;}
    case 'burn':{ // 在目标脚下布下持续灼烧地带
      zones.push({x:t.x,y:t.y,r:sk.r||76,t:sk.dur||4,max:sk.dur||4,
        dmg:Math.max(1,Math.floor(atk*(sk.mult||.5))),tick:.5,tickT:0,color:sk.color||'#ff6a2c'});
      cry(sk.cry||'灼烧！');SFX.fire();return true;}
    case 'heal':{ // 自我恢复
      const hv=Math.floor(m.maxHp*sk.pct);
      m.hp=Math.min(m.maxHp,m.hp+hv);
      addText(m.x,m.y-56,'+'+hv,'#8aff5a',13);sparkBurst(m.x,m.y-12,'#8aff5a',10);
      cry(sk.cry||'恢复！');return true;}
    case 'drain':{ // 近身吸取：伤害并按 60% 转化自愈
      const dd=dist(m,t);if(dd>sk.r)return false;
      const dmg=Math.max(1,Math.floor(atk*sk.mult*rnd(.9,1.1)));
      const isPl=t===player;
      if(isPl)hurtPlayer(dmg,m);
      else if(pet){pet.hp-=dmg;pet.flash=.15;addText(pet.x,pet.y-40,'-'+dmg,'#c88aff',12);if(pet.hp<=0)killPet();}
      const hv=Math.floor(dmg*.6);
      m.hp=Math.min(m.maxHp,m.hp+hv);
      addText(m.x,m.y-56,'+'+hv,'#8aff5a',12);
      slashes.push({x:t.x,y:t.y-10,t:.18,color:'#c88aff'});SFX.boss();cry(sk.cry||'吞噬！');return true;}
  }
  return false;
}
/* 灼烧地带推进：站在里面的玩家/宠物周期性掉血 */
function updateZones(dt){
  for(let i=zones.length-1;i>=0;i--){
    const z=zones[i];z.t-=dt;z.tickT-=dt;
    if(z.t<=0){zones.splice(i,1);continue;}
    if(z.tickT<=0){z.tickT=z.tick;
      if(!player.dead&&Math.hypot(player.x-z.x,player.y-z.y)<=z.r){
        hurtPlayer(z.dmg,null);addText(player.x,player.y-52,'灼烧','#ff8a5a',11);}
      if(pet&&!pet.dead&&Math.hypot(pet.x-z.x,pet.y-z.y)<=z.r){
        pet.hp-=z.dmg;pet.flash=.15;if(pet.hp<=0)killPet();}
    }
  }
}
function trySpawnRandomMob(){
  const def=MAP.def;let id;
  const tot=def.mobs.reduce((s,m)=>s+m.w,0);let r=Math.random()*tot;
  for(const mb of def.mobs){r-=mb.w;if(r<=0){id=mb.id;break;}}
  id=id||def.mobs[0].id;
  for(let tries=0;tries<12;tries++){
    const x=rnd(60,MAP.Wpx-60),y=rnd(60,MAP.Hpx-60);
    if(mapObsAt(x,y,14))continue;
    if(Math.hypot(x-MAP.spawn.x,y-MAP.spawn.y)<85)continue;
    spawnMob(id,x,y);return;
  }
}

function recalcStats(){
  const c=CLASSES[player.cls],lv=(player.level||1)-1;
  let atk=c.atk+c.atkG*lv,matk=c.matk+c.matkG*lv,def=c.def+c.defG*lv,mdef=c.mdef+c.mdefG*lv;
  let hp=c.hp+c.hpG*lv,mp=c.mp+c.mpG*lv;
  for(const k in equip){const e=equip[k];if(!e)continue;
    const d=EQMAP[e.id];if(!d)continue;
    const q=qmul(e),pm=Math.pow(1.12,e.plus||0); // 强化：主属性每级 +12%
    atk+=(d.st.atk||0)*q*pm;matk+=(d.st.matk||0)*q*pm;
    def+=(d.st.def||0)*q;mdef+=(d.st.mdef||0)*q;
    hp+=(d.st.hp||0)*q;mp+=(d.st.mp||0)*q;}
  /* 套装加成（固定值） */
  const sb=setBonus();
  for(const k in sb.st){
    const v=sb.st[k];
    if(k==='atk')atk+=v;else if(k==='matk')matk+=v;
    else if(k==='def')def+=v;else if(k==='mdef')mdef+=v;
    else if(k==='hp')hp+=v;else if(k==='mp')mp+=v;
  }
  /* 天赋加成（百分比，见 talentBonus） */
  const tb=talentBonus();
  if(tb.atkPct)atk*=1+tb.atkPct;
  if(tb.matkPct)matk*=1+tb.matkPct;
  if(tb.defPct)def*=1+tb.defPct;
  if(tb.mdefPct)mdef*=1+tb.mdefPct;
  if(tb.hpPct)hp*=1+tb.hpPct;
  if(tb.mpPct)mp*=1+tb.mpPct;
  player.atk=Math.floor(sane(atk));player.matk=Math.floor(sane(matk));player.def=Math.floor(sane(def));player.mdef=Math.floor(sane(mdef));
  // 技能增益（狂暴战意/寒冰护甲/神圣护盾）
  const bf=player.buff;
  if(bf&&bf.t>0){
    if(bf.stat==='atk')player.atk=Math.floor(player.atk*(1+bf.pct));
    else if(bf.stat==='def')player.def=Math.floor(player.def*(1+bf.pct));
    else if(bf.stat==='mdef'){player.def=Math.floor(player.def*(1+bf.pct));player.mdef=Math.floor(player.mdef*(1+bf.pct));}
    else if(bf.stat==='matk')player.matk=Math.floor(player.matk*(1+bf.pct));
  }
  const oldMax=player.maxHp;
  player.maxHp=Math.floor(sane(hp));player.maxMp=Math.floor(sane(mp));
  if(oldMax&&player.maxHp>oldMax)player.hp+=player.maxHp-oldMax;
  player.hp=clamp(sane(player.hp),0,player.maxHp);player.mp=clamp(sane(player.mp),0,player.maxMp);
}
function gainExp(n){
  n=Math.max(0,Math.floor(n*(1+nightExpBonus())));
  player.exp+=n;
  ST.stat.expEarn=(ST.stat.expEarn||0)+n;
  while(player.exp>=expNeed(player.level)){
    player.exp-=expNeed(player.level);player.level++;
    /* 技能点不再随升级发放 —— 唯一获取途径是炼化 Boss 内丹 */
    recalcStats();player.hp=player.maxHp;player.mp=player.maxMp;
    banner('升 级 啦 ！','当前等级 Lv.'+player.level);SFX.lvl();
    vibe(40);shake(5);   // 升级：一次明确的"奖赏"反馈（连升多级时会被节流保护）
    levelupFx(player.x,player.y);
    addLog('恭喜！您升到了 '+player.level+' 级');
    updateGuide();
    questNotifyCheck();checkAchv();
    saveGame();   // 升级是重要节点，立即落盘（不等 3 秒轮询）
  }
}

function calcDamage(atk,def,mult){
  atk=atk||0;def=def||0;mult=mult||1;
  let d=Math.max(1,atk*mult-def*.6);
  d*=rnd(.88,1.12);
  let crit=Math.random()<.1;
  if(crit)d*=1.6;
  return{d:Math.floor(d),crit};
}
function playerBasicAttack(){
  const t=player.target;
  if(!t||t.dead)return;
  player.acted=true;
  const c=CLASSES[player.cls];
  player.atkT=c.atkCd;player.castT=.18;player.face=t.x>=player.x?1:-1;
  swingWeapon(player);   // 出手即挥动手中武器
  SFX.swing();
  if(player.cls==='warrior'){
    let mult=1,assault=false;
    if(player.level>=SKILLS.assault.unlock&&Math.random()<.15){mult=1.6;assault=true;}
    const r=calcDamage(player.atk,t.d.def,mult);
    hurtMonster(t,r.d,assault?'#ffd84a':'#ffffff',r.crit,assault?'攻杀！':null);
    slashes.push({x:t.x,y:t.y,t:.15,color:assault?'#ffd84a':(weaponGlowColor(equip.weapon)||'#ffffff')});
  }else{
    // 法师/道士远程普攻
    const kind=player.cls==='mage'?'fireball':'charm';
    /* 远程普攻倍率：法师 .62 / 道士 .78
       参考：战士近战 1.0 且 atkCd .62s（DPS 基数 ≈1.61/s）
             法师          atkCd 1.0s（DPS 基数 ≈0.62/s）→ 需靠射程与技能补足
             道士          atkCd .8s （DPS 基数 ≈0.98/s）→ 另有宠物承担约 40% 输出 */
    const mult=player.cls==='mage'?.62:.78;
    projectiles.push({x:player.x,y:player.y-14,tgt:t,spd:420,kind,mult,from:'p',
     dmgBase:player.matk});
  }
}
function hurtMonster(m,dmg,color,isCrit,label){
  if(m.dead)return;
  dmg=Math.max(1,Math.floor(dmg));
  m.hp-=dmg;m.flash=.15;m.aggro=player;m.backT=0;
  /* 打击感：只给暴击顿帧+震屏，普攻完全不参与（保证挂机时画面稳定） */
  if(isCrit){hitStop=Math.max(hitStop,.075);shake(6);}
  vibe(isCrit?25:10);
  /* 人机被攻击 → 必定敌对反击（无论初见判定结果如何） */
  if(m.isBot)m.hostile=true;
  /* 生涯统计：累计伤害 / 命中次数 / 最大单次伤害 */
  ST.stat.dmg=(ST.stat.dmg||0)+dmg;ST.stat.hits=(ST.stat.hits||0)+1;
  if(dmg>(ST.stat.maxHit||0))ST.stat.maxHit=dmg;
  /* 连杀：同一次目标切换内的连续击杀（用于生涯最高连杀） */
  addText(m.x+rnd(-8,8),m.y-monSpr(m).f[0].height*(m.d.sc||1)-6,(label?label+' ':'')+dmg,color||(isCrit?'#ff5a3c':'#ffffff'),isCrit?17:13);
  SFX.hit();
  if(m.hp<=0)killMonster(m);
}
function killMonster(m){
  m.dead=true;m.respT=m.d.boss?60:m.d.elite?rnd(6,10):m.isBot?rnd(24,40):rnd(8,14);m.aggro=null;
  ST.kills++;MAP.mobsKilled++;
  if(m.d.boss)ST.bossKills++;
  if(m.isBot)ST.stat.botKills=(ST.stat.botKills||0)+1;
  if(m.d.elite)ST.stat.eliteKills=(ST.stat.eliteKills||0)+1;
  /* 连杀统计 */
  ST.stat.streak=(ST.stat.streak||0)+1;
  if(ST.stat.streak>(ST.stat.maxStreak||0))ST.stat.maxStreak=ST.stat.streak;
  ST.qKills[m.id]=(ST.qKills[m.id]||0)+1;
  questNotifyCheck();checkAchv();
  SFX.mdie();
  dieFx(m.x,m.y);
  /* 击杀顿帧+震屏：轻一点，避免挂机刷怪时画面持续抖 */
  hitStop=Math.max(hitStop,.05);
  shake(m.d.boss?7:4);
  gainExp(m.d.exp);
  if(pet&&!pet.dead)petGainExp(Math.max(1,Math.floor(m.d.exp*.5))); // 宠物按 50% 分经验
  // 掉落：人机走专属掉落（极品首饰），其余怪物走通用掉落
  if(m.isBot)botDropLoot(m);else dropLoot(m);
  if(m.isBot)banner('⚔ 击败散人「'+m.botName+'」',''+BOT_CLS_CN[m.botCls]+' Lv.'+m.botLv+' · 获得经验 '+m.d.exp);
  if(m.isBoss){
    banner('㊣ '+m.d.n+' 已被击杀 ㊣','90秒后刷新 · 掉落已散落一地');
  }
  if(player.target===m)player.target=null;
  /* 试炼塔：记录本层击杀进度 */
  if(ST.tower)ST.tower.killed=(ST.tower.killed||0)+1;
}
function hurtPlayer(dmg,from){
  if(player.dead)return;
  /* 记录最后攻击来源（弹幕 projectile 需回溯到 src 怪物），用于死亡掉落归属判定 */
  player.killer=from?(from.isBot?from:(from.src&&from.src.isBot?from.src:null)):null;
  /* 职业常驻减伤：战士 12% / 道士 6% —— 近战吃满伤害且被围殴，作为职业特性补偿 */
  const dr=CLASSES[player.cls].dr||0;
  if(dr>0)dmg*=(1-dr);
  if(player.shieldT>0)dmg=Math.floor(dmg*.65);
  dmg=Math.max(1,Math.floor(dmg));
  player.hp-=dmg;player.flash=.15;player.lastHurt=ST.time;
  /* 玩家挨打：顿帧 + 震屏 + 震动，这是"被打到了"最直接的体感来源 */
  hitStop=Math.max(hitStop,.06);shake(5);vibe(10);
  ST.stat.hurt=(ST.stat.hurt||0)+dmg;
  addText(player.x,player.y-46,'-'+dmg,'#ff5a3c',14);
  if(player.hp<=0){
    hitStop=Math.max(hitStop,.1);shake(9);vibe(60,true);   // 阵亡：最强一档反馈，强制绕过节流
    _vibeLast=0;   // 清掉时间窗，保证复活的第一次受击震动正常触发
    ST.stat.deaths=(ST.stat.deaths||0)+1;
    ST.stat.streak=0;                       // 阵亡断连杀
    if(player.killer)botKillDrop(player.killer);   // 被人机击杀 → 几率掉落装备
    if(ST.tower){failTower('您在第 '+ST.tower.floor+' 层阵亡');}
    player.hp=0;player.dead=true;player.reviveT=3;ST.auto=false;updateAutoBtn();
    $('revive').classList.remove('hidden');SFX.die();
    closePanel();
    saveGame();   // 阵亡会掉装备，必须立刻落盘，否则重开可"回档保装备"
  }
}
function castSkill(idx){
  const key=player.skills[idx];if(!key)return;
  const sk=SKILLS[key];
  if(player.level<sk.unlock){toast('技能「'+sk.name+'」需 '+sk.unlock+' 级解锁');return;}
  if(sk.type==='passive'){toast(sk.name+'：'+sk.desc);return;}
  if(player.cd&&player.cd[key]>0)return;
  const mpCost=skillMp(key),cdSet=skillCd(key);
  const tb=talentBonus();
  /* 天赋伤害倍率：输出类技能统一乘算 */
  const T=Math.max(1,skillDmgMul(key)/(sk.mult||1));
  if(player.mp<mpCost){toast('魔法值不足');return;}
  const t=player.target;
  if(['m','p','charge','poison'].includes(sk.type)&&(!t||t.dead)){toast('请先锁定一个目标');return;}
  player.mp-=mpCost;player.cd[key]=cdSet;player.castT=.2;player.acted=true;
  const melee=player.cls==='warrior';
  if(t&&t.x)player.face=t.x>=player.x?1:-1;
  castFx(player.x,player.y,melee?'#ff8a4c':player.cls==='mage'?'#7ab0ff':'#8aff5a');
  switch(sk.type){
    case 'm':{ // 近战单体(烈火) 或 法术单体(雷电)
      if(melee){SFX.fire();const r=calcDamage(player.atk,t.d.def,sk.mult*T);
        slashes.push({x:t.x,y:t.y,t:.22,color:'#ff6a1c',big:1});
        slashes.push({x:t.x,y:t.y-6,t:.18,color:'#ffd84a',big:0});
        sparkBurst(t.x,t.y,'#ff8a4c',14);
        hurtMonster(t,r.d,'#ff8a4c',r.crit);}
      else{SFX.bolt();boltFx(t.x,t.y);const r=calcDamage(player.matk,t.d.mdef,sk.mult*T);
        hurtMonster(t,r.d,'#ffe95a',r.crit);}
      break;}
    case 'p':{SFX.fire();projectiles.push({x:player.x,y:player.y-14,tgt:t,spd:440,kind:key,mult:sk.mult*T,from:'p',
      dmgBase:player.matk});break;}
    case 'aoe':{SFX.swing();
      slashes.push({arc:1,x:player.x,y:player.y,r:sk.r*(1+tb.rangeAdd),t:.4,color:'#ffca4a',a0:ST.time*13});
      for(const m of monsters()){if(m.dead)continue;
        if(Math.hypot(m.x-player.x,m.y-player.y)<=sk.r*(1+tb.rangeAdd)){
          const r=calcDamage(player.atk,m.d.def,sk.mult*T);
          sparkBurst(m.x,m.y,'#ffd84a',5);
          hurtMonster(m,r.d,'#ffd84a',r.crit);}}
      ringFx(player.x,player.y,sk.r*(1+tb.rangeAdd),'#ffca4a');break;}
    case 'aoeP':{SFX.ice();const cx=t.x,cy=t.y;
      for(const m of monsters()){if(m.dead)continue;
        if(Math.hypot(m.x-cx,m.y-cy)<=sk.r*(1+tb.rangeAdd)){
          const r=calcDamage(player.matk,m.d.mdef,sk.mult*T*weatherElemMul('ice'));
          hurtMonster(m,r.d,'#8ad8ff',r.crit);}}
      ringFx(cx,cy,sk.r*(1+tb.rangeAdd),'#8ad8ff');iceFx(cx,cy,sk.r*(1+tb.rangeAdd));
      sparkBurst(cx,cy,'#bfe8ff',12);particles.push({ring:1,x:cx,y:cy,r:6,max:sk.r*.7,t:.6,color:'#ffffffaa'});break;}
    case 'charge':{SFX.swing();SFX.hit();
      // 冲到目标附近（沿途扬尘）
      const dx=t.x-player.x,dy=t.y-player.y,d=Math.hypot(dx,dy)||1;
      const mv=Math.min(d-20,200);
      for(let k=0;k<8;k++){const rr=k/8;

    case 'summon':{SFX.poison();

      const keepExp=pet&&(pet.lvl||0)>=(petCarry.lvl||0)?pet.exp:(petCarry.exp||0);
      if(pet){pet.hp=0;pet.dead=true;}

        lvl:keepLv,exp:keepExp};
      petRecalc();

      summonFx(player.x,player.y);
      addLog('召唤出 '+PET_LV[pet.lvl].n+'（LV'+(pet.lvl+1)+' 攻'+Math.floor(pet.atk)+' 血'+Math.floor(pet.maxHp)+'）');break;}
    case 'heal':{SFX.heal();const h=Math.floor((player.maxHp*.3+player.matk*2)*(1+tb.healPct));
      player.hp=Math.min(player.maxHp,player.hp+h);
      ST.stat.heal=(ST.stat.heal||0)+h;
      addText(player.x,player.y-50,'+'+h,'#5aff8a',15);healFx(player.x,player.y);
      ringFx(player.x,player.y,34,'#5aff8a');break;}
    case 'buff':{SFX.lvl();
      player.buff={stat:sk.stat,pct:sk.pct,t:sk.dur*(1+talOf(key)*.06)};
      const bn={atk:'攻击提升',def:'物防提升',mdef:'双防提升'}[sk.stat]||'状态提升';
      addText(player.x,player.y-52,bn+' '+Math.round(sk.pct*100)+'%',sk.stat==='atk'?'#ff8a4c':'#7ab0ff',14);
      buffFx(player.x,player.y,sk.stat==='atk'?'#ff8a4c':'#7ab0ff');

      sparkBurst(player.x,player.y,sk.stat==='atk'?'#ffd84a':'#bfe8ff',12);
      recalcStats();break;}
    case 'maddness':{SFX.poison();
      let hit=0;
      for(const m of monsters()){if(m.dead)continue;
        if(Math.hypot(m.x-player.x,m.y-player.y)<=sk.r*(1+tb.rangeAdd)){
          m.poisonT=sk.dur;m.poison=player.matk*sk.mult*T;
          addText(m.x,m.y-50,'中毒','#8aff5a',11);
          greenFx(m.x,m.y);hit++;}}
      ringFx(player.x,player.y,sk.r*(1+tb.rangeAdd),'#8aff5a');
      particles.push({ring:1,x:player.x,y:player.y,r:8,max:sk.r*.85,t:.7,color:'#5ad84a'});
      if(hit)addLog('群体施毒命中 '+hit+' 只怪物');break;}
  }
  updateSkillBtns();
}
/* 天气对元素技能的倍率（冰/火） */
function weatherElemMul(elem){

}
function autoPotion(){
  if(player.potT>0)return;

  if(player.mp<player.maxMp*.3&&usePotionByPrefix('mp'))player.potT=1.6;
}
function usePotionByPrefix(pre){
  for(let i=0;i<inv.length;i++){const it=inv[i];
    if(it.id.startsWith(pre)&&POTMAP[it.id]){useInvItem(i,true);return true;}}

}
/* 玩家更新 */
function updatePlayer(dt){
  if(player.hp>player.maxHp)player.hp=player.maxHp;
  if(player.mp>player.maxMp)player.mp=player.maxMp;
  if(player.dead){
    player.reviveT-=dt;
    $('reviveTip').textContent=Math.ceil(player.reviveT)+' 秒后回城复活…';
    if(player.reviveT<=0){
      player.dead=false;$('revive').classList.add('hidden');
      switchMap('village');
      player.hp=player.maxHp;player.mp=player.maxMp;
      addLog('您已在玛法村复活');
    }
    return;
  }
  player.atkT-=dt;player.castT-=dt;player.flash-=dt;player.potT-=dt;player.castT=Math.max(player.castT,0);
  if(player.weaponAnim>0)player.weaponAnim=Math.max(0,player.weaponAnim-dt);
  if(pet&&pet.weaponAnim>0)pet.weaponAnim=Math.max(0,pet.weaponAnim-dt);
  /* 施法硬直 castT 仅用于播放施法动作，不再作为普攻的前置条件。
     普攻与技能改为由 player.acted 做「同帧二选一」，既避免一帧双伤，
     又不会让"放技能"牺牲后续普攻窗口（原实现会导致技能拖慢输出）。 */
  if(player.shieldT>0)player.shieldT-=dt;
  if(player.buff&&player.buff.t>0){player.buff.t-=dt;
    if(player.buff.t<=0){player.buff=null;recalcStats();addText(player.x,player.y-50,'增益结束','#a89058',12);}}
  for(const k in player.cd)if(player.cd[k]>0)player.cd[k]-=dt;
  // 移动
  let mx=0,my=0;
  if(joy.active){mx=joy.dx;my=joy.dy;}
  else if(ST.auto){const d=autoMove();mx=d.x;my=d.y;}
  const spd=CLASSES[player.cls].spd*weatherSpd();
  player.moving=Math.hypot(mx,my)>.1;
  if(player.moving){
    const l=Math.hypot(mx,my);mx/=l;my/=l;
    // 卡障碍检测
    const ox=player.x,oy=player.y;
    moveEntity(player,mx*spd*dt,my*spd*dt);
    const moved=Math.hypot(player.x-ox,player.y-oy);
    if(moved<spd*dt*.25){player.stuckT=(player.stuckT||0)+dt;}
    else player.stuckT=0;
    if(player.stuckT>.4){player.unstickT=.5;player.stuckT=0;player.unstickA=Math.random()<.5?1:-1;}
    if(player.unstickT>0){player.unstickT-=dt;
      moveEntity(player,-my*spd*dt*player.unstickA,mx*spd*dt*player.unstickA);}
    if(Math.abs(mx)>.15)player.face=mx>0?1:-1;
    player.animT+=dt*9;
  }else player.animT+=dt*2;
  // 索敌
  acquireTarget();
  const t=player.target,c=CLASSES[player.cls];
  /* 本帧出手标记：普攻与技能共享，保证同一帧只出一次手。
     注意这不是原先的 castT 互斥——markActed 只在当前帧生效，
     下一帧立刻放开，因此「放技能」不会再牺牲后续普攻的输出窗口。 */
  player.acted=false;
  // 挂机（技能优先于普攻，同帧内二选一）
  if(ST.auto)autoCast();
  // 普攻
  if(!player.acted&&t&&!t.dead){
    const d=dist(player,t);
    if(d<=c.range&&player.atkT<=0)playerBasicAttack();
  }
  // 挂机喝药（施法已在上面按"技能优先"处理）
  if(ST.auto)autoPotion();
  // 脱战回血（白天回血更快，夜间稍慢）
  if(ST.time-player.lastHurt>5&&player.hp<player.maxHp){
    player.regenT+=dt;
    if(player.regenT>1){player.regenT=0;
      const rg=curPhase().regen;
      player.hp=Math.min(player.maxHp,player.hp+(player.maxHp*.03+5)*rg);
      player.mp=Math.min(player.maxMp,player.mp+(player.maxMp*.04+3)*rg);}
  }
}
function acquireTarget(){
  const cur=player.target;
  if(cur&&!cur.dead&&dist(player,cur)<620)return;
  player.target=nearestMob(player,ST.auto?Infinity:330,false); // 挂机遇 BOSS 也自动选中
}
function nearestMob(pt,range,excludeBoss){
  let best=null,bd=range===Infinity?Infinity:range;
  for(const m of monsters()){
    if(m.dead)continue;
    if(excludeBoss&&m.d.boss)continue;
    const d=dist(pt,m);
    if(d<bd){bd=d;best=m;}
  }
  return best;
}
function autoMove(){
  // 挂机放风筝：主动打 BOSS，残血时沿弧线拉开距离保命，回血后回头继续打
  const boss=MAP.mobs.find(m=>!m.dead&&m.d.boss&&m.aggro===player);
  if(boss){
    const bd=dist(player,boss),hpR=player.hp/player.maxHp;
    // 进入：残血且被 BOSS 追；退出：血量回复或已拉开；双阈值防抖
    player.kiting=(bd<250&&hpR<.35)?true:((hpR>=.55||bd>310)?false:!!player.kiting);
    if(player.kiting){
      if(player.kiteSide===undefined){
        /* 贴边时不要随机——随机到"朝墙"的那一侧会导致玩家顶着墙跑，
           应先判断所处边界，把绕行方向定成"沿墙滑行"的那一侧。 */
        const M=64;
        const nearL=player.x<M, nearR=player.x>MAP.Wpx-M;
        const nearT=player.y<M, nearB=player.y>MAP.Hpx-M;
        if(nearL||nearR){
          // 贴着左右墙：沿 y 轴滑行，方向取远离 BOSS 的一侧
          player.kiteSide=(player.y-boss.y)<0?1:-1;
        }else if(nearT||nearB){
          player.kiteSide=(player.x-boss.x)<0?1:-1;
        }else{
          player.kiteSide=Math.random()<.5?1:-1;
        }
      }
      const dx=(player.x-boss.x)/bd,dy=(player.y-boss.y)/bd;
      const mk=side=>{
        const vx=dx*.85-dy*side*.6,vy=dy*.85+dx*side*.6;
        const l=Math.hypot(vx,vy)||1;return{x:vx/l,y:vy/l};
      };
      let mv=mk(player.kiteSide);
      // 前方是墙/障碍/地图边界：翻转绕行方向沿墙滑，而不是顶墙卡死
      /* 探测距离随移动速度放大（原固定 72px 在提速后反应不及） */
      const look=Math.max(72,CLASSES[player.cls].spd*.62);
      const ahead=(p,r)=>p.x<r||p.y<r||p.x>MAP.Wpx-r||p.y>MAP.Hpx-r||mapObsAt(p.x,p.y,r);
      if(ahead({x:player.x+mv.x*look,y:player.y+mv.y*look},12)){
        player.kiteSide=-player.kiteSide;
        mv=mk(player.kiteSide);
        if(ahead({x:player.x+mv.x*look,y:player.y+mv.y*look},12)){
          // 两侧都堵：退化为纯侧向沿墙滑行，并确保该方向本身可通行
          const s1={x:-dy*player.kiteSide,y:dx*player.kiteSide};
          const s2={x:dy*player.kiteSide,y:-dx*player.kiteSide};
          const ok1=!ahead({x:player.x+s1.x*look,y:player.y+s1.y*look},12);
          const ok2=!ahead({x:player.x+s2.x*look,y:player.y+s2.y*look},12);
          mv=(ok1||!ok2)?s1:s2;
        }
      }
      return mv;
    }
  }
  const t=player.target;
  if(!t)return{x:0,y:0};
  const c=CLASSES[player.cls];
  const d=dist(player,t);
  if(d>c.range*.92){return{x:t.x-player.x,y:t.y-player.y};}
  return{x:0,y:0};
}
function autoCast(){
  const order=CLASSES[player.cls].skills;
  const idxOf=k=>order.indexOf(k);
  const on=k=>ST.autoSkill[idxOf(k)]!==false; // 该技能是否允许自动释放
  const cfgOf=k=>Object.assign({},ST.autoCfg,ST.autoSkillCfg[k]||{}); // 全局默认 + 技能独立覆盖
  // 道士优先召唤（受召唤技能自身开关控制）
  if(player.cls==='taoist'&&on('summon')&&(!pet||pet.dead)&&player.level>=SKILLS.summon.unlock&&(!player.cd.summon||player.cd.summon<=0)){
    castSkill(idxOf('summon'));return;
  }
  // 治疗：低于配置阈值且自身开关开启
  if(player.cls==='taoist'&&on('heal')&&player.level>=SKILLS.heal.unlock&&(!player.cd.heal||player.cd.heal<=0)){
    const hc=cfgOf('heal');
    if(player.hp<player.maxHp*(hc.hpPct/100)){castSkill(idxOf('heal'));return;}
  }
  const cnt=monsters().filter(m=>!m.dead&&dist(m,player)<170).length;
  for(const key of order){
    const sk=SKILLS[key];
    if(sk.type==='passive'||sk.type==='summon'||sk.type==='heal')continue;
    if(!on(key))continue;
    if(player.level<sk.unlock)continue;
    if(player.cd[key]&&player.cd[key]>0)continue;
    const need=skillMp(key);
    if(player.mp<need)continue;
    const c=cfgOf(key);
    // 魔法保留：低于阈值时不再为普通输出消耗魔法（保命/召唤优先）
    if(c.mpKeep>0&&player.mp-player.mpKeep<need)continue;
    // 群体技能需要足够敌人数
    if((sk.type==='aoe'||sk.type==='aoeP'||sk.type==='maddness')&&cnt<c.cnt)continue;
    // 单体技能需要锁定目标
    if((sk.type==='m'||sk.type==='p'||sk.type==='charge'||sk.type==='poison')&&!player.target)continue;
    if(sk.type==='poison'&&player.target&&player.target.poisonT>0)continue;
    if(sk.type==='shield'&&player.shieldT>0)continue;
    // 增益技能：需要存在敌人且自身未处于增益中
    if(sk.type==='buff'){
      if(player.buff&&player.buff.t>0)continue;
      if(!player.target)continue;
      const bc=cfgOf(key);
      if(player.hp<player.maxHp*(bc.hpPct/100))continue; // 残血时优先逃跑/喝药，不放增益
    }
    castSkill(order.indexOf(key));return;
  }
}
/* 怪物更新 */
function updateMonster(m,dt){
  if(m.dead){m.respT-=dt;
    if(m.respT<=0){
      /* 试炼塔怪物不复活，必须清空才能过关 */
      if(m.towerMob){m.dead=true;m.respT=9999;return;}
      /* 人机重生：换一个身份（新名字/等级/职业），换一个位置 */
      if(m.isBot){rollBot(m,true);return;}
      m.dead=false;m.hp=m.maxHp;m.x=m.sx;m.y=m.sy;m.aggro=null;m.poisonT=0;m.stun=0;
      if(m.d.boss&&MAP.def.id===player.mapId)banner('⚠ '+m.d.n+' 已降临','-'+MAP.def.n+'-');
      if(m.d.boss)SFX.boss();
    }return;}
  m.flash-=dt;m.animT+=dt*6;m.atkT-=dt;
  if(m.weaponAnim>0)m.weaponAnim=Math.max(0,m.weaponAnim-dt);
  if(m.stun>0){m.stun-=dt;return;}
  /* BOSS 狂暴：血量低于阈值时一次性触发（不走技能轮转） */
  if(m.d.boss&&m.d.rage&&!m.raged&&m.hp<m.maxHp*m.d.rage.at){
    m.raged=true;
    banner('⚠ '+m.d.n+' 进入狂暴！','攻击 +'+Math.round((m.d.rage.mult-1)*100)+'% · 速度提升');
    sparkBurst(m.x,m.y-10,'#ff3c1c',18);SFX.boss();
  }
  /* 冲锋中：高速位移 + 路径撞击判定 */
  if(m.dashT>0){
    m.dashT-=dt;
    moveEntity(m,m.dashVX*dt,m.dashVY*dt);
    particles.push({x:m.x+rnd(-8,8),y:m.y+rnd(-6,6),vx:rnd(-20,20),vy:rnd(-20,20),t:.3,color:'#ffca4a',r:rnd(2,4),g:0});

      if(!player.dead&&dist(m,player)<34){
        m.dashHit=true;
        hurtPlayer(Math.max(1,Math.floor(mobAtkVal(m)*(m.dashMult||1.5)*rnd(.9,1.1))),m);
        slashes.push({x:player.x,y:player.y-10,t:.2,color:'#ffca4a',big:1});SFX.boss();
      }else if(pet&&!pet.dead&&dist(m,pet)<30){
        m.dashHit=true;const pd=Math.floor(mobAtkVal(m)*(m.dashMult||1.5)*.8);pet.hp-=pd;pet.flash=.2;
        addText(pet.x,pet.y-40,'-'+pd,'#ff8a70',12);if(pet.hp<=0)killPet();
      }
    }
    if(m.dashT<=0){m.dashVX=0;m.dashVY=0;}
    return;
  }
  // 中毒
  if(m.poisonT>0){m.poisonT-=dt;
    m.poisonTick=(m.poisonTick||0)-dt;
    if(m.poisonTick<=0){m.poisonTick=1;
      m.hp-=m.poison;addText(m.x,m.y-30,Math.floor(m.poison),'#8aff5a',11);
      if(m.hp<=0){killMonster(m);return;}}}
  const h=player.dead?null:(m.d.aggr&&dist(m,player)<(m.d.boss?420:300)&&!player.dead?player:null);
  const hp=pet&&!pet.dead&&dist(m,pet)<300?pet:null;
  const tgt=h||hp;
  if(tgt)m.aggro=tgt;
  else if(m.aggro){
    // 脱战判定
    const far=dist(m,m.aggro)>560||(m.aggro===player&&player.dead)||(m.aggro===pet&&pet.dead);
    if(far){m.aggro=null;m.backT=0;}
  }
  if(m.aggro){
    const t=m.aggro,d=dist(m,t);
    if(d>m.d.atkR*1.05){
      const spd=m.d.spd*(m.raged&&m.d.rage?m.d.rage.spd:1);   // 狂暴加移速
      const dx=(t.x-m.x)/d,dy=(t.y-m.y)/d;
      moveEntity(m,dx*spd*dt,dy*spd*dt);
      m.face=t.x>=m.x?1:-1;
    }else if(m.atkT<=0){
      m.atkT=m.d.atkCd;m.face=t.x>=m.x?1:-1;
      swingWeapon(m);   // 出手即挥动手中武器
      const isPl=t===player;
      /* 昼夜影响怪物攻击力（夜间更强） */
      const phAtk=curPhase().mobAtk;
      if(m.d.ranged){
        const pdmg=Math.max(1,Math.floor((mobAtkVal(m)*phAtk)-(isPl?player.def:5)));
        /* 人机法师/道士发射职业色法弹；其余怪物沿用斧头/黑斧 */
        if(m.isBot)projectiles.push({x:m.x,y:m.y-16,tgt:t,spd:340,kind:'mbolt',color:m.d.projColor,from:'m',dmg:pdmg,src:m});
        else projectiles.push({x:m.x,y:m.y-16,tgt:t,spd:340,kind:m.d.boss?'darkaxe':'axe',from:'m',dmg:pdmg,src:m});
      }else{

        if(isPl)hurtPlayer(dmg,m);

          if(pet.hp<=0)killPet();}

        const sk=m.d.skills?pickBossSkill(m):{t:'nova',cd:m.d.skill.cd,r:m.d.skill.r,mult:m.d.skill.mult,color:'#ff5a3c',cry:m.d.n+'怒吼！'};
        if(sk&&bossCastSkill(m,sk))m.skillT=sk.cd||6;
        else m.skillT=1.1;   // 条件不满足（如近身技够不着），稍后重试
      }
    }
  }else{
    // 巡逻
    m.wanderT-=dt;
    if(m.wanderT<=0){m.wanderT=rnd(1.5,3.5);
      if(Math.random()<.4){m.wdx=0;m.wdy=0;}
      else{const a=rnd(0,6.28);m.wdx=Math.cos(a);m.wdy=Math.sin(a);}}
    if(m.wdx||m.wdy){
      moveEntity(m,m.wdx*m.d.spd*.35*dt,m.wdy*m.d.spd*.35*dt);
      if(m.wdx)m.face=m.wdx>0?1:-1;
      m.animT+=dt*3;
    }
    // 缓慢回家回血
    if(!m.aggro&&m.hp<m.maxHp){m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.02*dt);}
  }
}
/* ============ 宠物进化系统 ============
   三阶段：骷髅卫士 → 骷髅统领 → 神兽麒麟
   阶段由"进化材料 + 等级门槛"共同决定，进化后名字/颜色/属性倍率全面强化 */
const PET_STAGES=[
 {id:0,n:'骷髅卫士',c:'#e8e4d8',spr:'h_skel',  need:0,  hpM:1,   atkM:1,   spd:120,desc:'道士最初召唤的白骨卫士'},
 {id:1,n:'骷髅统领',c:'#c88aff',spr:'h_skelE', need:60, hpM:1.5, atkM:1.45,spd:135,desc:'统御白骨的精锐，攻守俱增'},
 {id:2,n:'神兽麒麟',c:'#ffd870',spr:'h_womaL', need:180,hpM:2.4, atkM:2.3, spd:150,desc:'传说神兽，可抗可打，威震一方'}
];
function petStageOf(){return PET_STAGES[clamp(petCarry.stage||0,0,PET_STAGES.length-1)];}
function petNextStage(){const s=(petCarry.stage||0);return s+1<PET_STAGES.length?PET_STAGES[s+1]:null;}
function petCanEvolve(){
  const nx=petNextStage();
  if(!nx)return false;
  if((petCarry.lvl||0)<PET_MAX)return false;      // 需满级（LV6）
  if((ST.stat.eliteKills||0)+(ST.bossKills||0)<nx.need)return false;
  return true;
}
/* 进化条件进度（用于面板展示） */
function petEvolveProgress(){
  const nx=petNextStage();if(!nx)return null;
  const lvNeed=PET_MAX,lvCur=Math.min(petCarry.lvl||0,lvNeed);
  const kNeed=nx.need,kCur=Math.min((ST.stat.eliteKills||0)+(ST.bossKills||0),kNeed);
  return {nx,lvCur,lvNeed,kCur,kNeed,ok:petCanEvolve()};
}
function petEvolve(){
  if(!petStageOf())return false;
  if(!petCanEvolve()){const p=petEvolveProgress();
    if(p)toast('进化条件未满足：等级 '+p.lvCur+'/'+p.lvNeed+' · 精英/BOSS击杀 '+p.kCur+'/'+p.kNeed);
    return false;}
  petCarry.stage=(petCarry.stage||0)+1;
  const st=petStageOf();
  ST.setOwn=ST.setOwn||{};ST.setOwn['pet_'+st.id]=1;
  petCarry.lvl=0;petCarry.exp=0;              // 进化后等级重置，但基础倍率大幅提升
  if(pet){pet.lvl=0;pet.exp=0;petRecalc();pet.hp=pet.maxHp;}
  banner('✦ 宠物进化 ✦',st.n+' 诞生了！');
  addLog('🐾 骷髅卫士进化为 '+st.n+'（属性倍率 ×'+st.hpM+'）');
  SFX.lvl();
  petEvolveFx(pet?pet.x:player.x,pet?pet.y:player.y);
  checkAchv();
  return true;
}
function petEvolveFx(x,y){
  for(let i=0;i<30;i++){const a=rnd(0,6.28),rr=rnd(10,46);
    particles.push({x:x+Math.cos(a)*rr,y:y+Math.sin(a)*rr*.5,vx:Math.cos(a)*30,vy:rnd(-120,-50),
      t:rnd(.7,1.2),color:pick(['#ffd870','#fff8d0','#c88aff','#e8e4d8']),r:rnd(2,4.5),g:0});}
  particles.push({ring:1,x,y,r:10,max:80,t:.9,color:'#ffd870'});

/* 宠物成长：属性随等级、道术、进化阶段重算 */
function petRecalc(){
  if(!pet)return;
  const st=petStageOf();
  const ratio=(1+pet.lvl*.32)*st.hpM;
  pet.maxHp=(56+player.matk*2.1)*ratio;
  pet.atk=(7+player.matk*.52)*ratio;
  pet.spd=st.spd;
  /* 天赋「召唤」强化：宠物整体强度 */
  const tb=talentBonus();
  if(tb.summonPct){pet.maxHp*=(1+tb.summonPct);pet.atk*=(1+tb.summonPct);}
  if(pet.hp>pet.maxHp)pet.hp=pet.maxHp;
}
function petGainExp(v){
  if(!pet||pet.dead||pet.lvl>=PET_MAX)return;
  pet.exp+=v;
  petCarry.lvl=pet.lvl;petCarry.exp=pet.exp;
  while(pet.lvl<PET_MAX&&pet.exp>=PET_LV[pet.lvl+1].exp){
    pet.lvl++;
    petRecalc();
    pet.hp=pet.maxHp;
    petCarry.lvl=pet.lvl;petCarry.exp=pet.exp;
    if(pet.lvl>=PET_MAX)ST.petMaxed=true; // 成就：满级
    addText(pet.x,pet.y-46,'升级！LV'+(pet.lvl+1),PET_LV[pet.lvl].c,14);
    addLog(petStageOf().n+' 进阶为 '+PET_LV[pet.lvl].n+'（LV'+(pet.lvl+1)+'）');
    SFX.lvl();
    if(pet.lvl>=PET_MAX&&petCanEvolve())
      addLog('★ '+petStageOf().n+' 已满级，可前往「宠物」面板进行进化解锁新形态！');
    checkAchv();
  }
}
function killPet(){
  if(!pet)return;
  pet.hp=0;pet.dead=true;pet.lvl=0;pet.exp=0;
  petCarry.lvl=0;petCarry.exp=0;               // 进化阶段保留，仅等级归零
  addLog('☠ '+petStageOf().n+'阵亡，等级与属性已重置（进化形态保留）');
}
function updatePet(dt){
  if(!pet||pet.dead)return;
  pet.animT+=dt*7;pet.atkT-=dt;
  let t=pet.target;
  if(player.target&&!player.target.dead&&player.target.d.boss&&dist(player,player.target)<420){
    // 主人手动锁定 BOSS：宠物优先协助攻击（挂机时主人永不锁 BOSS，不受影响）
    t=player.target;pet.target=t;
  }else{
    if(!t||t.dead||dist(pet,t)>380){
      t=nearestMob(pet,340,true); // 宠物永不主动招惹 BOSS
      pet.target=t;
    }
    if(!t&&player.target&&!player.target.dead&&dist(player,player.target)<420)t=player.target;
  }
  if(t){
    const d=dist(pet,t);
    if(d>36){const dx=(t.x-pet.x)/d,dy=(t.y-pet.y)/d;
      moveEntity(pet,dx*(pet.spd||120)*dt,dy*(pet.spd||120)*dt);pet.face=t.x>=pet.x?1:-1;}
    else if(pet.atkT<=0){
      pet.atkT=.9;pet.face=t.x>=pet.x?1:-1;
      swingWeapon(pet);
      const dmg=Math.max(1,Math.floor(pet.atk*rnd(.8,1.2)-t.d.def*.5));
      hurtMonster(t,dmg,'#e8d9b0');
      slashes.push({x:t.x,y:t.y-10,t:.12,color:'#e8d9b0'});
    }
  }else{
    const d=dist(pet,player);
    if(d>70){const dx=(player.x-pet.x)/d,dy=(player.y-pet.y)/d;
      moveEntity(pet,dx*150*dt,dy*150*dt);}
  }
}
/* 投射物/AOE/粒子 */
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    /* 直线弹幕（BOSS volley）：不追踪，走固定方向，可走位躲避 */
    if(p.dir){
      p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      let hit=null;
      if(!player.dead&&Math.hypot(player.x-p.x,player.y-p.y)<17)hit=player;
      else if(pet&&!pet.dead&&Math.hypot(pet.x-p.x,pet.y-p.y)<15)hit=pet;
      if(hit){
        if(hit===player)hurtPlayer(Math.max(1,Math.floor(p.dmg*rnd(.85,1.15))),p);
        else{pet.hp-=p.dmg;pet.flash=.15;if(pet.hp<=0)killPet();}
        sparkBurst(p.x,p.y,p.color||'#ff8a2c',6);
        projectiles.splice(i,1);continue;
      }
      if(p.life<=0){projectiles.splice(i,1);continue;}
      particles.push({x:p.x,y:p.y,vx:rnd(-10,10),vy:rnd(-10,10),t:.2,color:p.color||'#ff8a2c',r:rnd(1.5,3)});
      continue;
    }
    const t=p.tgt;
    if(!t||(p.from==='m'?(t===player&&player.dead):(t.dead))){
      projectiles.splice(i,1);continue;}
    const tx=t.x,ty=t.y-(t===player?20:14);
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    const step=p.spd*dt;
    if(d<=step+8){
      // 命中
      if(p.from==='p'){
        const r=calcDamage(p.dmgBase,t.d.mdef,p.mult);
        hurtMonster(t,r.d,p.kind==='ice'?'#8ad8ff':p.kind==='charm'?'#ffe95a':'#ff8a4c',r.crit);
        if(p.kind==='fireball'||p.kind==='thunder')SFX.fire();
      }else{
        if(t===player)hurtPlayer(Math.max(1,Math.floor(p.dmg*rnd(.85,1.15))),p);
        else if(pet){pet.hp-=p.dmg;pet.flash=.15;if(pet.hp<=0)killPet();}
      }
      projectiles.splice(i,1);continue;
    }
    p.x+=dx/d*step;p.y+=dy/d*step;
    p.px=dx/d;p.py=dy/d;
    // 法术飞行物拖尾
    if(p.from==='p')particles.push({x:p.x,y:p.y,vx:rnd(-12,12),vy:rnd(-12,12),t:.22,
      color:p.kind==='charm'?'#ffe95a':'#ff8a4c',r:rnd(2,3.5),g:0});
    if(p.kind==='fireball'||p.kind==='charm')particles.push({x:p.x,y:p.y,vx:rnd(-14,14),vy:rnd(-14,14),t:.3,color:p.kind==='fireball'?'#ff8a2c':'#ffd84a',r:rnd(1.5,3)});
  }
}

function updateDrops(dt){
  for(let i=MAP.drops.length-1;i>=0;i--){
    const d=MAP.drops[i];d.t-=dt;d.bob+=dt*3;
    if(d.t<=0){
      /* 超时未拾取：地面装备/道具自动折算成金币，避免"白打一场"
         金币掉落本身视作被地图回收（不折算，防止挂机无限刷币） */
      if(d.item){
        const price=convertPrice(d.item)*(Math.max(1,Math.floor(Number(d.item.n)||1)));
        if(price>0){
          ST.gold=clampGold((ST.gold||0)+price);
          ST.stat.goldEarn=(ST.stat.goldEarn||0)+price;
          ST.stat.dropConv=(ST.stat.dropConv||0)+1;
        }
      }
      MAP.drops.splice(i,1);continue;
    }
    // 范围内磁吸自动拾取
    if(!player.dead){
      const dd=dist(d,player);
      if(dd<130&&dd>1){
        const pull=(130-dd)/130*300+60;
        d.x+=(player.x-d.x)/dd*pull*dt;
        d.y+=(player.y-d.y)/dd*pull*dt;
      }
      if(dd<32){
        // 自动拾取类型过滤
        const pk=ensureAutoPickCfg();
        const isGold=!!d.gold;
        let allow=true;
        if(isGold)allow=pk.gold!==false;
        else if(d.item.pid){
          /* 内丹单独一档开关；其余药水/矿石归入 pot */
          const pdef=POTMAP[d.item.id];
          allow=pdef&&pdef.dan?(pk.dan!==false):(pk.pot!==false);
        }else{
          const edef=EQMAP[d.item.id];
          allow=pk.eq!==false&&(edef?pk.eqT[edef.tier]!==false:false);
        }
        if(!allow)continue; // 不拾取该类型，留在原地
        MAP.drops.splice(i,1);
        if(d.gold){ST.gold+=d.gold;ST.stat.goldEarn=(ST.stat.goldEarn||0)+d.gold;addText(player.x,player.y-52,'+'+d.gold+' 金币','#ffd84a',12);SFX.gold();}
        else{if(addInv(d.item)){SFX.pickup();
          const def=d.item.pid?POTMAP[d.item.id]:EQMAP[d.item.id];
          const qn=d.item.q===2?'小极品·':d.item.q===0?'劣质·':'';
          if(!d.item.pid&&d.item.q===2)ST.q2Got++;
          if(!d.item.pid&&def.tier>=4){ST.t4Got++;banner('★ '+def.n+' ★',d.item.q===2?'小极品传说中的神兵利器！':'传说中的神兵利器！');}
          else if(def.tier>=3)banner('恭喜获得 '+qn+def.n,d.item.q===2?'小极品！':'祖玛级紫装入手！');
          addLog('获得 『'+qn+def.n+'』');
          checkAchv();}
          else{
            // 背包已满 → 若开启自动出售，清理白色装备后再试
            if(ST.autoSellFull&&autoSellWhite()){
              if(addInv(d.item)){addLog('自动出售装备腾出背包空间');
                const def2=d.item.pid?POTMAP[d.item.id]:EQMAP[d.item.id];
                if(d.item.id==='ore')ST.stat.oreGet=(ST.stat.oreGet||0)+(d.item.n||1);
                addLog('获得 『'+(d.item.q===2?'小极品·':'')+def2.n+'』');}
              else{MAP.drops.push(d);toast('背包已满（没有可自动出售的装备）');break;}
            }else{MAP.drops.push(d);toast('背包已满');break;}
          }}
        continue;
      }
    }
  }
}

/* ---------------- S8 掉落与物品 ---------------- */
function rollEquipTier(mapDef,isBoss,elite){
  const base=isBoss?3:elite?2:1;
  let tier=base;
  const r=Math.random();
  if(r<.12)tier=Math.min(4,base+1);
  else if(r<.4&&base<3)tier=base+ (Math.random()<.3?1:0);
  // 小怪也可能出高级
  if(!isBoss&&!elite&&Math.random()<.04)tier=Math.min(4,tier+2);
  return clamp(tier,1,4);
}
function dropLoot(m){
  const d=m.d;
  /* 收益增益：昼夜（夜间更丰）+ 天气 + 套装「幸运机缘」 */
  const luckMul=1+nightDropBonus()+weatherDropBonus()+setBonus().luck;
  /* 金币：普通怪产出下调（控制金币消耗），精英/BOSS 保持以维持高价值目标感 */
  const goldScale=d.boss?1:d.elite?.82:.62;
  const gv=Math.max(1,Math.floor(rndi(d.gold[0],d.gold[1])*luckMul*goldScale));
  MAP.drops.push({x:m.x+rnd(-14,14),y:m.y+rnd(-10,10),gold:gv,t:60,bob:0});
  /* 药水：掉落几率下调（原 30%），减少无成本续航，让购药成为真实金币消耗 */
  if(Math.random()<.17){const pid=pick(['hp_s','hp_s','hp_m','mp_s','mp_m']);
    MAP.drops.push({x:m.x+rnd(-18,18),y:m.y+rnd(-12,12),item:{id:pid,pid:1,n:1},t:60,bob:0});}
  /* 黑铁矿石（强化材料）：BOSS 必掉 1~3，精英 45%，普通怪 8% */
  const oreP=(d.boss?1:d.elite?.45:.08)*luckMul;
  if(Math.random()<oreP)
    MAP.drops.push({x:m.x+rnd(-16,16),y:m.y+rnd(-14,14),item:{id:'ore',pid:1,n:d.boss?rndi(1,3):1},t:90,bob:0});
  /* Boss 内丹：唯一产出 —— 击杀任意 BOSS 必掉 1 颗（技能点道具），
     精英小概率掉落，普通怪不掉 */
  if(d.boss){
    MAP.drops.push({x:m.x+rnd(-22,22),y:m.y+rnd(-16,16),item:{id:'dan',pid:1,n:1},t:120,bob:0});
    addLog('✦ '+d.n+' 掉落了 『Boss内丹』（炼化可得 1 技能点）');
  }else if(d.elite&&Math.random()<.09*Math.min(2,luckMul)){
    MAP.drops.push({x:m.x+rnd(-18,18),y:m.y+rnd(-14,14),item:{id:'dan',pid:1,n:1},t:120,bob:0});
    addLog('✦ '+d.n+' 掉落了 『Boss内丹』');
  }
  /* 装备 */
  const dropP=(d.boss?1:d.elite?.5:.12)*luckMul;
  if(Math.random()<dropP){
    let itemId=null,q=rollEqQ();
    /* 天气 BOSS：小概率掉落「极品武器」——强制武器位 + 最高品质档 */
    const isWB=!!d.weatherBoss;
    if(isWB&&Math.random()<.22){
      const wp=EQUIPS.filter(e=>e.slot==='weapon'&&e.tier===4&&(e.cls==='all'||CLS_FULL[e.cls]===player.cls));
      if(wp.length){
        const wd=pick(wp);itemId=wd.id;q=2;
        MAP.drops.push({x:m.x+rnd(-20,20),y:m.y+rnd(-14,14),item:{id:itemId,q},t:120,bob:0,beam:4});
        banner('★ 极品武器 ★',d.n+' 掉落了 『小极品·'+wd.n+'』');
        addLog('✦✦ '+d.n+' 爆出了极品武器 『小极品·'+wd.n+'』');
        return;
      }
    }
    if(d.boss&&d.drops&&Math.random()<.75){itemId=pick(d.drops);q=Math.max(q,rollEqQ());}
    if(!itemId){
      const tier=rollEquipTier(MAP.def,!!d.boss,!!d.elite);
      const pool=EQUIPS.filter(e=>e.tier===tier&&(e.cls==='all'||CLS_FULL[e.cls]===player.cls));
      itemId=pool.length?pick(pool).id:'wood_sword';
    }
    MAP.drops.push({x:m.x+rnd(-20,20),y:m.y+rnd(-14,14),item:{id:itemId,q},t:90,bob:0,
      beam:EQMAP[itemId].tier});
    const eq=EQMAP[itemId];
    if(eq.tier>=3)addLog('✦ '+d.n+' 掉落了 『'+(q===2?'小极品·':q===0?'劣质·':'')+eq.n+'』');
    if(eq.tier>=3&&q===2)banner('✦ 小极品 ✦',eq.n+'（属性+32%）');
  }
}
function addInv(item){
  const def=item.pid?POTMAP[item.id]:EQMAP[item.id];
  if(!def)return false;                    // 未知物品不入包，避免产生无法渲染的脏数据
  const cnt=Math.max(1,Math.floor(Number(item.n)||1));
  if(item.pid){
    const ex=inv.find(i=>i.id===item.id&&i.pid);
    if(ex){ex.n=(ex.n||1)+cnt;return true;}
  }
  if(inv.length>=40)return false;
  /* n 强制补 1：历史存档/外部注入可能缺 n，导致格子显示空白或数量 NaN */
  const it2={id:item.id,pid:item.pid||0,n:cnt};
  /* 保留品质与强化等级：强化过的装备若经"入包→再取出"流程，
     原实现只带 q 不带 plus，会导致强化等级被静默清零 */
  if(item.q!==undefined)it2.q=item.q;
  if(item.plus)it2.plus=item.plus;
  inv.push(it2);
  return true;
}
/* 物品折算价（背包满时的兜底回收价）：矿石/消耗品按单价，装备按层级 */
function convertPrice(it){
  if(!it)return 0;
  if(it.pid){
    const pd=POTMAP[it.id];
    if(!pd)return 0;
    if(pd.ore)return 30;                   // 黑铁矿石
    if(pd.dan)return 800;                  // Boss 内丹（稀罕，给高价）
    return 20;                             // 其他消耗品
  }
  const eq=EQMAP[it.id];
  if(!eq)return 0;
  return Math.floor(60*Math.pow(1.9,eq.tier||1));
}
/* 入包优先、满包折算金币的统一入口。
   opts:{silent,why}  返回 {ok:true} | {ok:false,conv:金币数} | {ok:false,conv:0}
   用途：离线收益 / 试炼塔 / 任务奖励 / 副本结算 —— 避免"满包静默丢物" */
function addOrConvert(item,opts){
  opts=opts||{};
  if(addInv(item))return{ok:true,conv:0};
  const cnt=Math.max(1,Math.floor(Number(item&&item.n)||1));
  const price=convertPrice(item)*cnt;
  if(price>0){
    ST.gold=clampGold((ST.gold||0)+price);
    ST.stat.goldEarn=(ST.stat.goldEarn||0)+price;
  }
  if(!opts.silent){
    const nm=(item.pid?(POTMAP[item.id]||{}).n:(EQMAP[item.id]||{}).n)||'物品';
    if(price>0)toast('背包已满，'+nm+' 折算为 '+price+' 金币');
    else toast('背包已满，'+nm+' 无法拾取');
  }
  return{ok:false,conv:price};
}
/* 批量入包（数组），返回折算金币总额 */
function addOrConvertAll(items,opts){
  let conv=0;
  (items||[]).forEach(it=>{const r=addOrConvert(it,opts);conv+=r.conv;});
  return conv;
}
