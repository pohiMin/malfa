    if(player.reviveT<=0){
      player.dead=false;$('revive').classList.add('hidden');
      switchMap('village');
      player.hp=player.maxHp;player.mp=player.maxMp;
      addLog('您已在玛法村复活');
    }
    return;
  }
  player.atkT-=dt;player.castT-=dt;player.flash-=dt;player.potT-=dt;player.castT=Math.max(player.castT,0);
  if(player.weaponAnim>0)player.weaponAnim=Math.max(0,player.weaponAnim-dt);
  if(pet&&pet.weaponAnim>0)pet.weaponAnim=Math.max(0,pet.weaponAnim-dt);
  /* 施法硬直 castT 仅用于播放施法动作，不再作为普攻的前置条件。
     普攻与技能改为由 player.acted 做「同帧二选一」，既避免一帧双伤，
     又不会让"放技能"牺牲后续普攻窗口（原实现会导致技能拖慢输出）。 */
  if(player.shieldT>0)player.shieldT-=dt;
  if(player.buff&&player.buff.t>0){player.buff.t-=dt;
    if(player.buff.t<=0){player.buff=null;recalcStats();addText(player.x,player.y-50,'增益结束','#a89058',12);}}
  for(const k in player.cd)if(player.cd[k]>0)player.cd[k]-=dt;
  // 移动
  let mx=0,my=0;
  /* 走位/撤离的冷却计时在推进 dt 的地方递减（autoMove 本身拿不到 dt） */
  if(player.sideT>0)player.sideT=Math.max(0,player.sideT-dt);
  if(joy.active){mx=joy.dx;my=joy.dy;}
  else if(ST.auto){const d=autoMove();mx=d.x;my=d.y;}
  const spd=CLASSES[player.cls].spd*weatherSpd();
  player.moving=Math.hypot(mx,my)>.1;
  if(player.moving){
    const l=Math.hypot(mx,my);mx/=l;my/=l;
    // 卡障碍检测
    const ox=player.x,oy=player.y;
    moveEntity(player,mx*spd*dt,my*spd*dt);
    const moved=Math.hypot(player.x-ox,player.y-oy);
    if(moved<spd*dt*.25){player.stuckT=(player.stuckT||0)+dt;}
    else player.stuckT=0;
    if(player.stuckT>.4){player.unstickT=.5;player.stuckT=0;player.unstickA=Math.random()<.5?1:-1;}
    if(player.unstickT>0){player.unstickT-=dt;
      moveEntity(player,-my*spd*dt*player.unstickA,mx*spd*dt*player.unstickA);}
    if(Math.abs(mx)>.15)player.face=mx>0?1:-1;
    player.animT+=dt*9;
  }else player.animT+=dt*2;
  // 索敌
  acquireTarget();
  const t=player.target,c=CLASSES[player.cls];
  /* 本帧出手标记：普攻与技能共享，保证同一帧只出一次手。
     注意这不是原先的 castT 互斥——markActed 只在当前帧生效，
     下一帧立刻放开，因此「放技能」不会再牺牲后续普攻的输出窗口。 */
  player.acted=false;
  // 挂机（技能优先于普攻，同帧内二选一）
  if(ST.auto)autoCast();
  // 普攻
  if(!player.acted&&t&&!t.dead){
    const d=dist(player,t);
    if(d<=c.range&&player.atkT<=0)playerBasicAttack();
  }
  // 挂机喝药（施法已在上面按"技能优先"处理）
  if(ST.auto)autoPotion();
  // 脱战回血（白天回血更快，夜间稍慢）
  if(ST.time-player.lastHurt>5&&player.hp<player.maxHp){
    player.regenT+=dt;
    if(player.regenT>1){player.regenT=0;
      const rg=curPhase().regen;
      player.hp=Math.min(player.maxHp,player.hp+(player.maxHp*.03+5)*rg);
      player.mp=Math.min(player.maxMp,player.mp+(player.maxMp*.04+3)*rg);}
  }
}
function acquireTarget(){
  const cur=player.target;
  if(cur&&!cur.dead&&dist(player,cur)<620)return;
  player.target=nearestMob(player,ST.auto?Infinity:330,false); // 挂机遇 BOSS 也自动选中
}
function nearestMob(pt,range,excludeBoss){
  let best=null,bd=range===Infinity?Infinity:range;
  for(const m of monsters()){
    if(m.dead)continue;
    if(excludeBoss&&m.d.boss)continue;
    const d=dist(pt,m);
    if(d<bd){bd=d;best=m;}
  }
  return best;
}
function autoMove(){
  // 挂机放风筝：主动打 BOSS，残血时沿弧线拉开距离保命，回血后回头继续打
  const boss=MAP.mobs.find(m=>!m.dead&&m.d.boss&&m.aggro===player);
  if(boss){
    const bd=dist(player,boss),hpR=player.hp/player.maxHp;
    // 进入：残血且被 BOSS 追；退出：血量回复或已拉开；双阈值防抖
    player.kiting=(bd<250&&hpR<.35)?true:((hpR>=.55||bd>310)?false:!!player.kiting);
    if(player.kiting){
      if(player.kiteSide===undefined){
        /* 贴边时不要随机——随机到"朝墙"的那一侧会导致玩家顶着墙跑，
           应先判断所处边界，把绕行方向定成"沿墙滑行"的那一侧。 */
        const M=64;
        const nearL=player.x<M, nearR=player.x>MAP.Wpx-M;
        const nearT=player.y<M, nearB=player.y>MAP.Hpx-M;
        if(nearL||nearR){
          // 贴着左右墙：沿 y 轴滑行，方向取远离 BOSS 的一侧
          player.kiteSide=(player.y-boss.y)<0?1:-1;
        }else if(nearT||nearB){
          player.kiteSide=(player.x-boss.x)<0?1:-1;
        }else{
          player.kiteSide=Math.random()<.5?1:-1;
        }
      }
      const dx=(player.x-boss.x)/bd,dy=(player.y-boss.y)/bd;
      const mk=side=>{
        const vx=dx*.85-dy*side*.6,vy=dy*.85+dx*side*.6;
        const l=Math.hypot(vx,vy)||1;return{x:vx/l,y:vy/l};
      };
      let mv=mk(player.kiteSide);
      // 前方是墙/障碍/地图边界：翻转绕行方向沿墙滑，而不是顶墙卡死
      /* 探测距离随移动速度放大（原固定 72px 在提速后反应不及） */
      const look=Math.max(72,CLASSES[player.cls].spd*.62);
      const ahead=(p,r)=>p.x<r||p.y<r||p.x>MAP.Wpx-r||p.y>MAP.Hpx-r||mapObsAt(p.x,p.y,r);
      if(ahead({x:player.x+mv.x*look,y:player.y+mv.y*look},12)){
        player.kiteSide=-player.kiteSide;
        mv=mk(player.kiteSide);
        if(ahead({x:player.x+mv.x*look,y:player.y+mv.y*look},12)){
          // 两侧都堵：退化为纯侧向沿墙滑行，并确保该方向本身可通行
          const s1={x:-dy*player.kiteSide,y:dx*player.kiteSide};
          const s2={x:dy*player.kiteSide,y:-dx*player.kiteSide};
          const ok1=!ahead({x:player.x+s1.x*look,y:player.y+s1.y*look},12);
          const ok2=!ahead({x:player.x+s2.x*look,y:player.y+s2.y*look},12);
          mv=(ok1||!ok2)?s1:s2;
        }
      }
      return mv;
    }
  }
  const t=player.target;
  /* ---- 通用保命与走位（非 BOSS 场景）----
     设计取舍：挂机"变聪明"不等于收益变高。躲得太勤会少打怪，
     所以只在两种明确吃亏的情况下才动：① 残血硬刚 ② 被围殴站桩。
     其余时间保持"贴上去打"，优先保证输出。 */
  const hpR=player.maxHp>0?player.hp/player.maxHp:1;
  const near=monsters().filter(m=>!m.dead&&m.hostile!==false&&dist(m,player)<175);
  /* 威胁评估：只统计"当前仇恨在我身上"或主动敌对的怪，避免被远处路过的怪吓跑 */
  const threat=near.filter(m=>m.aggro===player||m.hostile).length;
  const hurtRecently=ST.time-player.lastHurt<2.5;

  /* ① 残血撤离：低于 30% 且最近在挨打 → 朝"怪最少"的方向拉开，给喝药/回血争取时间。
        与 BOSS kiting 用同一套走位工具，但阈值独立，避免互相干扰 */
  const LOW_HP=.30, ESCAPE_OUT=.45;
  if(player.retreating){
    if(hpR>=ESCAPE_OUT||!hurtRecently)player.retreating=false;   // 双阈值防抖
  }else if(hpR<LOW_HP&&hurtRecently&&near.length>0){
    player.retreating=true;player.retreatSide=undefined;
  }
  if(player.retreating&&near.length>0){
    /* 逃离方向 = 所有近距离怪的"斥力"合成，优先往怪少的那边跑 */
    let ax=0,ay=0;
    for(const m of near){
      const dd=Math.max(12,dist(player,m));
      ax+=(player.x-m.x)/dd*(1-dd/175);
      ay+=(player.y-m.y)/dd*(1-dd/175);
    }
    let l=Math.hypot(ax,ay);
    if(l<.001){ax=player.x>MAP.Wpx/2?-1:1;ay=0;l=1;}
    ax/=l;ay/=l;
    /* 前方是墙/障碍：切向绕行，避免顶着墙被围死 */
    const look=Math.max(72,CLASSES[player.cls].spd*.62);
    const blocked=(x,y)=>x<14||y<14||x>MAP.Wpx-14||y>MAP.Hpx-14||mapObsAt(x,y,12);
    if(blocked(player.x+ax*look,player.y+ay*look)){
      const s=player.retreatSide!==undefined?player.retreatSide:(Math.random()<.5?1:-1);
      const c1={x:-ay*s,y:ax*s},c2={x:ay*s,y:-ax*s};
      const ok1=!blocked(player.x+c1.x*look,player.y+c1.y*look);
      const ok2=!blocked(player.x+c2.x*look,player.y+c2.y*look);
      if(ok1||!ok2){ax=c1.x;ay=c1.y;player.retreatSide=s;}
      else{ax=c2.x;ay=c2.y;player.retreatSide=-s;}
    }
    return{x:ax,y:ay};
  }

  /* ② 反围殴：被 3 只以上贴身围住时侧移脱出，减少同时挨打的面数。
        检查 1.2 秒冷却（在 updatePlayer 里按 dt 递减），避免左右横跳导致完全不打怪 */
  const closeIn=near.filter(m=>dist(m,player)<70).length;
  if(closeIn>=3&&player.sideT<=0){
    player.sideT=1.2;
    player.sideDir=Math.random()<.5?1:-1;
  }
  if(player.sideT>0&&t){
    /* 沿着"玩家→目标"连线的垂线侧移，既不脱离目标又能错开包围圈 */
    const dx=t.x-player.x,dy=t.y-player.y,dl=Math.hypot(dx,dy)||1;
    const s=player.sideDir||1;
    const sx=-dy/dl*s, sy=dx/dl*s;
    const look=Math.max(56,CLASSES[player.cls].spd*.5);
    const blocked=(x,y)=>x<14||y<14||x>MAP.Wpx-14||y>MAP.Hpx-14||mapObsAt(x,y,12);
    if(!blocked(player.x+sx*look,player.y+sy*look))return{x:sx,y:sy};
    player.sideDir=-s;   // 该侧是墙 → 换另一边
  }

  if(!t)return{x:0,y:0};
  const c=CLASSES[player.cls];
  const d=dist(player,t);
  if(d>c.range*.92){return{x:t.x-player.x,y:t.y-player.y};}
  return{x:0,y:0};
}
function autoCast(){
  const order=CLASSES[player.cls].skills;
  const idxOf=k=>order.indexOf(k);
  const on=k=>ST.autoSkill[idxOf(k)]!==false; // 该技能是否允许自动释放
  const cfgOf=k=>Object.assign({},ST.autoCfg,ST.autoSkillCfg[k]||{}); // 全局默认 + 技能独立覆盖
  // 道士优先召唤（受召唤技能自身开关控制）
  if(player.cls==='taoist'&&on('summon')&&(!pet||pet.dead)&&player.level>=SKILLS.summon.unlock&&(!player.cd.summon||player.cd.summon<=0)){
    castSkill(idxOf('summon'));return;
  }
  // 治疗：低于配置阈值且自身开关开启
  if(player.cls==='taoist'&&on('heal')&&player.level>=SKILLS.heal.unlock&&(!player.cd.heal||player.cd.heal<=0)){
    const hc=cfgOf('heal');
    if(player.hp<player.maxHp*(hc.hpPct/100)){castSkill(idxOf('heal'));return;}
  }
  const cnt=monsters().filter(m=>!m.dead&&dist(m,player)<170).length;
  for(const key of order){
    const sk=SKILLS[key];
    if(sk.type==='passive'||sk.type==='summon'||sk.type==='heal')continue;
    if(!on(key))continue;
    if(player.level<sk.unlock)continue;
    if(player.cd[key]&&player.cd[key]>0)continue;
    const need=skillMp(key);
    if(player.mp<need)continue;
    const c=cfgOf(key);
    // 魔法保留：低于阈值时不再为普通输出消耗魔法（保命/召唤优先）
    if(c.mpKeep>0&&player.mp-player.mpKeep<need)continue;
    // 群体技能需要足够敌人数
    if((sk.type==='aoe'||sk.type==='aoeP'||sk.type==='maddness')&&cnt<c.cnt)continue;
    // 单体技能需要锁定目标
    if((sk.type==='m'||sk.type==='p'||sk.type==='charge'||sk.type==='poison')&&!player.target)continue;
    if(sk.type==='poison'&&player.target&&player.target.poisonT>0)continue;
    if(sk.type==='shield'&&player.shieldT>0)continue;
    // 增益技能：需要存在敌人且自身未处于增益中
    if(sk.type==='buff'){
      if(player.buff&&player.buff.t>0)continue;
      if(!player.target)continue;
      const bc=cfgOf(key);
      if(player.hp<player.maxHp*(bc.hpPct/100))continue; // 残血时优先逃跑/喝药，不放增益
    }
    castSkill(order.indexOf(key));return;
  }
}
/* 怪物更新 */
function updateMonster(m,dt){
  if(m.dead){m.respT-=dt;
    if(m.respT<=0){
      /* 试炼塔怪物不复活，必须清空才能过关 */
      if(m.towerMob){m.dead=true;m.respT=9999;return;}
      /* 人机重生：换一个身份（新名字/等级/职业），换一个位置 */
      if(m.isBot){rollBot(m,true);return;}
      m.dead=false;m.hp=m.maxHp;m.x=m.sx;m.y=m.sy;m.aggro=null;m.poisonT=0;m.stun=0;
      if(m.d.boss&&MAP.def.id===player.mapId)banner('⚠ '+m.d.n+' 已降临','-'+MAP.def.n+'-');
      if(m.d.boss)SFX.boss();
    }return;}
  m.flash-=dt;m.animT+=dt*6;m.atkT-=dt;
  if(m.weaponAnim>0)m.weaponAnim=Math.max(0,m.weaponAnim-dt);
  if(m.stun>0){m.stun-=dt;return;}
  /* BOSS 狂暴：血量低于阈值时一次性触发（不走技能轮转） */
  if(m.d.boss&&m.d.rage&&!m.raged&&m.hp<m.maxHp*m.d.rage.at){
    m.raged=true;
    banner('⚠ '+m.d.n+' 进入狂暴！','攻击 +'+Math.round((m.d.rage.mult-1)*100)+'% · 速度提升');
    sparkBurst(m.x,m.y-10,'#ff3c1c',18);SFX.boss();
  }
  /* 冲锋中：高速位移 + 路径撞击判定 */
  if(m.dashT>0){
    m.dashT-=dt;
    moveEntity(m,m.dashVX*dt,m.dashVY*dt);
    particles.push({x:m.x+rnd(-8,8),y:m.y+rnd(-6,6),vx:rnd(-20,20),vy:rnd(-20,20),t:.3,color:'#ffca4a',r:rnd(2,4),g:0});
    if(!m.dashHit){
      if(!player.dead&&dist(m,player)<34){
        m.dashHit=true;
        hurtPlayer(Math.max(1,Math.floor(mobAtkVal(m)*(m.dashMult||1.5)*rnd(.9,1.1))),m);
        slashes.push({x:player.x,y:player.y-10,t:.2,color:'#ffca4a',big:1});SFX.boss();
      }else if(pet&&!pet.dead&&dist(m,pet)<30){
        m.dashHit=true;const pd=Math.floor(mobAtkVal(m)*(m.dashMult||1.5)*.8);pet.hp-=pd;pet.flash=.2;
        addText(pet.x,pet.y-40,'-'+pd,'#ff8a70',12);if(pet.hp<=0)killPet();
      }
    }
    if(m.dashT<=0){m.dashVX=0;m.dashVY=0;}
    return;
  }
  // 中毒
  if(m.poisonT>0){m.poisonT-=dt;
    m.poisonTick=(m.poisonTick||0)-dt;
    if(m.poisonTick<=0){m.poisonTick=1;
      m.hp-=m.poison;addText(m.x,m.y-30,Math.floor(m.poison),'#8aff5a',11);
      if(m.hp<=0){killMonster(m);return;}}}
  const h=player.dead?null:(m.d.aggr&&dist(m,player)<(m.d.boss?420:300)&&!player.dead?player:null);
  const hp=pet&&!pet.dead&&dist(m,pet)<300?pet:null;
  const tgt=h||hp;
  if(tgt)m.aggro=tgt;
  else if(m.aggro){
    // 脱战判定
    const far=dist(m,m.aggro)>560||(m.aggro===player&&player.dead)||(m.aggro===pet&&pet.dead);
    if(far){m.aggro=null;m.backT=0;}
  }
  if(m.aggro){
    const t=m.aggro,d=dist(m,t);
    if(d>m.d.atkR*1.05){
      const spd=m.d.spd*(m.raged&&m.d.rage?m.d.rage.spd:1);   // 狂暴加移速
      const dx=(t.x-m.x)/d,dy=(t.y-m.y)/d;
      moveEntity(m,dx*spd*dt,dy*spd*dt);
      m.face=t.x>=m.x?1:-1;
    }else if(m.atkT<=0){
      m.atkT=m.d.atkCd;m.face=t.x>=m.x?1:-1;
      swingWeapon(m);   // 出手即挥动手中武器
      const isPl=t===player;
      /* 昼夜影响怪物攻击力（夜间更强） */
      const phAtk=curPhase().mobAtk;
      if(m.d.ranged){
        const pdmg=Math.max(1,Math.floor((mobAtkVal(m)*phAtk)-(isPl?player.def:5)));
        /* 人机法师/道士发射职业色法弹；其余怪物沿用斧头/黑斧 */
        if(m.isBot)projectiles.push({x:m.x,y:m.y-16,tgt:t,spd:340,kind:'mbolt',color:m.d.projColor,from:'m',dmg:pdmg,src:m});
        else projectiles.push({x:m.x,y:m.y-16,tgt:t,spd:340,kind:m.d.boss?'darkaxe':'axe',from:'m',dmg:pdmg,src:m});
      }else{
        const def=isPl?player.def:(pet?10:0);
        const dmg=Math.max(1,Math.floor(mobAtkVal(m)*phAtk*rnd(.85,1.15)-def*.6));
        if(isPl)hurtPlayer(dmg,m);
        else if(pet){pet.hp-=dmg;pet.flash=.15;addText(pet.x,pet.y-40,'-'+dmg,'#ff8a70',12);
          if(pet.hp<=0)killPet();}
        slashes.push({x:t.x,y:t.y-10,t:.13,color:'#ff8a70'});
        SFX.hit();
      }
    }
    /* BOSS 技能轮转：多段特色技能（skills 数组）；无 skills 的旧定义回退单 AOE */
    if(m.d.boss&&(m.d.skills||m.d.skill)){
      m.skillT-=dt;
      if(m.skillT<=0){
        const sk=m.d.skills?pickBossSkill(m):{t:'nova',cd:m.d.skill.cd,r:m.d.skill.r,mult:m.d.skill.mult,color:'#ff5a3c',cry:m.d.n+'怒吼！'};
        if(sk&&bossCastSkill(m,sk))m.skillT=sk.cd||6;
        else m.skillT=1.1;   // 条件不满足（如近身技够不着），稍后重试
      }
    }
  }else{
    // 巡逻
    m.wanderT-=dt;
    if(m.wanderT<=0){m.wanderT=rnd(1.5,3.5);
      if(Math.random()<.4){m.wdx=0;m.wdy=0;}
      else{const a=rnd(0,6.28);m.wdx=Math.cos(a);m.wdy=Math.sin(a);}}
    if(m.wdx||m.wdy){
      moveEntity(m,m.wdx*m.d.spd*.35*dt,m.wdy*m.d.spd*.35*dt);
      if(m.wdx)m.face=m.wdx>0?1:-1;
      m.animT+=dt*3;
    }
    // 缓慢回家回血
    if(!m.aggro&&m.hp<m.maxHp){m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.02*dt);}
  }
}
/* ============ 宠物进化系统 ============
   三阶段：骷髅卫士 → 骷髅统领 → 神兽麒麟
   阶段由"进化材料 + 等级门槛"共同决定，进化后名字/颜色/属性倍率全面强化 */
const PET_STAGES=[
 {id:0,n:'骷髅卫士',c:'#e8e4d8',spr:'h_skel',  need:0,  hpM:1,   atkM:1,   spd:120,desc:'道士最初召唤的白骨卫士'},
 {id:1,n:'骷髅统领',c:'#c88aff',spr:'h_skelE', need:60, hpM:1.5, atkM:1.45,spd:135,desc:'统御白骨的精锐，攻守俱增'},
 {id:2,n:'神兽麒麟',c:'#ffd870',spr:'h_womaL', need:180,hpM:2.4, atkM:2.3, spd:150,desc:'传说神兽，可抗可打，威震一方'}
];
function petStageOf(){return PET_STAGES[clamp(petCarry.stage||0,0,PET_STAGES.length-1)];}
function petNextStage(){const s=(petCarry.stage||0);return s+1<PET_STAGES.length?PET_STAGES[s+1]:null;}
function petCanEvolve(){
  const nx=petNextStage();
  if(!nx)return false;
  if((petCarry.lvl||0)<PET_MAX)return false;      // 需满级（LV6）
  if((ST.stat.eliteKills||0)+(ST.bossKills||0)<nx.need)return false;
  return true;
}
/* 进化条件进度（用于面板展示） */
function petEvolveProgress(){
  const nx=petNextStage();if(!nx)return null;
  const lvNeed=PET_MAX,lvCur=Math.min(petCarry.lvl||0,lvNeed);
  const kNeed=nx.need,kCur=Math.min((ST.stat.eliteKills||0)+(ST.bossKills||0),kNeed);
  return {nx,lvCur,lvNeed,kCur,kNeed,ok:petCanEvolve()};
}
function petEvolve(){
  if(!petStageOf())return false;
  if(!petCanEvolve()){const p=petEvolveProgress();
    if(p)toast('进化条件未满足：等级 '+p.lvCur+'/'+p.lvNeed+' · 精英/BOSS击杀 '+p.kCur+'/'+p.kNeed);
    return false;}
  petCarry.stage=(petCarry.stage||0)+1;
  const st=petStageOf();
  ST.setOwn=ST.setOwn||{};ST.setOwn['pet_'+st.id]=1;
  petCarry.lvl=0;petCarry.exp=0;              // 进化后等级重置，但基础倍率大幅提升
  if(pet){pet.lvl=0;pet.exp=0;petRecalc();pet.hp=pet.maxHp;}
  banner('✦ 宠物进化 ✦',st.n+' 诞生了！');
  addLog('🐾 骷髅卫士进化为 '+st.n+'（属性倍率 ×'+st.hpM+'）');
  SFX.lvl();
  petEvolveFx(pet?pet.x:player.x,pet?pet.y:player.y);
  checkAchv();
  return true;
}
function petEvolveFx(x,y){
  for(let i=0;i<30;i++){const a=rnd(0,6.28),rr=rnd(10,46);
    particles.push({x:x+Math.cos(a)*rr,y:y+Math.sin(a)*rr*.5,vx:Math.cos(a)*30,vy:rnd(-120,-50),
      t:rnd(.7,1.2),color:pick(['#ffd870','#fff8d0','#c88aff','#e8e4d8']),r:rnd(2,4.5),g:0});}
  particles.push({ring:1,x,y,r:10,max:80,t:.9,color:'#ffd870'});
  particles.push({ring:1,x,y,r:8,max:56,t:.7,color:'#c88aff'});
}
/* 宠物成长：属性随等级、道术、进化阶段重算 */
function petRecalc(){
  if(!pet)return;
  const st=petStageOf();
  const ratio=(1+pet.lvl*.32)*st.hpM;
  pet.maxHp=(56+player.matk*2.1)*ratio;
  pet.atk=(7+player.matk*.52)*ratio;
  pet.spd=st.spd;
  /* 天赋「召唤」强化：宠物整体强度 */
  const tb=talentBonus();
  if(tb.summonPct){pet.maxHp*=(1+tb.summonPct);pet.atk*=(1+tb.summonPct);}
  if(pet.hp>pet.maxHp)pet.hp=pet.maxHp;
}
function petGainExp(v){
  if(!pet||pet.dead||pet.lvl>=PET_MAX)return;
  pet.exp+=v;
  petCarry.lvl=pet.lvl;petCarry.exp=pet.exp;
  while(pet.lvl<PET_MAX&&pet.exp>=PET_LV[pet.lvl+1].exp){
    pet.lvl++;
    petRecalc();
    pet.hp=pet.maxHp;
    petCarry.lvl=pet.lvl;petCarry.exp=pet.exp;
    if(pet.lvl>=PET_MAX)ST.petMaxed=true; // 成就：满级
    addText(pet.x,pet.y-46,'升级！LV'+(pet.lvl+1),PET_LV[pet.lvl].c,14);
    addLog(petStageOf().n+' 进阶为 '+PET_LV[pet.lvl].n+'（LV'+(pet.lvl+1)+'）');
    SFX.lvl();
    if(pet.lvl>=PET_MAX&&petCanEvolve())
      addLog('★ '+petStageOf().n+' 已满级，可前往「宠物」面板进行进化解锁新形态！');
    checkAchv();
  }
}
function killPet(){
  if(!pet)return;
  pet.hp=0;pet.dead=true;pet.lvl=0;pet.exp=0;
  petCarry.lvl=0;petCarry.exp=0;               // 进化阶段保留，仅等级归零
  addLog('☠ '+petStageOf().n+'阵亡，等级与属性已重置（进化形态保留）');
}
function updatePet(dt){
  if(!pet||pet.dead)return;
  /* ★ flash 衰减：玩家（updatePlayer）与怪物（updateMobs）都有 flash-=dt，
     唯独漏了宠物 —— 骷髅受击一次 flash 恒为 0.15，泛白永不消退，
     叠加白版精灵后整只骷髅变成常驻的白色方块（用户报告的正是这个）。
     与另两处保持一致：归零后不再写，避免浮点尾数。 */
  if(pet.flash>0)pet.flash=Math.max(0,pet.flash-dt);
  pet.animT+=dt*7;pet.atkT-=dt;
  let t=pet.target;
  if(player.target&&!player.target.dead&&player.target.d.boss&&dist(player,player.target)<420){
    // 主人手动锁定 BOSS：宠物优先协助攻击（挂机时主人永不锁 BOSS，不受影响）
    t=player.target;pet.target=t;
  }else{
    if(!t||t.dead||dist(pet,t)>380){
      t=nearestMob(pet,340,true); // 宠物永不主动招惹 BOSS
      pet.target=t;
    }
    if(!t&&player.target&&!player.target.dead&&dist(player,player.target)<420)t=player.target;
  }
  if(t){
    const d=dist(pet,t);
    if(d>36){const dx=(t.x-pet.x)/d,dy=(t.y-pet.y)/d;
      moveEntity(pet,dx*(pet.spd||120)*dt,dy*(pet.spd||120)*dt);pet.face=t.x>=pet.x?1:-1;}
    else if(pet.atkT<=0){
      pet.atkT=.9;pet.face=t.x>=pet.x?1:-1;
      swingWeapon(pet);
      const dmg=Math.max(1,Math.floor(pet.atk*rnd(.8,1.2)-t.d.def*.5));
      hurtMonster(t,dmg,'#e8d9b0');
      slashes.push({x:t.x,y:t.y-10,t:.12,color:'#e8d9b0'});
    }
  }else{
    const d=dist(pet,player);
    if(d>70){const dx=(player.x-pet.x)/d,dy=(player.y-pet.y)/d;
      moveEntity(pet,dx*150*dt,dy*150*dt);}
  }
}
/* 投射物/AOE/粒子 */
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    /* 直线弹幕（BOSS volley）：不追踪，走固定方向，可走位躲避 */
    if(p.dir){
      p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      let hit=null;
      if(!player.dead&&Math.hypot(player.x-p.x,player.y-p.y)<17)hit=player;
      else if(pet&&!pet.dead&&Math.hypot(pet.x-p.x,pet.y-p.y)<15)hit=pet;
      if(hit){
        if(hit===player)hurtPlayer(Math.max(1,Math.floor(p.dmg*rnd(.85,1.15))),p);
        else{pet.hp-=p.dmg;pet.flash=.15;if(pet.hp<=0)killPet();}
        sparkBurst(p.x,p.y,p.color||'#ff8a2c',6);
        projectiles.splice(i,1);continue;
      }
      if(p.life<=0){projectiles.splice(i,1);continue;}
      particles.push({x:p.x,y:p.y,vx:rnd(-10,10),vy:rnd(-10,10),t:.2,color:p.color||'#ff8a2c',r:rnd(1.5,3)});
      continue;
    }
    const t=p.tgt;
    if(!t||(p.from==='m'?(t===player&&player.dead):(t.dead))){
      projectiles.splice(i,1);continue;}
    const tx=t.x,ty=t.y-(t===player?20:14);
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    const step=p.spd*dt;
    if(d<=step+8){
      // 命中
      if(p.from==='p'){
        const r=calcDamage(p.dmgBase,t.d.mdef,p.mult);
        hurtMonster(t,r.d,p.kind==='ice'?'#8ad8ff':p.kind==='charm'?'#ffe95a':'#ff8a4c',r.crit);
        if(p.kind==='fireball'||p.kind==='thunder')SFX.fire();
      }else{
        if(t===player)hurtPlayer(Math.max(1,Math.floor(p.dmg*rnd(.85,1.15))),p);
        else if(pet){pet.hp-=p.dmg;pet.flash=.15;if(pet.hp<=0)killPet();}
      }
      projectiles.splice(i,1);continue;
    }
    p.x+=dx/d*step;p.y+=dy/d*step;
    p.px=dx/d;p.py=dy/d;
    // 法术飞行物拖尾
    if(p.from==='p')particles.push({x:p.x,y:p.y,vx:rnd(-12,12),vy:rnd(-12,12),t:.22,
      color:p.kind==='charm'?'#ffe95a':'#ff8a4c',r:rnd(2,3.5),g:0});
    if(p.kind==='fireball'||p.kind==='charm')particles.push({x:p.x,y:p.y,vx:rnd(-14,14),vy:rnd(-14,14),t:.3,color:p.kind==='fireball'?'#ff8a2c':'#ffd84a',r:rnd(1.5,3)});
  }
}
function updateAoes(dt){
  for(let i=aoes.length-1;i>=0;i--){
    const a=aoes[i];a.t-=dt;
    if(a.t<=0){
      if(a.from==='m'){
        if(!player.dead&&Math.hypot(player.x-a.x,player.y-a.y)<=a.r)hurtPlayer(a.dmg,null);
        if(pet&&!pet.dead&&Math.hypot(pet.x-a.x,pet.y-a.y)<=a.r){pet.hp-=a.dmg;pet.flash=.2;if(pet.hp<=0)killPet();}
        boomFx(a.x,a.y,a.r);
        SFX.bolt();
      }
      aoes.splice(i,1);
    }
  }
}
function updateDrops(dt){
  for(let i=MAP.drops.length-1;i>=0;i--){
    const d=MAP.drops[i];d.t-=dt;d.bob+=dt*3;
    if(d.t<=0){
      /* 超时未拾取：地面装备/道具自动折算成金币，避免"白打一场"
         金币掉落本身视作被地图回收（不折算，防止挂机无限刷币） */
      if(d.item){
        const price=convertPrice(d.item)*(Math.max(1,Math.floor(Number(d.item.n)||1)));
        if(price>0){
          ST.gold=clampGold((ST.gold||0)+price);
          ST.stat.goldEarn=(ST.stat.goldEarn||0)+price;
          ST.stat.dropConv=(ST.stat.dropConv||0)+1;
        }
      }
      MAP.drops.splice(i,1);continue;
    }
    // 范围内磁吸自动拾取
    if(!player.dead){
      const dd=dist(d,player);
      /* 先判断"这件东西到底捡不捡得走"。
         原实现是先磁吸、拾取时才发现不满足条件（类型被关 / 背包满）→ 物品被
         永久吸附在玩家脚下 1~4px 处跟着跑，看起来像"名字和图标粘在人身上"。
         现在把判定提前：吸不走的就不吸，让它老实待在地上。 */
      const canTake=canAutoPick(d);
      if(canTake&&dd<130&&dd>1){
        const pull=(130-dd)/130*300+60;
        d.x+=(player.x-d.x)/dd*pull*dt;
        d.y+=(player.y-d.y)/dd*pull*dt;
      }
      if(dd<32){
        if(!canTake){
          /* 捡不走的物品：留在原地不动，仅首次靠近时提示一次，避免刷屏 */
          if(!d._noPick&&d.item&&!autoPickAllowed(d.item))toast('该类型已设为不自动拾取');
          else if(!d._noPick&&inv.length>=40)toast('背包已满');
          d._noPick=1;
          continue;
        }
        d._noPick=0;
        MAP.drops.splice(i,1);
        if(d.gold){ST.gold+=d.gold;ST.stat.goldEarn=(ST.stat.goldEarn||0)+d.gold;addText(player.x,player.y-52,'+'+d.gold+' 金币','#ffd84a',12);SFX.gold();}
        else{if(addInv(d.item)){SFX.pickup();
          const def=d.item.pid?POTMAP[d.item.id]:EQMAP[d.item.id];
          const qn=d.item.q===2?'小极品·':d.item.q===0?'劣质·':'';
          if(!d.item.pid&&d.item.q===2)ST.q2Got++;
          /* 高价值拾取：屏上闪一条品质色弹幕，比只有一行小字更有"到手了"的实感 */
          const tier=def&&def.tier||0;
          if(!d.item.pid&&(tier>=4||d.item.q===2||(d.item.plus||0)>0)){
            const col=d.item.q===2?'#ffca4a':(TIER_COLOR[tier]||'#ffd870');
            pickupFlash(qn+def.n,col,d.item.q===2?'★ 小极品':(tier>=4?'★ 神兵':'◆ 强化 +'+(d.item.plus||0)));
            pickupFx(d.x,d.y,col);
          }
          if(!d.item.pid&&def.tier>=4){ST.t4Got++;banner('★ '+def.n+' ★',d.item.q===2?'小极品传说中的神兵利器！':'传说中的神兵利器！');}
          else if(def.tier>=3)banner('恭喜获得 '+qn+def.n,d.item.q===2?'小极品！':'祖玛级紫装入手！');
          addLog('获得 『'+qn+def.n+'』');
          checkAchv();}
          else{
            // 背包已满 → 若开启自动出售，清理白色装备后再试
            if(ST.autoSellFull&&autoSellWhite()){
              if(addInv(d.item)){addLog('自动出售装备腾出背包空间');
                const def2=d.item.pid?POTMAP[d.item.id]:EQMAP[d.item.id];
                if(d.item.id==='ore')ST.stat.oreGet=(ST.stat.oreGet||0)+(d.item.n||1);
                addLog('获得 『'+(d.item.q===2?'小极品·':'')+def2.n+'』');}
              else{MAP.drops.push(d);toast('背包已满（没有可自动出售的装备）');break;}
            }else{MAP.drops.push(d);toast('背包已满');break;}
          }}
        continue;
      }
    }
  }
}

/* 拾取弹幕：屏幕中上方独立的一条浮层提示（与 banner 分离，互不打断） */
let _pfT=null;
function pickupFlash(label,color,tag){
  const el=$('pickupFlash');if(!el)return;
  el.textContent='';
  const a=document.createElement('span');a.className='pfName';a.textContent=label;
  a.style.color=color;a.style.textShadow='0 0 10px '+color;
  el.appendChild(a);
  if(tag){const b=document.createElement('span');b.className='pfTag';b.textContent=tag;el.appendChild(b);}
  el.classList.add('show');
  if(_pfT)clearTimeout(_pfT);
  _pfT=setTimeout(()=>el.classList.remove('show'),1500);
}

function boomFx(x,y,r){ringFx(x,y,r,'#ff5a3c');
 for(let i=0;i<26;i++){const a=rnd(0,6.28);particles.push({x:x+Math.cos(a)*r*rnd(.3,1),y:y+Math.sin(a)*r*rnd(.3,1),vx:Math.cos(a)*rnd(40,120),vy:Math.sin(a)*rnd(40,120),t:.5,color:pick(['#ff5a3c','#ffca4a','#8a2a10']),r:rnd(2,5),g:60});}}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];
    p.t-=dt;if(p.t<=0){particles.splice(i,1);continue;}
    if(p.ring){p.r+= (p.max-p.r)*dt*8;continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];
    t.t-=dt;t.y+=t.vy*dt;t.vy*=.92;
    if(t.t<=0)texts.splice(i,1);}
  for(let i=slashes.length-1;i>=0;i--){slashes[i].t-=dt;if(slashes[i].t<=0)slashes.splice(i,1);}
}

/* ---------------- S8 掉落与物品 ---------------- */
function rollEquipTier(mapDef,isBoss,elite){
  const base=isBoss?3:elite?2:1;
  let tier=base;
  const r=Math.random();
  if(r<.12)tier=Math.min(4,base+1);
  else if(r<.4&&base<3)tier=base+ (Math.random()<.3?1:0);
  // 小怪也可能出高级
  if(!isBoss&&!elite&&Math.random()<.04)tier=Math.min(4,tier+2);
  return clamp(tier,1,4);
}
/* ============ 掉落产出规则（2026-10 重定位） ============
   产品意图：把「强化石」和「Boss内丹」从"挂机就能堆"的日用品，
   变成"必须主动找精英/BOSS"的战略物资。

   ● 黑铁矿石（强化石）
       普通怪  0%      —— 挂机刷怪不再白送强化材料
       精英怪 10%      —— 唯一稳定来源，逼玩家主动清精英
       BOSS   必掉 1~3 —— 打 BOSS 保底有收获
       地图挖矿 0%     —— 原 45% 的随机挖矿产出取消（过度供给）
     设计后果：+1~+7 的"无损强化区间"仍然友好（矿石够用），
     但 +8 以上需要的量会真正卡住人，强化开始变成需要规划的事。

   ● Boss 内丹（技能点）
       仅「中级以上地图的最大 BOSS」掉落，概率 30%。
       "中级以上" = 沃玛寺庙（lv22）及之后的图：沃玛教主 / 祖玛教主 / 赤月恶魔。
       骷髅王、尸王属初级图 BOSS，不掉（避免开局就刷技能点）。
       天气 BOSS 算"最大 BOSS"，同样 30%（它们比同级图 BOSS 更强，理应给）。
       精英怪 0% —— 原 9% 取消，技能点不该是精英的副产品。
     设计后果：技能点从"挂机附带"变成"需要专门去打 BOSS"，与
     "技能点唯一来自内丹"的设定真正闭环。 */
const ORE_P_NORMAL=0;        // 普通怪：不产强化石
const ORE_P_ELITE=0.10;      // 精英怪：10%
const DAN_P_BOSS=0.30;       // 中级以上地图 BOSS：30%
const DAN_MIN_MAP_LV=22;     // 「中级地图」的等级起点（沃玛寺庙）
/* 判断某只怪是否属于「中级以上地图的最大 BOSS」
   注意 MONSTERS 是 {id:{...}} 结构，定义对象内部**没有** id 字段，
   所以不能写 d.id —— 必须优先用怪物实例的 m.id，或由调用方显式传入 id。 */
function danEligible(d,mobId){
  if(!d||!d.boss)return false;
  /* 天气 BOSS 视同最大 BOSS（它们比同级图主更强，给内丹合理） */
  if(d.weatherBoss)return true;
  const id=mobId||(d&&d._id)||null;
  const md=MAP&&MAP.def;
  if(!md||!md.lv||md.lv[0]<DAN_MIN_MAP_LV)return false;
  if(!id)return false;               // 没有 id 无法确认是否图主，保守不放行
  return md.boss===id;
}
function dropLoot(m){
  const d=m.d;
  /* 收益增益：昼夜（夜间更丰）+ 天气 + 套装「幸运机缘」 */
  const luckMul=1+nightDropBonus()+weatherDropBonus()+setBonus().luck;
  /* 金币：普通怪产出下调（控制金币消耗），精英/BOSS 保持以维持高价值目标感 */
  const goldScale=d.boss?1:d.elite?.82:.62;
  const gv=Math.max(0,Math.floor(rndi(d.gold[0],d.gold[1])*luckMul*goldScale));
  /* 下限为 0 而非 1：试炼塔把怪物金币设为 [0,0]，原实现里的 Math.max(1,·)
     会把它抬成 1 金币，导致"塔内不产金币"失效（每杀一只白给 1 枚）。 */
  if(gv>0)MAP.drops.push({x:m.x+rnd(-14,14),y:m.y+rnd(-10,10),gold:gv,t:60,bob:0});
  /* 药水：掉落几率下调（原 30%），减少无成本续航，让购药成为真实金币消耗 */
  if(Math.random()<.17){const pid=pick(['hp_s','hp_s','hp_m','mp_s','mp_m']);
    MAP.drops.push({x:m.x+rnd(-18,18),y:m.y+rnd(-12,12),item:{id:pid,pid:1,n:1},t:60,bob:0});}
  /* 黑铁矿石（强化石）：普通怪 0%，精英 10%，BOSS 必掉 1~3 */
  const oreP=(d.boss?1:d.elite?ORE_P_ELITE:ORE_P_NORMAL)*luckMul;
  if(Math.random()<oreP)
    MAP.drops.push({x:m.x+rnd(-16,16),y:m.y+rnd(-14,14),item:{id:'ore',pid:1,n:d.boss?rndi(1,3):1},t:90,bob:0});
  /* Boss 内丹：仅中级以上地图的最大 BOSS，概率固定 30%。
     注意不要叠 luckMul —— 天气 BOSS 本身只在特定天气出现，
     再乘「夜间+天气+套装」的掉落加成会把实测概率顶到 33%+，
     偏离"30%"这个明确的数值承诺。内丹是技能点资源，宜稳定不宜浮动。 */
  if(danEligible(d,m.id)&&Math.random()<DAN_P_BOSS){
    MAP.drops.push({x:m.x+rnd(-22,22),y:m.y+rnd(-16,16),item:{id:'dan',pid:1,n:1},t:120,bob:0});
    addLog('✦ '+d.n+' 掉落了 『Boss内丹』（炼化可得 1 技能点）');
  }
  /* 装备 */
  const dropP=(d.boss?1:d.elite?.5:.12)*luckMul;
  if(Math.random()<dropP){
    let itemId=null,q=rollEqQ();
    /* 天气 BOSS：小概率掉落「极品武器」——强制武器位 + 最高品质档 */
    const isWB=!!d.weatherBoss;
    if(isWB&&Math.random()<.22){
      const wp=EQUIPS.filter(e=>e.slot==='weapon'&&e.tier===4&&(e.cls==='all'||CLS_FULL[e.cls]===player.cls));
      if(wp.length){
        const wd=pick(wp);itemId=wd.id;q=2;
        MAP.drops.push({x:m.x+rnd(-20,20),y:m.y+rnd(-14,14),item:{id:itemId,q},t:120,bob:0,beam:4});
        banner('★ 极品武器 ★',d.n+' 掉落了 『小极品·'+wd.n+'』');
        addLog('✦✦ '+d.n+' 爆出了极品武器 『小极品·'+wd.n+'』');
        return;
      }
    }
    if(d.boss&&d.drops&&Math.random()<.75){itemId=pick(d.drops);q=Math.max(q,rollEqQ());}
    if(!itemId){
      const tier=rollEquipTier(MAP.def,!!d.boss,!!d.elite);
      const pool=EQUIPS.filter(e=>e.tier===tier&&(e.cls==='all'||CLS_FULL[e.cls]===player.cls));
      itemId=pool.length?pick(pool).id:'wood_sword';
    }
    MAP.drops.push({x:m.x+rnd(-20,20),y:m.y+rnd(-14,14),item:{id:itemId,q},t:90,bob:0,
      beam:EQMAP[itemId].tier});
    const eq=EQMAP[itemId];
    if(eq.tier>=3)addLog('✦ '+d.n+' 掉落了 『'+(q===2?'小极品·':q===0?'劣质·':'')+eq.n+'』');
    if(eq.tier>=3&&q===2)banner('✦ 小极品 ✦',eq.n+'（属性+32%）');
  }
}
function addInv(item){
  const def=item.pid?POTMAP[item.id]:EQMAP[item.id];
  if(!def)return false;                    // 未知物品不入包，避免产生无法渲染的脏数据
  const cnt=Math.max(1,Math.floor(Number(item.n)||1));
  if(item.pid){
    const ex=inv.find(i=>i.id===item.id&&i.pid);
    if(ex){ex.n=(ex.n||1)+cnt;return true;}
  }
  if(inv.length>=40)return false;
  /* n 强制补 1：历史存档/外部注入可能缺 n，导致格子显示空白或数量 NaN */
  const it2={id:item.id,pid:item.pid||0,n:cnt};
  /* 保留品质与强化等级：强化过的装备若经"入包→再取出"流程，
     原实现只带 q 不带 plus，会导致强化等级被静默清零 */
  if(item.q!==undefined)it2.q=item.q;
  if(item.plus)it2.plus=item.plus;
  inv.push(it2);
  return true;
}
/* 物品折算价（背包满时的兜底回收价）：矿石/消耗品按单价，装备按层级 */
function convertPrice(it){
  if(!it)return 0;
  if(it.pid){
    const pd=POTMAP[it.id];
    if(!pd)return 0;
    if(pd.ore)return 30;                   // 黑铁矿石
    if(pd.dan)return 800;                  // Boss 内丹（稀罕，给高价）
    return 20;                             // 其他消耗品
  }
  const eq=EQMAP[it.id];
  if(!eq)return 0;
  return Math.floor(60*Math.pow(1.9,eq.tier||1));
}
/* 入包优先、满包折算金币的统一入口。
   opts:{silent,why}  返回 {ok:true} | {ok:false,conv:金币数} | {ok:false,conv:0}
   用途：离线收益 / 试炼塔 / 任务奖励 / 副本结算 —— 避免"满包静默丢物" */
function addOrConvert(item,opts){
  opts=opts||{};
  if(addInv(item))return{ok:true,conv:0};
  const cnt=Math.max(1,Math.floor(Number(item&&item.n)||1));
  const price=convertPrice(item)*cnt;
  if(price>0){
    ST.gold=clampGold((ST.gold||0)+price);
    ST.stat.goldEarn=(ST.stat.goldEarn||0)+price;
  }
  if(!opts.silent){
    const nm=(item.pid?(POTMAP[item.id]||{}).n:(EQMAP[item.id]||{}).n)||'物品';
    if(price>0)toast('背包已满，'+nm+' 折算为 '+price+' 金币');
    else toast('背包已满，'+nm+' 无法拾取');
  }
  return{ok:false,conv:price};
}
/* 批量入包（数组），返回折算金币总额 */
function addOrConvertAll(items,opts){
  let conv=0;
  (items||[]).forEach(it=>{const r=addOrConvert(it,opts);conv+=r.conv;});
  return conv;
}
function useInvItem(idx,silent){

    /* 双槽位（手镯/戒指）穿戴规则：优先填第一个空槽；两个都满了就替换①。
       不替换②是刻意的——①是玩家更早带上的那件，替换它是"换新"的自然预期；
       若替换②，玩家会觉得"我明明换的是右边那个，怎么左边的变了"。 */
    const cand=eqSlotsOf(e.slot);

    const extra=cand.length>1?(' → '+EQ_SLOT_NAME[slot]):'';
    addLog('装备了 『'+eqName(it)+'』'+extra);
    questNotifyCheck();
    openBag();
  }
}
/* ---------------- 装备强化系统（全槽位） ----------------
   ① 武器 / 头盔 / 衣服 / 项链 / 手镯 / 戒指 均可强化
   ② 上限 +12（原 +7）
   ③ 每级主属性 +12% 不变，故 +12 约 +290%，需要提高单级收益的成长感
   ④ 风险：+8 起失败**有概率直接损坏消失**（等级越高越危险），
      +1~+7 仍为「失败仅消耗材料、装备无损」的安全区 */
const PLUS_MAX=12;
/* 安全上限：+1~+7 失败不损坏；+8 起进入危险区 */
const PLUS_SAFE=7;
function forgeRate(plus){
  /* 成功率曲线：+1~4 必成，之后逐级下降，+11→+12 仅 18% */
  const t=[1,1,1,1,.86,.72,.6,.46,.36,.28,.22,.18];
  return t[clamp(plus,0,PLUS_MAX-1)];
}
/* 损坏概率（仅在 +8 起的失败分支生效）：失败后装备直接消失的概率
   参数 plus 为「当前强化等级」，即本次要升到 plus+1 级。
   需求：「超过 7 级有概率导致装备损坏消失」→ +7→+8 属安全区，故 plus<=PLUS_SAFE 时返回 0。
   真正的危险从 +8→+9 开始（plus=8 → 14%），每级 +5%，+11→+12 时 29%，上限 50% */
function forgeBreakRate(plus){
  if(plus<=PLUS_SAFE)return 0;
  return Math.min(.5,.14+(plus-PLUS_SAFE-1)*.05);
}
/* 强化成本：矿石线性、金币按档跃升。
   +1~+7 为安全养成区（累计约 40 矿石 / 4.6 万金币）
   +8~+12 为豪赌区，金币陡增，配合"控制金币消耗"的设计目标 */
function forgeCost(plus){
  const g=[260,520,980,1700,2800,4600,7200,12000,19000,30000,46000,68000][clamp(plus,0,PLUS_MAX-1)];
  return{ore:plus+1,gold:g};
}
function plusMul(e){return Math.pow(1.12,e.plus||0);}
/* 装备光芒颜色（任意部位）：神兵(赤月级)职业色 > 强化+10 强金光 > +7 暖光 > +4 微光 > 小极品金光 */
function weaponGlowColor(e){
  if(!e)return null;
  const d=EQMAP[e.id];if(!d)return null;
  if(d.tier===5)return '#ff6ad8';   /* tier5 魔龙装：全部位品红神光（终局识别度） */
  if(d.tier===4&&d.slot==='weapon')return CLASSES[player.cls].color;
  if((e.plus||0)>=10)return '#ffd84a';
  if((e.plus||0)>=7)return '#ffb050';
  if((e.plus||0)>=4)return '#e8b060';
  if(qOf(e)===2)return EQQ[2].color;
  return null;
}
function countOre(){let n=0;for(const i of inv)if(i.pid&&i.id==='ore')n+=i.n;return n;}
function takeOre(n){
  for(let i=inv.length-1;i>=0&&n>0;i--){const it=inv[i];
    if(it.pid&&it.id==='ore'){const take=Math.min(n,it.n);it.n-=take;n-=take;
      if(it.n<=0)inv.splice(i,1);}}
}
/* 槽位中文名（提示文案用） */
const SLOT_CN={weapon:'武器',helmet:'头盔',armor:'衣服',necklace:'项链',bracelet:'手镯',ring:'戒指'};
/* 强化任意装备实例（背包内或身上已装备，六个部位通吃） */
function forgeDo(w,after){
  const e=EQMAP[w.id];

  const cur=w.plus||0;
  if(cur>=PLUS_MAX){toast('已达到强化上限 +'+PLUS_MAX);return;}
  const cost=forgeCost(cur);
  if(countOre()<cost.ore){toast('黑铁矿石不足（需要 '+cost.ore+' 个，现有 '+countOre()+' 个）');return;}
  if(ST.gold<cost.gold){toast('金币不足（需要 '+cost.gold+'）');return;}
  takeOre(cost.ore);ST.gold-=cost.gold;
  ST.stat.goldSpend=(ST.stat.goldSpend||0)+cost.gold;
  ST.stat.craft=(ST.stat.craft||0)+1;

  }else{
    /* 失败分支：+8 起有概率直接损坏消失 */
    const onBody=Object.values(equip).includes(w);
    if(cur>PLUS_SAFE&&Math.random()<forgeBreakRate(cur)){
      ST.stat.craftBreak=(ST.stat.craftBreak||0)+1;
      SFX.die();

      if(onBody){for(const k in equip)if(equip[k]===w)equip[k]=null;recalcStats();}
      banner('✖ 装备已碎裂 ✖',nm+' 在 +'+(cur+1)+' 强化中化为齑粉');
      addLog('⚒ '+nm+' 强化 +'+(cur+1)+' 失败，装备永久损坏消失了…');
      toast('强化失败，装备已损坏');
    }else{
      SFX.die();

      addLog('⚒ '+nm+' 强化 +'+(cur+1)+' 失败，黑铁矿石碎裂了');
    }
  }
  if(after)after();
}

function forgePanelHtml(w,isBody){

/* 自动拾取配置兜底：旧存档 autoPick 没有 eqT/dan 字段，这里补齐
   eqT = 按品质档（1普通/2沃玛/3祖玛/4赤月）勾选是否自动拾取该档装备 */
function ensureAutoPickCfg(){
  if(!ST.autoPick)ST.autoPick={gold:true,pot:true,eq:true,eqT:{1:true,2:true,3:true,4:true,5:true},dan:true};
  const p=ST.autoPick;
  if(!p.eqT||typeof p.eqT!=='object')p.eqT={1:true,2:true,3:true,4:true,5:true};
  for(const k of[1,2,3,4,5])if(p.eqT[k]===undefined)p.eqT[k]=true;
  if(p.dan===undefined)p.dan=true;
  return p;
}
/* 类型过滤：玩家是否允许自动拾取这类东西（不看背包容量）。
   磁吸只受这一层约束——容量问题是"暂时捡不走"，不该让物品乱飞。 */
function autoPickAllowed(it){
  const pk=ensureAutoPickCfg();
  if(!it)return false;
  if(it.pid){
    const pdef=POTMAP[it.id];
    if(!pdef)return false;
    return pdef.dan?(pk.dan!==false):(pk.pot!==false);
  }
  const edef=EQMAP[it.id];
  if(!edef)return false;
  if(pk.eq===false||pk.eqT[edef.tier]===false)return false;
  return true;
}
/* 判断地上的掉落物「能不能被自动拾取」（类型允许 + 装得下）。
   磁吸用它决定是否拉扯物品：吸不走的东西绝不能被吸，
   否则会永久贴在玩家脚下跟着跑（就是"名字和图标粘在人身上"的成因）。 */
function canAutoPick(d){
  if(d.gold)return ensureAutoPickCfg().gold!==false;
  if(!d.item)return false;
  if(!autoPickAllowed(d.item))return false;
  /* 容量：消耗品可叠加，若已有同类堆叠则不占新格 */
  if(d.item.pid&&inv.find(i=>i.id===d.item.id&&i.pid))return true;
  if(inv.length<40)return true;
  /* 背包满了：只有"能被自动出售腾位"的装备才还有救 */
  return !d.item.pid&&autoSellCanFree();
}
/* 背包满时，当前自动出售配置能否腾出至少一格（试算，不真卖） */
function autoSellCanFree(){
  const cfg=ensureAutoSellCfg();
  for(const it of inv){
    if(it.plus)continue;                                  // 强化过的不卖
    if(it.pid)continue;                                   // 药水矿石不卖
    /* ★ 用 eqWornSlot 代替硬编码槽位列表：双戒指/双手镯上线后，旧写法会漏掉
       bracelet2/ring2 —— 穿在右手上的装备会被自动出售卖掉，属严重数据损坏。 */
    if(eqWornSlot(it))continue;
    const def=EQMAP[it.id];if(!def)continue;
    if(cfg.t[def.tier]&&(cfg.oc||def.cls==='all'||def.cls===player.cls))return true;
  }
  return false;
}
/* 自动出售配置（背包满触发）：
   t = 参与出售的颜色档（tier1白/2蓝/3紫/4金，默认只勾白，兼容旧存档行为）
   oc = 是否同时出售「非本职业专属」装备（通用 all 装备不算非本职业）
   恒定保护：强化过的、身上穿的不卖；药水/矿石不参与 */
function ensureAutoSellCfg(){
  if(!ST.autoSellCfg)ST.autoSellCfg={t:{1:true,2:false,3:false,4:false,5:false},oc:false};
  const t=ST.autoSellCfg.t;
  for(const k of[1,2,3,4,5])if(t[k]===undefined)t[k]=(k===1);
  if(ST.autoSellCfg.oc===undefined)ST.autoSellCfg.oc=false;
  return ST.autoSellCfg;
}
/* 背包满时自动出售：按颜色档与非本职业配置清理无强化装备，返回是否成功腾出空间 */
function autoSellWhite(){
  const cfg=ensureAutoSellCfg();
  let total=0,cnt=0;
  for(let i=inv.length-1;i>=0;i--){const it=inv[i];
    if(it.pid)continue;                      // 药水/矿石不自动卖
    const e=EQMAP[it.id];if(!e)continue;
    /* 出售条件：颜色档勾选 中 或 非本职业专属且开启 oc */
    const want=cfg.t[e.tier]||(cfg.oc&&e.cls!==player.cls&&e.cls!=='all');
    if(!want)continue;
    if((it.plus||0)>0)continue;              // 强化过的不卖
    const worn=Object.values(equip).includes(it);
    if(worn)continue;                         // 身上穿的不卖
    total+=eqPrice(it);cnt++;
    inv.splice(i,1);
    if(inv.length<=38)break;                  // 腾出足够空间即可
  }
  if(!cnt)return false;
  ST.gold+=total;ST.stat.goldEarn=(ST.stat.goldEarn||0)+total;
  addText(player.x,player.y-60,'自动出售 +'+total+'G','#ffd84a',13);
  SFX.gold();
  return true;
}
function sellInvItem(idx){
  const it=inv[idx];if(!it)return false;
  if(it.pid){
    const p=POTMAP[it.id];
    if(p&&(p.noSell||p.dan)){toast('该道具珍贵，不可出售');return false;}
    if(p&&p.ore){toast('强化材料不可出售');return false;}
  }
  /* 强化装备同样可以出售（按 sellValueOf 返还金币）——
     返还价远低于强化投入，无法靠"白装强化再卖"套利，详见 sellValueOf 注释 */
  const price=sellValueOf(it);

  addLog('出售 『'+itemName(it)+'』 获得 '+price+' 金币'+((it.plus||0)>0?'（强化+'+it.plus+'）':''));
  SFX.gold();openBag();
  return true;
}
/* 一键出售弹窗：自选品质档与药水 */
const sellSel={w:true,b:true,p:false,pot:false,g:false,d:false};
function showSellDialog(){
  const d=$('itemDetail');showItemDetailBox();
  function calc(){
    let total=0,cnt=0;
    for(const it of inv){
      if(it.pid){if(sellSel.pot&&!POTMAP[it.id].ore){total+=sellValueOf(it);cnt++;}continue;}
      const e=EQMAP[it.id];if(!e)continue;
      /* 强化装备不参与一键出售（见 sellGo 内注释），估算口径与实际执行一致 */
      if((it.plus||0)>0)continue;
      if(e.tier===1&&sellSel.w){total+=eqPrice(it);cnt++;}
      else if(e.tier===2&&sellSel.b){total+=eqPrice(it);cnt++;}
      else if(e.tier===3&&sellSel.p){total+=eqPrice(it);cnt++;}
      else if(e.tier===4&&sellSel.g){total+=eqPrice(it);cnt++;}
      else if(e.tier===5&&sellSel.d){total+=eqPrice(it);cnt++;}
    }
    return{total,cnt};
  }
  function render(){
    const {total,cnt}=calc();
    const mk=(key,label,desc,color)=>'<div class="row" data-sellkey="'+key+'" style="cursor:pointer;padding:7px 0"><span>'+label+' <small style="color:#8a7a50">'+desc+'</small></span><b style="color:'+(sellSel[key]?'#5aff8a':'#5a4a28')+'">'+(sellSel[key]?'☑':'☐')+'</b></div>';
    d.innerHTML='<b style="font-size:16px;color:#ffd870">一键出售</b>'+
     '<div style="margin-top:8px">'+
     mk('w','白色装备','普通',0)+mk('b','蓝色装备','沃玛级',0)+mk('p','紫色装备','祖玛级',0)+
     mk('g','金色装备','赤月级（慎选）',0)+mk('d','魔龙装备','魔龙级（慎选）',0)+mk('pot','药水','折价回收（不含矿石）',0)+
     '</div>'+
     '<div class="row"><span>预计出售 <b id="sellCnt">'+cnt+'</b> 件</span><b style="color:#ffd84a">得 '+total+' 金币</b></div>'+
     '<div style="font-size:11px;color:#8a7a50;margin:4px 0 0">★ 强化过的装备不参与一键出售，请单独出售（可获金币）或批量勾选处理</div>'+
     '<div><button class="goldbtn" style="margin:10px 4px 0 0;background:linear-gradient(180deg,#8a2a1a,#5a180e)" id="sellGo">确认出售</button>'+
     '<button class="goldbtn" style="margin:10px 0 0" id="sellCancel">取消</button></div>';
    d.querySelectorAll('[data-sellkey]').forEach(row=>{
      row.addEventListener('pointerdown',()=>{sellSel[row.dataset.sellkey]=!sellSel[row.dataset.sellkey];render();});
    });
    $('sellGo').addEventListener('pointerdown',()=>{
      let total=0,cnt=0;
      const keep=[];
      for(const it of inv){
        let sell=false;
        if(it.pid)sell=sellSel.pot&&!POTMAP[it.id].ore; // 矿石是强化材料，不参与一键出售
        else{const e=EQMAP[it.id];
          if(!e){continue;}
          /* ★ 强化装备不参与一键出售：品质档勾选是"按档清包"，一键下去
             很容易把特意留着的 +N 装备一起带走。强化装请用单件出售或
             批量勾选（那两处都会写明金额再确认）。 */
          if((it.plus||0)>0){keep.push(it);continue;}
          if(e.tier===1)sell=sellSel.w;else if(e.tier===2)sell=sellSel.b;
          else if(e.tier===3)sell=sellSel.p;else if(e.tier===4)sell=sellSel.g;
          else if(e.tier===5)sell=sellSel.d;}
        if(sell){total+=sellValueOf(it);cnt++;}
        else keep.push(it);
      }
      if(!cnt){toast('未勾选任何可出售物品');return;}
      inv.length=0;keep.forEach(i=>inv.push(i));
      ST.gold+=total;
      hideItemDetail();
      banner('一键出售完成','出售 '+cnt+' 件 · 获得 '+total+' 金币');
      SFX.gold();updateQuestBtn();openBag();
    });
    $('sellCancel').addEventListener('pointerdown',()=>hideItemDetail());
  }
  render();
}
/* ---------------- 任务系统 ---------------- */
function maxEquipTier(){
  let mx=0;
  for(const k in equip){const e=equip[k];if(e&&EQMAP[e.id])mx=Math.max(mx,EQMAP[e.id].tier);}
  return mx;
}
function countOwnTier(t){
  let c=0;
  for(const it of inv){if(!it.pid&&EQMAP[it.id]&&EQMAP[it.id].tier>=t)c++;}
  for(const k in equip){const e=equip[k];if(e&&EQMAP[e.id]&&EQMAP[e.id].tier>=t)c++;}
  return c;
}
function questProgress(q){
  if(q.type==='kill'){let c=0;for(const id of q.t)c+=(ST.qKills[id]||0);return c;}
  if(q.type==='level')return player.level;
  if(q.type==='equip')return maxEquipTier()>=q.t?1:0;
  if(q.type==='own')return countOwnTier(q.t);
  return 0;
}
function questRewardText(q){
  const parts=[];
  if(q.rw.gold)parts.push(q.rw.gold+' 金币');
  if(q.rw.exp)parts.push(q.rw.exp+' 经验');
  if(q.rw.items)q.rw.items.forEach(it=>parts.push((POTMAP[it.id]?POTMAP[it.id].n:EQMAP[it.id].n)+'×'+it.n));
  if(q.rw.loot)parts.push(TIER_NAME[q.rw.loot]+'级装备×1');
  return parts.join(' + ');
}
function giveQuestReward(q){
  if(q.rw.gold){ST.gold=clampGold((ST.gold||0)+q.rw.gold);ST.stat.goldEarn=(ST.stat.goldEarn||0)+q.rw.gold;}
  if(q.rw.exp)gainExp(q.rw.exp);
  /* 任务奖励满包时折算金币，不再静默丢失 */
  if(q.rw.items)addOrConvertAll(q.rw.items.map(it=>({id:it.id,pid:it.pid,n:it.n||1})),{silent:false});
  if(q.rw.loot){
    const pool=EQUIPS.filter(e=>e.tier===q.rw.loot&&(e.cls==='all'||CLS_FULL[e.cls]===player.cls));
    const eq=pool.length?pick(pool):EQMAP.wood_sword;
    const inst={id:eq.id,q:rollEqQ()};
    const r=addOrConvert(inst,{silent:true});
    if(r.ok)addLog('额外奖励 『'+eqName(inst)+'』');
    else if(r.conv>0)addLog('背包已满，奖励折算为 '+r.conv+' 金币');
  }
}
function questNotifyCheck(){
  let newly=false;
  for(const q of QUESTS){
    if(ST.qClaimed.includes(q.id))continue;
    if(!ST.qMemo[q.id]&&questProgress(q)>=q.n){
      ST.qMemo[q.id]=1;newly=true;
      banner('任务完成：'+q.n,'打开任务面板领取奖励');
    }
  }
  if(newly)updateQuestBtn();
}
function openQuests(){
  let html='<div style="font-size:12px;color:#a89058;margin-bottom:10px">完成任务即可领取奖励，杀怪、升级、集装备都会自动计数</div>';
  let canClaim=0;
  for(const q of QUESTS){
    const claimed=ST.qClaimed.includes(q.id);
    const done=questProgress(q)>=q.n;
    if(done&&!claimed)canClaim++;
    const prog=claimed?q.n+'/'+q.n:Math.min(questProgress(q),q.n)+'/'+q.n;
    html+='<div class="skItem'+(claimed?' lockd':'')+'" style="border-color:'+(done&&!claimed?'#ffca4a':'#5a4a28')+'">'+
     '<b>'+q.n+'</b> <span style="font-size:11px;color:'+(done&&!claimed?'#ffd870':'#a89058')+'">'+
     (claimed?'✓ 已完成':(done?'可领取！':prog))+'</span>'+
     '<p>'+q.d+' <span style="color:#8ad8ff">('+prog+')</span></p>'+
     '<p style="color:#ffd84a;font-size:11px">奖励：'+questRewardText(q)+'</p>'+
     (done&&!claimed?'<button class="goldbtn" style="margin-top:6px" data-claim="'+q.id+'">领取奖励</button>':'')+
     '</div>';
  }
  openPanel('任务',html);
  $('panelBody').querySelectorAll('[data-claim]').forEach(b=>{
    b.addEventListener('pointerdown',()=>claimQuest(b.dataset.claim));
  });
  updateQuestBtn();
}
function claimQuest(qid){
  const q=QUESTS.find(x=>x.id===qid);
  if(!q||ST.qClaimed.includes(qid)||questProgress(q)<q.n)return;
  ST.qClaimed.push(qid);
  giveQuestReward(q);
  banner('领取成功：'+q.n,questRewardText(q));
  SFX.lvl();
  addLog('完成任务「'+q.n+'」');
  openQuests();
  saveGame();
}
function updateQuestBtn(){
  let canClaim=0;
  for(const q of QUESTS){
    if(!ST.qClaimed.includes(q.id)&&questProgress(q)>=q.n)canClaim++;
  }
  const dot=$('questDot');
  if(dot)dot.style.display=canClaim>0?'block':'none';
}
function buyPotion(pid,count){
  const p=POTMAP[pid];const cost=p.price*count;
  if(ST.gold<cost){toast('金币不足');return;}
  let slot=inv.find(i=>i.id===pid&&i.pid);

    slot={id:pid,pid:1,n:0};inv.push(slot);
  }
  ST.gold-=cost;ST.stat.goldSpend=(ST.stat.goldSpend||0)+cost;
  ST.stat.pots=(ST.stat.pots||0)+count;
  slot.n+=count;
  SFX.gold();openShop();
}

        const l=Math.hypot(dx,dy),max=48;

        joy.active=false;joy.dx=0;joy.dy=0;$('joy').style.display='none';
        $('joyKnob').style.left='29px';$('joyKnob').style.top='29px';
      }
    }};
  cv.addEventListener('touchend',endT,opt);cv.addEventListener('touchcancel',endT,opt);

    if(isItemDetailOpen()){hideItemDetail();return;}

        SFX.click();npc.act==='shop'?openShop():openMapPanel();

    }
    mDown=true;joy.active=true;joy.id='m';

    const j=$('joy');j.style.display='block';j.style.left=(e.clientX-55)+'px';j.style.top=(e.clientY-55)+'px';});
  window.addEventListener('mousemove',e=>{if(mDown&&joy.active){
    let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;const l=Math.hypot(dx,dy),max=48;
    if(l>max){dx=dx/l*max;dy=dy/l*max;}

    $('joyKnob').style.left=(29+dx)+'px';$('joyKnob').style.top=(29+dy)+'px';}});

/* ---------------- S10 UI ---------------- */
function initUI(){
  // 技能按钮
  const grid=$('skillGrid');grid.innerHTML='';
  const nSk=CLASSES[player.cls].skills.length;
  for(let i=0;i<nSk;i++){
    const b=document.createElement('div');b.className='skillBtn';b.dataset.idx=i;
    let lpT=null,lp=false;
    b.addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();
      lp=false;clearTimeout(lpT);
      lpT=setTimeout(()=>{ // 长按 550ms 切换自动释放
        lp=true;
        if(SKILLS[CLASSES[player.cls].skills[i]].type==='passive'){toast('被动技能无需设置');return;}
        ST.autoSkill[i]=!ST.autoSkill[i];
        updateSkillBtns();
        toast(SKILLS[CLASSES[player.cls].skills[i]].name+'：'+(ST.autoSkill[i]?'已加入自动释放':'改为手动释放'));
        SFX.click();
      },550);
    });
    b.addEventListener('pointerup',e=>{e.preventDefault();clearTimeout(lpT);
      if(!lp)castSkill(i);});
    b.addEventListener('pointerleave',()=>clearTimeout(lpT));
    b.addEventListener('pointercancel',()=>clearTimeout(lpT));
    grid.appendChild(b);
  }
  $('autoBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();
    ST.auto=!ST.auto;updateAutoBtn();
    toast(ST.auto?'自动挂机已开启':'自动挂机已关闭');if(ST.auto)acquireTarget();});
  $('cfgBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();SFX.click();openSkillConfig();});
  $('plFrame').addEventListener('pointerdown',e=>{e.preventDefault();openChar();});
  /* 「角色」按钮已并入左上角头像（点头像即打开角色面板），原 btnChar 移除 */
  $('btnBag').addEventListener('pointerdown',e=>{e.preventDefault();openBag();});
  $('btnMap').addEventListener('pointerdown',e=>{e.preventDefault();openMapPanel();});
  $('btnSet').addEventListener('pointerdown',e=>{e.preventDefault();openSettings();});
  $('btnHome').addEventListener('pointerdown',e=>{e.preventDefault();
    if(player.mapId==='village'){toast('已经在村里啦');return;}
    switchMap('village');toast('已回到玛法村');});
  $('btnShop').addEventListener('pointerdown',e=>{e.preventDefault();openShop();});
  $('btnQuest').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();openQuests();});
  /* 「攻略」已从左下角移到右上角按钮列（#topBtns）：
     左下角原先是摇杆触摸区 + 日志区（#logBox bottom:150px）+ 5 个按钮（3 行共 152px，
     顶到 bottom:168px），三者叠在一起 —— 既遮挡信息提示，拖摇杆时也必然压到按钮。
     移到右上角后 #leftBtns 只剩 4 个（2 行 99px，顶到 115px），自然让开了 150px 的日志区。 */
  $('btnGuide').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();SFX.click();openGuide();});
  $('btnAchv').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();openAchvPanel();});
  $('npcBtn').addEventListener('pointerdown',e=>{e.preventDefault();
    if(_npcShown){SFX.click();_npcShown.act==='shop'?openShop():openMapPanel();}});
  $('guide').addEventListener('pointerdown',e=>{e.preventDefault();openQuests();});
  $('panelClose').addEventListener('pointerdown',e=>{
    e.preventDefault();
    /* 子面板 → 返回上一层面板（如设置）；顶层 → 关闭 */
    if(_panelBack){SFX.click();const f=_panelBack;f();}
    else closePanel();
  });
  /* 点详情卡之外的任意位置（红白区域）→ 关闭物品详情 */
  const dtb=$('dtBack');
  if(dtb)dtb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();hideItemDetail();});
  $('panel').addEventListener('pointerdown',e=>{if(e.target===$('panel'))closePanel();});
  window.addEventListener('resize',resizeCanvas);
  /* ---- 关页/切后台保存三保险 ----
     手机端最难保住进度的是"上滑杀进程 / 直接关闭标签"这两种情况：
     · visibilitychange 只在切后台/锁屏时触发，杀进程时不一定来得及
     · pagehide 在 iOS Safari 与多数安卓浏览器上更可靠
     · beforeunload 覆盖桌面端关闭标签
     三个都挂上，配合 3 秒自动存档，把丢失窗口压到最小 */
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
  window.addEventListener('pagehide',()=>{saveGame();});
  window.addEventListener('beforeunload',()=>{saveGame();});
}

/* 卡通药水瓶：红=生命 / 蓝=魔法，瓶身大小随规格（s/m/l）递增 */

  g.fillStyle=liquidHi;g.fillRect(-12,1,24,2.6);

  g.fillStyle='#ffffffaa';

/* ============ 背包整理 ============
   排序哲学：「打开背包时脑子里的问题是『我要换件装备』，不是『这件值多少钱』」。
   所以第一顺位不是价值，而是「我能不能马上用上」。五级排序键：

   ① 分类：可穿戴装备 > 材料/矿石 > 药水/内丹。
      —— 矿石强化时找、内丹炼化时找，都是「有事才来」，不该挡在装备前面。
   ② 可穿戴优先：本职业能用（或通用）的排在前面，别的职业的沉到最后。
      —— 打到别职业的紫装只是卖钱货，不该跟自己的升级件抢视线。
   ③ 品质：tier 4→1（赤月金 → 沃玛蓝 → 白），同品质再按 q 分（小极品 > 普通 > 劣质）。
   ④ 部位：按人物装备栏的从上到下顺序 weapon → helmet → armor → necklace → bracelet → ring，
      —— 与角色面板视觉顺序一致，扫一眼就知道缺哪块。
   ⑤ 强化等级：+12 → +0 降序。同部位同品质时，练过的那把一定在最前。

   稳定性：Array.prototype.sort 在 V8 已是稳定排序，同键项保持原有入包顺序
   （老玩家会记得「我那把刀在第 3 格」，整理后不该乱跳）。
   完成后自动堆叠同类消耗品（历史存档/外部注入可能产生同 id 多个堆叠）。 */
const BAG_SLOT_ORDER={weapon:0,helmet:1,armor:2,necklace:3,bracelet:4,ring:5};
/* 分类权重：数字越小越靠前 */
function bagCatOf(it){
  if(!it)return 9;
  if(!it.pid){                     // 装备
    const d=EQMAP[it.id];if(!d)return 8;
    return (d.cls==='all'||CLS_FULL[d.cls]===player.cls)?0:1;
  }
  const pd=POTMAP[it.id];if(!pd)return 8;
  if(pd.ore)return 2;              // 黑铁矿石（强化材料，成组出现）
  if(pd.dan)return 4;              // Boss 内丹（稀罕，放最后反而好找）
  return 3;                        // 药水
}
/* 药水内部再按 类型(hp→mp) → 档次(s→m→l) 排，方便一眼看出库存量 */
function bagPotOrder(id){
  const t=id.startsWith('hp')?0:1;
  const sz=id.endsWith('_s')?0:id.endsWith('_m')?1:2;
  return t*10+sz;
}
/* 装备战力分：把一件装备的属性按 CMP_W 权重折算成单一分数。
   用于「↑可装」角标判定与智能整理排序 —— 与详情页的「综合评估」同一套权重，
   保证按钮上标了「可装」，点进去的综合评估也是「强于当前装备」，两处结论一致。
   ★ 折算规则必须与 recalcStats 逐字对齐，否则"标了可装，装上却没提升"：
     · 品质用 qmul()（取 EQQ[q].mul 倍率），不是把品质下标 0/1/2 当乘数 ——
       旧写法 q=qOf(it) 会把"普通品质"当成 ×1、"小极品"当成 ×2，
       而真实倍率是 ×1 与 ×1.32，导致小极品被高估、劣质被低估；
     · 强化每级 +12% 对**所有部位**生效（见 recalcStats 的 pm=Math.pow(1.12,e.plus)），
       不是只对武器生效 —— 旧写法把头盔/戒指的 +N 当成 0，两件只差强化等级时
       分数完全相同，「↑可装」永远是 false，玩家永远换不掉手里的旧装。 */
function eqScore(it){
  const d=EQMAP[it.id];if(!d||!d.st)return 0;
  const q=qmul(it),pm=plusMul(it);
  let s=0;
  for(const k in d.st)s+=(d.st[k]||0)*q*pm*(CMP_W[k]||0);
  return s;
}
/* 该背包装备是否"值得换上"：同部位存在空槽（手镯②/戒指②空着）→ 可装；
   否则与同部位所有已穿戴装备比较，分数更高 → 可装。
   ★ 只在等级达标时标角标 —— 标了却穿不上会让玩家白高兴一场。 */
function canEquipUpgrade(it){
  if(it.pid)return false;
  const d=EQMAP[it.id];if(!d||!d.slot)return false;
  if(!eqLvOk(d))return false;
  if(d.cls!=='all'&&CLS_FULL[d.cls]!==player.cls)return false;
  const slots=eqSlotsOf(d.slot);
  if(slots.some(k=>!equip[k]))return true;          // 有空槽，装上就是提升
  const my=eqScore(it);
  /* 与同部位已穿戴的最强那件比：只要能顶掉任何一格就算可装 */
  return slots.some(k=>equip[k]&&my>eqScore(equip[k]));
}
function bagItemLess(a,b){
  const ca=bagCatOf(a),cb=bagCatOf(b);
  if(ca!==cb)return ca-cb;
  if(ca===3)return bagPotOrder(a.id)-bagPotOrder(b.id);   // 同组药水按档次
  if(ca===2||ca===4)return 0;                             // 矿石/内丹同组等比数量，保序
  const da=EQMAP[a.id]||{},db=EQMAP[b.id]||{};
  /* ③ 品质 */
  const ta=da.tier||0,tb=db.tier||0;
  if(ta!==tb)return tb-ta;
  const qa=a.q===2?2:(a.q===0?0:1),qb=b.q===2?2:(b.q===0?0:1);
  if(qa!==qb)return qb-qa;
  /* ④ 部位 */
  const sa=BAG_SLOT_ORDER[da.slot]===undefined?9:BAG_SLOT_ORDER[da.slot];
  const sb=BAG_SLOT_ORDER[db.slot]===undefined?9:BAG_SLOT_ORDER[db.slot];
  if(sa!==sb)return sa-sb;
  /* ⑤ 强化等级 */
  const pa=a.plus||0,pb=b.plus||0;
  if(pa!==pb)return pb-pa;
  return 0;
}
/* 智能排序（「智能整理」用）：在常规排序之上，把"可装"整体提到最前、
   "已明显落后于当前装备"的沉到最后。让玩家一眼看出该换哪件、该清哪些。
   ★ 分层权重放大到 10000，确保任意两层的相对顺序绝对不受层内排序影响。 */
function bagSmartLess(a,b){
  const la=smartRank(a),lb=smartRank(b);
  if(la!==lb)return la-lb;
  return bagItemLess(a,b);
}
let _smartRankCache=null,_smartRankStamp=0;
function smartRank(it){
  /* 同一帧内避免重复计算（比较函数会被调用 O(n log n) 次） */
  const now=performance.now();
  if(_smartRankStamp!==Math.floor(now/50)){_smartRankCache=new Map();_smartRankStamp=Math.floor(now/50);}
  if(_smartRankCache.has(it))return _smartRankCache.get(it);
  let r;
  if(!it.pid&&EQMAP[it.id]&&EQMAP[it.id].slot){
    if(canEquipUpgrade(it))r=0;                          // 层①：值得换上
    else r=3;                                            // 层④：落后/无提升 → 沉底
  }else if(it.pid){
    const pd=POTMAP[it.id];
    r=(pd&&(pd.ore||pd.dan))?2:1;                        // 层②药水（常吃）→ 层③材料
  }else r=3;
  _smartRankCache.set(it,r);
  return r;
}
/* 返回 {stacked: 合并掉的格数, before, after}，供 UI 提示与自动化断言
   smart=true 走「智能整理」：可装 → 药水 → 材料 → 淘汰装备 */
function tidyBag(smart){
  if(!inv.length){toast('背包本来就是空的');return{stacked:0,before:0,after:0,smart:!!smart};}
  const before=inv.length;
  /* ---- ① 同类消耗品先合并（必须按 id 分组，矿石/药水/内丹各自独立堆叠）---- */
  const keep=[],potIdx={};
  for(const it of inv){
    if(it.pid){
      const k=it.id;
      if(potIdx[k]===undefined){potIdx[k]=keep.length;keep.push(it);}
      else{
        const t=keep[potIdx[k]];
        /* STACK_MAX 为药水单格上限，超出部分必须新开一格，不能无限叠加 */
        const room=STACK_MAX-(t.n||1);
        if(room>0){
          const mv=Math.min(room,it.n||1);
          t.n=(t.n||1)+mv;it.n=(it.n||1)-mv;
        }
        if((it.n||0)>0)keep.push(it);
      }
    }else keep.push(it);
  }
  const stacked=before-keep.length;
  /* ---- ② 排序 ---- */
  keep.sort(smart?bagSmartLess:bagItemLess);
  inv.length=0;
  for(const it of keep)inv.push(it);
  saveGame();
  const msg=(stacked>0?('已整理：堆叠合并 '+stacked+' 组'):'已整理')+(smart?'（智能排序）':'');
  toast(msg);
  addLog('📦 背包'+msg+'（'+inv.length+' 件）');
  return{stacked,before,after:inv.length,smart:!!smart};
}

       换装的完整动作是「看身上 → 挑背包 → 换上 → 再看身上」，
       拆成两页会强迫玩家在切换里丢失对比上下文。
     · 布局：左列 4 格（武器/衣服/头盔/戒指①）

             右列 4 格（项链/手镯①/手镯②/戒指②）

}

        unk.textContent='?';
        unk.style.cssText='display:flex;align-items:center;justify-content:center;color:#8a7a50;font-size:20px;font-weight:900';
        unk.addEventListener('pointerdown',e=>{
          e.preventDefault();
          inv.splice(inv.indexOf(it),1);
          saveGame();toast('已清除无效物品');openBag();
        });
        grid.appendChild(unk);
        continue;
      }
      if(def.tier)cell.classList.add('q'+def.tier);
      /* 筛选：不符合当前 chip 的格子置灰保留（保留位置感，不做移除——
         移除会让物品"跳位"，玩家刚记住的位置就变了） */
      if(!bagPass(it))cell.classList.add('dimmed');
      if(bagBatch&&bagSel.has(it))cell.classList.add('checked');
      cell.appendChild(itemIcon(def));
      if(it.pid&&it.n>1){const q=document.createElement('span');q.className='qn';q.textContent=it.n;cell.appendChild(q);}
      /* ---- 角标分区渲染 ----
         左上 = 「↑可装」（最高优先级信息：该换了）
         左中/上 = 品质标记栈（小极品/劣质 + 强化等级）
         右上 = 职业专属；右下 = 堆叠数量 */
      if(canEquipUpgrade(it))cell.appendChild(Object.assign(document.createElement('span'),{className:'mkUp',textContent:'↑可装'}));
      const marks=[];
      if(!it.pid&&(it.q===2||it.q===0))
        marks.push('<span class="mk '+(it.q===2?'q2s':'q0s')+'">'+(it.q===2?'小极品':'劣质')+'</span>');
      if(!it.pid&&it.plus)marks.push('<span class="mk pl">+'+it.plus+'</span>');
      if(marks.length){
        const box=document.createElement('div');box.className='marks';
        box.innerHTML=marks.join('');cell.appendChild(box);
      }
      if(!it.pid&&def.cls&&def.cls!=='all'){
        const cn=document.createElement('span');
        cn.className='clsTag';
        cn.style.color=({w:'#ff8a70',m:'#7ab0ff',t:'#5ad8a0'})[def.cls];
        cn.textContent=({w:'战',m:'法',t:'道'})[def.cls];cell.appendChild(cn);
      }
      /* 普通模式 = 看详情；批量模式 = 打勾选中 */
      cell.addEventListener('pointerdown',e=>{
        e.preventDefault();
        if(bagBatch){
          if(bagSel.has(it))bagSel.delete(it);else bagSel.add(it);
          SFX.click();openBag();
        }else showItemDetail(def,i);
      });
    }
    grid.appendChild(cell);
  }
}
/* 批量出售选中：与单件出售共用 sellValueOf（强化装备也返金币），并统计实际成交与总价 */
function batchSell(){
  if(!bagSel.size){toast('还没有勾选任何物品');return;}
  let total=0,cnt=0,skip=0,plusCnt=0;
  const keep=[];
  for(const it of inv){
    if(!bagSel.has(it)){keep.push(it);continue;}
    const pd=it.pid?POTMAP[it.id]:null;
    if(pd&&(pd.ore||pd.dan)){skip++;keep.push(it);continue;}   // 珍贵/材料：不参与
    if(eqWornSlot(it)){skip++;keep.push(it);continue;}         // 穿在身上的：不卖
    total+=sellValueOf(it);
    cnt++;
    if((it.plus||0)>0)plusCnt++;
  }
  if(!cnt){toast(skip?('选中的 '+skip+' 件都不可出售'):'没有可出售的物品');return;}
  const doIt=()=>{
    inv.length=0;keep.forEach(x=>inv.push(x));
    ST.gold=Math.min(GOLD_MAX||99999999,ST.gold+total);
    bagSel.clear();bagBatch=false;
    hideItemDetail();saveGame();
    banner('批量出售完成','出售 '+cnt+' 件 · 获得 '+total+' 金币'+(plusCnt?('（含 '+plusCnt+' 件强化装备）'):''));
    SFX.gold();updateQuestBtn();openBag();
  };
  const d=$('itemDetail');showItemDetailBox();
  d.innerHTML='<div style="text-align:center;padding:6px 0">'+
   '<div style="font-size:15px;color:#ffca4a;font-weight:900">确认批量出售？</div>'+
   '<div style="margin:8px 0;font-size:14px">共 '+cnt+' 件</div>'+
   '<div style="font-size:12px;color:#a89058;line-height:1.7">预计获得 <b style="color:#ffd84a">'+total+'</b> 金币'+
   (plusCnt?'<br><span style="color:#ffd84a">其中 '+plusCnt+' 件强化装备一并出售（按强化等级计价）</span>':'')+
   (skip?'<br><span style="color:#8a7a50">'+skip+' 件因不可售（内丹/矿石/已穿戴）已自动跳过</span>':'')+'</div>'+
   '<div style="margin-top:12px"><button class="goldbtn" style="margin:0 4px" id="bsNo">取消</button>'+
   '<button class="goldbtn" style="margin:0 4px;background:#4a1e1e;border-color:#8a3a3a;color:#ffb0a0" id="bsYes">确认出售</button></div></div>';
  $('bsYes').addEventListener('pointerdown',doIt);
  $('bsNo').addEventListener('pointerdown',()=>{hideItemDetail();openBag();});
}
/* 批量丢弃：二次确认显示总价值，防手滑把一堆好东西清掉 */

   '<div style="margin:8px 0;font-size:14px">共 '+cnt+' 件</div>'+
   '<div style="font-size:12px;color:#a89058;line-height:1.7">'+
   '丢弃后物品将<b style="color:#ffb0a0">永久消失，无法找回</b><br>'+
   '这些物品若出售约值 <b style="color:#ffd84a">'+value+'</b> 金币<br>'+
   '<span style="color:#8a7a50">建议先考虑「出售选中」——同样的清理效果还能换钱</span></div>'+
   '<div style="margin-top:12px"><button class="goldbtn" style="margin:0 4px" id="bdNo">取消</button>'+

  $('bdYes').addEventListener('pointerdown',()=>{

  $('bdNo').addEventListener('pointerdown',()=>{hideItemDetail();openBag();});

/* 兼容旧调用点：点头像和点「背」都进同一个合并面板 */
function openChar(){openBag();}
/* 属性权重：折算成"战力分"用于优劣总评。
   攻击类权重最高（直接决定清怪速度），防御类次之，HP/MP 按比例给分。 */
const CMP_W={atk:2.0,matk:2.0,def:1.2,mdef:1.0,hp:.15,mp:.10};
function statCompareRows(def,q,plus){
  /* 与当前已穿戴同部位装备对比（计入品质与强化系数）。
     ★ 双槽位（手镯/戒指）：取该部位已穿戴两件中"更强的那件"作为对比基准 ——
       玩家想知道的是"换上它有没有进步"，跟弱的那件比没有参考价值；
       若同部位有空槽，则不存在对比对象，只显示本件属性（视为纯提升）。 */
  const cands=eqSlotsOf(def.slot).map(k=>equip[k]).filter(Boolean);
  let cur=null,curScore=-Infinity;
  for(const cc of cands){const s=eqScore(cc);if(s>curScore){curScore=s;cur=cc;}}
  const curDef=cur?EQMAP[cur.id]:null;
  /* ★ 折算必须与 eqScore / recalcStats 三方一致：
       品质用 qmul()、强化对所有部位生效。
       旧写法把 plus 系数限定在 weapon 上，导致两件只差强化等级的头盔/戒指
       在详情页显示"基本持平"，而背包角标也用同一套错误系数 → 玩家永远换不掉旧装。 */
  const myMul=qmul({q})*plusMul({plus});
  const keys=['atk','matk','def','mdef','hp','mp'];
  let rows='',score=0,nUp=0,nDown=0,nSame=0;
  for(const k of keys){
    const nv=(def.st&&def.st[k]||0)*myMul;
    const cv=curDef?(curDef.st[k]||0)*qmul(cur)*plusMul(cur):0;
    if(!nv&&!cv)continue;
    const delta=Math.floor(nv)-Math.floor(cv);
    if(curDef){
      if(delta>0)nUp++;else if(delta<0)nDown++;else nSame++;
      score+=delta*(CMP_W[k]||0);
    }
    const dTxt=curDef?(delta>=0?' <span class="up">▲+'+delta+'</span>':' <span class="down">▼'+delta+'</span>'):'';
    rows+='<div class="row"><span>'+STAT_NAMES[k]+'</span><b>+'+Math.floor(nv)+dTxt+'</b></div>';
  }
  if(curDef){
    /* 优劣总评：加权总分 + 属性条目数共同决定结论 */
    const sc=Math.round(score);
    const mean=Math.floor(score/Math.max(1,nUp+nDown+nSame));
    let tone,icon;
    if(sc>=0&&mean>=0){tone='up';icon='▲';}
    else if(sc<0&&mean<0){tone='down';icon='▼';}
    else {tone=(sc>=0?'up':'down');icon=(sc>=0?'▲':'▼');}
    let verdict;
    const abs=Math.abs(sc);
    if(nUp>0&&nDown===0&&abs>0)      verdict='全面强于当前装备';
    else if(nDown>0&&nUp===0&&abs>0) verdict='全面弱于当前装备';
    else if(abs===0)                 verdict='与当前装备基本持平';
    else if(abs<8)                   verdict='与当前装备差异不大';
    else                             verdict=(sc>0?'综合强于当前装备':'综合弱于当前装备');
    const sameTxt=nSame?('（'+nSame+' 项持平）'):'';
    const flat=(abs===0);            // 完全持平用中性灰样式，不标 ▲/▼
    const bg=flat?'rgba(120,120,120,.14)':(tone==='up'?'rgba(80,160,80,.16)':'rgba(170,60,60,.16)');
    const bd=flat?'#5a5a52':(tone==='up'?'#3f6b3f':'#7a3a3a');
    const cl=flat?'#c8c0a8':(tone==='up'?'up':'down');
    rows+='<div style="margin-top:8px;padding:6px 8px;border-radius:6px;background:'+bg+
      ';border:1px solid '+bd+'">'+
      '综合评估：<b class="'+cl+'">'+(flat?'◆':'')+' '+verdict+'</b>'+
      '<span style="color:#a89058">（战力分 '+(flat?'±':icon)+(flat?'0':((sc>=0?'+':'')+sc))+
      ' · 提升 '+nUp+' 项 / 下降 '+nDown+' 项'+sameTxt+'）</span></div>';
    rows+='<div style="font-size:11px;color:#8a7a50;margin-top:6px">当前已装备：'+eqName(cur)+'（对比已计入品质'+(cur.plus?'与强化':'')+'）</div>';
  }
  return rows;
}
function showItemDetail(def,idx){
  const d=$('itemDetail');showItemDetailBox();
  const it=idx>=0?inv[idx]:null;
  /* 品质越界保护：正常掉落只会产生 0/1/2，但损坏的存档可能带出非法值，
     直接索引 EQQ[q] 会令整个详情面板崩溃 */
  const q=it&&!it.pid?Math.max(0,Math.min(EQQ.length-1,(it.q|0)||1)):1;
  const plus=it&&!it.pid?(it.plus||0):0;
  let stats='';
  if(def.pid){
    if(def.heal)stats+='<div class="row"><span>恢复生命</span><b>'+def.heal+'</b></div>';
    if(def.mana)stats+='<div class="row"><span>恢复魔法</span><b>'+def.mana+'</b></div>';
    if(def.dan)stats+='<div style="font-size:12px;color:#c88aff;margin-top:4px">✦ 炼化后永久获得 <b>1 点技能点</b>（可直接投入天赋树）</div>'+
      '<div style="font-size:11px;color:#8a7a50;margin-top:3px">当前技能点余额：<b style="color:#7ab0ff">'+(ST.skillPt||0)+'</b> 点</div>';
    if(def.ore)stats+='<div style="font-size:11px;color:#8a7a50;margin-top:4px">背包存量：'+countOre()+' 个（击败怪物有几率掉落）</div>';
  }else if(def.slot){
    stats=statCompareRows(def,q,plus);
  }
  let extra='';
  /* 强化区：六个部位全部可强化（仅背包内装备） */
  let forgeBtn='';
  if(def.slot&&it&&!it.pid)forgeBtn=forgePanelHtml(it,false);
  if(def.slot){
    /* 双槽位（手镯/戒指）：同 id 且品质/强化等级完全一致、且已在**任一**格上，
       才算"已装备"（避免玩家把左手那只再装到右手上，白占一格）。
       有空槽时按钮文案用「装备到 手镯②」，让玩家知道会进哪一格。 */
    const slots=eqSlotsOf(def.slot);
    const wornK=slots.find(k=>{const e=equip[k];
      return e&&e.id===def.id&&qOf(e)===q&&(e.plus||0)===plus;});
    const freeK=slots.find(k=>!equip[k]);
    const lvOk=eqLvOk(def);
    const reqLv=eqReqLv(def);
    if(!wornK){
      if(lvOk){
        const txt=freeK?('装备到 '+EQ_SLOT_NAME[freeK]):'更换';
        extra='<button class="goldbtn" style="margin:10px 4px 0 0" id="dtUse">'+txt+'</button>';
        if(freeK&&slots.length>1)extra+='<span style="font-size:11px;color:#8a7a50;margin-left:6px">同名装备可双持</span>';
      }else{
        /* 未达等级：不给按钮，改成明确的红字说明 ——
           给个禁用的灰按钮不如直接说清「差几级」，玩家知道该去练级而不是以为卡 bug */
        extra='<div style="margin:10px 0 0;padding:8px 10px;border:1px solid #8a3a3a;border-radius:6px;'+
          'background:#2a0e0e88;font-size:12px;color:#ffb0a0;line-height:1.6">'+
          '⚠ 等级不足：需 <b style="color:#ffd84a">Lv'+reqLv+'</b> 才能穿戴'+
          '（当前 Lv'+player.level+'，还差 '+(reqLv-player.level)+' 级）</div>';
      }
    }
  }
  /* 道具（有实际效果的）显示「使用」按钮：药水 / Boss 内丹 */
  if(it&&it.pid&&(def.heal||def.mana||def.dan))
    extra='<button class="goldbtn" style="margin:10px 4px 0 0;border-color:#c88aff;color:#e8d0ff" id="dtUse">'+
      (def.dan?'✦ 炼化内丹（技能点 +1）':'使用')+'</button>';
  /* 出售 / 丢弃（仅背包内物品，非已穿戴）。
     注意：sp/sellMsg 必须声明在函数级——下方出售按钮的回调会引用，
     若在 if 块内 const 声明，回调执行时会 ReferenceError: sp is not defined */
  let tradeBtn='',sellMsg='';
  if(it&&idx>=0){
    /* 出售（统一走 sellValueOf）：
       · 普通装备与药水 → 出售换金币
       · 强化装备 → 同样可出售，返还价随强化等级提升（但远低于强化投入，无套利）
       · Boss 内丹 / 黑铁矿石 → 完全不可出售 */
    const isDan=it.pid&&POTMAP[it.id]&&POTMAP[it.id].dan;
    const isOre=it.pid&&POTMAP[it.id]&&POTMAP[it.id].ore;
    /* ★ 已在身上的装备不允许从背包详情里出售/丢弃（双槽位上线后，
       玩家可能通过"装左手→右键仍在背包"的错觉误操作卖掉身上装备）。 */
    const wornK=eqWornSlot(it);
    const canSell=!isDan&&!isOre&&!wornK;
    const sp=sellValueOf(it);
    if(wornK)sellMsg='该装备正穿戴在「'+EQ_SLOT_NAME[wornK]+'」上，请先在装备栏卸下';
    else if(canSell&&((it.plus||0)>0))sellMsg='强化装备出售可获得 '+sp+' 金币（强化投入远高于此价，请确认后再卖）';
    else if(canSell)sellMsg='出售可获得 '+sp+' 金币';
    const sellTxt=wornK?('已装备·'+EQ_SLOT_NAME[wornK]):(canSell?('出售 '+sp+'G'):(isDan?'珍贵·不可售':'强化材料·不可售'));
    tradeBtn='<button class="goldbtn" style="margin:10px 4px 0 0;'+(canSell?'':'opacity:.4')+'" id="dtSell"'+(canSell?'':' disabled')+'>'+
      sellTxt+'</button>'+
      '<button class="goldbtn" style="margin:10px 4px 0 0;background:#4a1e1e;border-color:#8a3a3a;color:#ffb0a0;'+(wornK?'opacity:.4':'')+'" id="dtDrop"'+(wornK?' disabled':'')+'>丢弃</button>';
  }
  d.innerHTML='<div style="display:flex;gap:12px;align-items:center"><div id="dtIcon"></div>'+
   '<div><b class="tq'+(def.tier||1)+'" style="font-size:16px">'+(def.slot?eqName({id:def.id,q,plus}):def.n)+'</b>'+
   (def.slot?'<div style="font-size:11px;color:#a89058;margin-top:3px">'+EQ_SLOT_NAME[baseSlotOf(def.slot)]+
   (def.cls&&def.cls!=='all'?' · '+({w:'战士',m:'法师',t:'道士'})[def.cls]+'专属':'')+' · '+TIER_NAME[def.tier]+'品质'+
   (q!==1?' · <span style="color:'+EQQ[q].color+'">'+EQQ[q].n+(q===2?'(+32%)':'(-30%)')+'</span>':'')+
   (plus?' · <span style="color:#ffd84a">强化+'+plus+'</span>':'')+
   /* 等级需求：与 tier 档位绑定的硬门槛，未满足时标红以便一眼看出 */
   (eqReqLv(def)>1?' · <span style="color:'+(eqLvOk(def)?'#8ad8ff':'#ff8a70')+'" id="dtReqLv">'+
     '需 Lv'+eqReqLv(def)+(eqLvOk(def)?'':'（未达）')+'</span>':'')+
   '</div>':'<div style="font-size:11px;color:#a89058;margin-top:3px">'+(def.ore?'强化材料':def.dan?'稀有道具 · 炼化得技能点':'消耗品')+'</div>')+
   '</div></div><div style="margin-top:8px">'+stats+
   (def.d?'<div style="font-size:11px;color:#8a7a50;margin-top:6px">「'+def.d+'」</div>':'')+'</div>'+
   forgeBtn+
   '<div>'+extra+tradeBtn+'<button class="goldbtn" style="margin:10px 0 0" id="dtClose">关闭</button></div>';
  $('dtIcon').appendChild(itemIcon(def));
  $('dtClose').addEventListener('pointerdown',()=>hideItemDetail());
  const u=$('dtUse');if(u)u.addEventListener('pointerdown',()=>{useInvItem(idx);hideItemDetail();});
  const f=$('dtForge');if(f)f.addEventListener('pointerdown',()=>{
    /* 强化后留在详情页刷新 +N 状态（旧版 hideItemDetail() 会跳回背包，
       玩家视角="一点强化页面就关了"，既看不到最新强化结果也无法连续强化）。
       矿石消耗可能改变背包下标，用对象引用重新定位；装备碎裂则只留背包。 */
    forgeDo(it,()=>{
      openBag();
      const ni=inv.indexOf(it);
      if(ni>=0){hideItemDetail();showItemDetail(def,ni);}
    });
  });
  const sl=$('dtSell');if(sl)sl.addEventListener('pointerdown',()=>{
    /* 出售后保持背包打开：sellInvItem 内部已重开背包刷新列表与金币。
       强化装备也走「出售」流程，确认弹窗写明到手金额，防手滑。 */
    confirmItem('出售',def,it,sellMsg,()=>{sellInvItem(idx);});
  });
  const dp=$('dtDrop');if(dp)dp.addEventListener('pointerdown',()=>{
    confirmItem('丢弃',def,it,'丢弃后物品将永久消失，无法找回',()=>{dropInvItem(idx);});});
}
/* 危险操作二次确认（丢弃/出售）——回调式，onYes 在用户确认后执行 */
function confirmItem(act,def,it,msg,onYes){
  const d=$('itemDetail');showItemDetailBox();
  const nm=itemName(it);
  const nn=(it.pid&&it.n>1)?(' ×'+it.n):'';
  /* 物品仍在背包、且未被穿戴，才允许出售/丢弃 */
  const canDo=!((act==='出售'||act==='丢弃')&&(!inv.includes(it)||eqWornSlot(it)));
  d.innerHTML='<div style="text-align:center;padding:6px 0">'+
   '<div style="font-size:15px;color:#ffca4a;font-weight:900">确认'+act+'？</div>'+
   '<div style="margin:8px 0;font-size:14px">'+nm+nn+'</div>'+
   '<div style="font-size:12px;color:#a89058;line-height:1.7">'+msg+'</div>'+

/* 已穿戴装备的详情（从装备槽点开）。
   与背包物品详情的区别：
     · 没有「装备/使用」（已经在身上了）
     · 有「卸下」
     · **有「强化」** —— 玩家反馈：想强化身上的武器必须先卸下 → 回背包找到它 → 点开强化，
       三步且中途容易找不到（同名装备有强化等级差异时尤其费劲）。
       这里直接复用 forgePanelHtml / forgeDo，强化完原地刷新，不跳走。 */
function showItemDetailOff(def,slot){
  const d=$('itemDetail');showItemDetailBox();
  const cur=equip[slot];
  if(!cur){hideItemDetail();return;}      /* 槽位在打开瞬间被清空（如卸下后重绘）→ 安全退出 */
  const q=qOf(cur);
  let stats='';
  if(def.st)for(const k in def.st){
    const v=Math.floor((def.st[k]||0)*qmul(cur));
    stats+='<div class="row"><span>'+STAT_NAMES[k]+'</span><b>+'+v+'</b></div>';
  }
  /* 强化区：与背包物品详情同一套面板（6 部位全可强化） */
  const forgeBtn=forgePanelHtml(cur,false);
  d.innerHTML='<div style="display:flex;gap:12px;align-items:center"><div id="dtIcon2"></div>'+
   '<div><b class="tq'+def.tier+'" style="font-size:16px">'+eqName(cur)+'</b>'+
   '<div style="font-size:11px;color:#a89058;margin-top:3px">已装备于 <span style="color:#8ad8ff">'+EQ_SLOT_NAME[slot]+'</span> · '+TIER_NAME[def.tier]+'品质'+
   (q!==1?' · <span style="color:'+EQQ[q].color+'">'+EQQ[q].n+'</span>':'')+
   (cur.plus?' · <span style="color:#ffd84a">强化+'+cur.plus+'</span>':'')+
   '</div></div></div>'+
   '<div style="margin-top:8px">'+stats+'</div>'+
   forgeBtn+
   '<div><button class="goldbtn" style="margin:10px 4px 0 0" id="dtOff">卸下</button>'+
   '<button class="goldbtn" style="margin:10px 0 0" id="dtClose2">关闭</button></div>';
  $('dtIcon2').appendChild(itemIcon(def));
  $('dtClose2').addEventListener('pointerdown',()=>hideItemDetail());
  /* 就地强化：强化成功/失败后原地重开本槽位详情，+N 立刻可见，
     且不会像旧版那样跳回背包导致玩家丢失"我正在强化右手戒指"的上下文。 */
  const f=$('dtForge');
  if(f)f.addEventListener('pointerdown',()=>{
    const keepSlot=slot;
    forgeDo(cur,()=>{
      const still=equip[keepSlot]===cur;
      openBag();
      if(still){hideItemDetail();showItemDetailOff(def,keepSlot);}
      else{ /* 装备碎了或槽位被换掉：留在背包，给一声提示 */
        toast('「'+def.n+'」已不在装备栏');
      }
    });
  });
  $('dtOff').addEventListener('pointerdown',()=>{
    if(inv.length>=40){toast('背包已满，无法卸下');return;}
    inv.push(equip[slot]);equip[slot]=null;
    recalcStats();saveGame();hideItemDetail();openBag();
  });
}

/* 小地图：当前地图全貌 + 玩家/宠物/传送阵/精英/BOSS 实时位置 */
function drawMinimap(){
  const cvm=$('minimapCv');if(!cvm)return;
  const cw=320,ch=Math.max(120,Math.round(cw*MAP.Hpx/MAP.Wpx));
  cvm.width=cw;cvm.height=ch;
  const g=cvm.getContext('2d');
  const s=cw/MAP.Wpx;
  g.fillStyle=MAP.def.pal.g;g.fillRect(0,0,cw,ch);
  // 障碍地形
  g.fillStyle='rgba(0,0,0,.3)';
  for(const o of MAP.obs)g.fillRect(o.x*s-1,o.y*s-1,Math.max(2,o.w*s),Math.max(2,o.h*s));
  // 传送阵
  g.strokeStyle='#5ad8ff';g.lineWidth=2;
  g.beginPath();g.arc(MAP.portal.x*s,MAP.portal.y*s,5,0,6.29);g.stroke();
  // NPC（仅村庄）
  if(player.mapId==='village'){g.fillStyle='#5aff8a';
    for(const n of NPCS){g.beginPath();g.arc((MAP.portal.x+n.dx)*s,(MAP.portal.y+n.dy)*s,3,0,6.29);g.fill();}}
  // 怪物：精英紫点 / BOSS 红点脉动
  for(const m of MAP.mobs){
    if(m.dead)continue;
    if(m.d.boss){
      g.fillStyle='#ff3c1c';g.beginPath();
      g.arc(m.x*s,m.y*s,5+Math.sin(ST.time*4)*1.2,0,6.29);g.fill();
      g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';
      g.fillText('BOSS',m.x*s,m.y*s-8);
    }else if(m.d.elite){
      g.fillStyle='#c88aff';g.beginPath();g.arc(m.x*s,m.y*s,3.5,0,6.29);g.fill();
    }
  }
  // 宠物
  if(pet&&!pet.dead){g.fillStyle='#e8e4d8';g.beginPath();g.arc(pet.x*s,pet.y*s,2.5,0,6.29);g.fill();}
  // 玩家：金点 + 呼吸白圈
  g.fillStyle='#ffd84a';g.beginPath();g.arc(player.x*s,player.y*s,4,0,6.29);g.fill();
  g.strokeStyle='#fff';g.lineWidth=1.5;
  g.beginPath();g.arc(player.x*s,player.y*s,5.5+Math.sin(ST.time*5)*1.5,0,6.29);g.stroke();
}
function openMapPanel(){
  let html='<canvas id="minimapCv" style="width:100%;border:1px solid #6a5428;background:#000;border-radius:4px;display:block"></canvas>'+
   '<div style="font-size:11px;color:#a89058;margin:7px 0 12px">'+
   '<span style="color:#ff6a4c">●</span> BOSS　<span style="color:#c88aff">●</span> 精英　'+
   '<span style="color:#ffd84a">●</span> 你　<span style="color:#e8e4d8">●</span> 骷髅　<span style="color:#5ad8ff">○</span> 传送阵</div>'+
   '<div style="font-size:12px;color:#a89058;margin-bottom:10px">点击地图直接传送（需达到推荐等级）</div>';
  for(const m of MAPS){
    const ok=player.level>=m.lv[0]-2;
    html+='<div class="mapItem" data-map="'+m.id+'" style="'+(ok?'':'opacity:.45')+'">'+
     '<div class="mi"><b>'+m.n+'</b><small>推荐等级 '+m.lv[0]+'+'+(m.boss?' · 危险：'+MONSTERS[m.boss].n:'')+'</small></div>'+
     '<button class="goldbtn'+(ok?'':' dis')+'">前往</button></div>';
  }
  openPanel('当前地图 · '+MAP.def.n,html);
  drawMinimap();
  if(_mmTimer)clearInterval(_mmTimer);
  _mmTimer=setInterval(drawMinimap,600);
  $('panelBody').querySelectorAll('[data-map]').forEach(el=>{
    let sx=0,sy=0,moved=false,pid=null;
    el.addEventListener('pointerdown',e=>{
      // 按下立即捕获指针，滚动时不误触发传送
      sx=e.clientX;sy=e.clientY;moved=false;
      pid=e.pointerId;
      try{el.setPointerCapture(pid);}catch(_){}
    });
    el.addEventListener('pointermove',e=>{
      if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)moved=true;
    });
    el.addEventListener('pointerup',e=>{
      try{if(pid!==null)el.releasePointerCapture(pid);}catch(_){}
      if(moved)return; // 滑动过 → 视为滚动，不传送
      const id=el.dataset.map;const m=MAPMAP[id];
      if(!m)return;
      if(player.level<m.lv[0]-2){toast('等级不足，需 '+Math.max(1,m.lv[0]-2)+' 级');return;}
      switchMap(id);closePanel();
    });
    el.addEventListener('pointercancel',()=>{moved=true;});
  });
}

     '<div style="font-size:10px;color:#6a5a38;margin-top:2px">'+(s.empty?'':saveTimeText(s.ts))+'</div></div>'+
     '<div style="display:flex;flex-direction:column;gap:4px">'+
     /* 注意：属性名 data-slotUse 被 HTML 解析器小写化为 data-slotuse，
        所以 dataset 只能写 dataset.slotuse（dataset.slotUse 会取到 undefined）。
        这里保留驼峰写法是为了 CSS 可读性（属性选择器对属性名大小写不敏感）；
        查询时必须用全小写选择器 [data-slotuse="N"]。 */
     (s.empty?'':'<button class="goldbtn" data-slotUse="'+s.slot+'" style="padding:4px 11px;font-size:11px">'+(cur?'重新载入':'载入')+'</button>')+
     (s.empty||cur?'':'<button class="goldbtn" data-slotDel="'+s.slot+'" style="padding:4px 11px;font-size:11px;background:linear-gradient(180deg,#8a2a1a,#5a180e)">删除</button>')+
     '</div></div></div>';
  }
  html+='<div class="skItem" style="border-color:#8a5a20"><b>关于存档</b><p>① 三个槽位互相独立，各自记录角色、装备、生涯统计与离线收益<br>② 游戏每 10 秒自动保存到当前槽位，关闭页面后再次进入可选择继续<br>③ 删除存档不可恢复，请谨慎操作</p></div>';
  return html;
}
function openSlotPanel(back){
  openPanel('存档管理',genSlotPanel(),back);
  /* ★ 这里踩过一个真实 bug：按钮上的属性是 data-slotUse，HTML 解析器会把它
     小写成 data-slotuse，因此 dataset 只能取 .slotuse。原代码写的是
     b.dataset.slot（取不存在的属性）→ 恒为 undefined → parseInt(undefined)
     得 NaN → loadGame(NaN) 内部 "NaN||curSlot" 又回落到当前槽位。
     结果：【点任何槽位都只是重载当前存档，永远切不过去】——这正是玩家反馈
     「角色无法切换其他存档」的真正原因，与入口深浅无关。 */
  $('panelBody').querySelectorAll('[data-slotUse]').forEach(b=>{
    b.addEventListener('pointerdown',()=>{
      const sl=parseInt(b.dataset.slotuse,10);
      if(!(sl>=1&&sl<=SAVE_N)){toast('槽位无效');return;}
      saveGame(curSlot);
      const sv=loadGame(sl);
      if(!sv){toast('该槽位无存档');return;}
      if(sl===curSlot){toast('已在该槽位');closePanel();return;}
      closePanel();
      if(confirm('载入存档槽 #'+sl+' ？当前进度已保存到 #'+curSlot+'。'))startGame(null,sv,sl);
    });
  });
  $('panelBody').querySelectorAll('[data-slotDel]').forEach(b=>{
    b.addEventListener('pointerdown',()=>{
      const sl=parseInt(b.dataset.slotdel,10);
      if(!(sl>=1&&sl<=SAVE_N)){toast('槽位无效');return;}
      if(confirm('确定删除存档槽 #'+sl+' ？（不可恢复）')){delSave(sl);openSlotPanel(back);}
    });
  });
}

function stepVal(p,field,delta,order){

/* v4 起技能按钮不再显示任何数字：读秒（玩家反馈"每秒跳动是视觉噪声"）与
   耗蓝角标（玩家误读成"技能时间"）都已移除。
   红环收缩是唯一的冷却表达，环收完即就绪（另有金边闪烁提示）；
   蓝耗只在技能详情页 / 天赋树显示。 */
/* mask 支持探测：CD 红环用 radial-gradient mask 挖空中心。
   不支持时红环会糊成实心红盘，必须退回暗色扇形（.nomask）。 */
const CD_RING_OK=(function(){
  try{
    if(typeof CSS==='undefined'||!CSS.supports)return false;
    return CSS.supports('-webkit-mask-image','linear-gradient(#000,#000)')||
           CSS.supports('mask-image','linear-gradient(#000,#000)');

})();
/* 每个技能按钮上一帧的 CD 左值：用于检测「跨过 0」这一瞬间，触发就绪闪烁。
   用 [-1] 初始化，保证开局全技能都视为「刚就绪」→ 首帧闪一下，提示可用。 */
const _cdPrev={};
function updateSkillBtns(){
  const grid=$('skillGrid').children;
  const order=CLASSES[player.cls].skills;
  for(let i=0;i<order.length;i++){
    const b=grid[i];if(!b)continue;const key=order[i];const sk=SKILLS[key];
    b.innerHTML='';
    const lock=player.level<sk.unlock;
    b.classList.toggle('lock',lock);
    b.classList.toggle('passive',sk.type==='passive'&&!lock);
    b.classList.toggle('noauto',!lock&&!ST.autoSkill[i]&&sk.type!=='passive');
    if(lock){
      b.innerHTML='<span class="lk">Lv'+sk.unlock+'<br>解锁</span>';
      _cdPrev[key]=-1;
    }else{
      let cdLeft=0;
      if(player.cd&&player.cd[key]>0)cdLeft=player.cd[key];
      const isBuffOn=sk.type==='buff'&&player.buff&&player.buff.t>0;
      b.classList.toggle('buffed',!!isBuffOn);
      const isPassive=sk.type==='passive';
      if(isPassive)_cdPrev[key]=-1;
      /* CD 归一化进度（0=刚进入冷却，1=冷却走完）→ 转成红环弧长角度。
         conic-gradient 的红色区域 = 剩余冷却，从 12 点方向顺时针收缩。
         注意：cd 总长取 SKILLS[key].cd，但被动技 cd=0 需保护除数。 */
      let ang=0,frac=0;
      if(!isPassive&&cdLeft>0&&sk.cd>0){
        frac=clamp(cdLeft/sk.cd,0,1);
        ang=frac*360;
      }
      /* 就绪闪烁：只在 CD 的「有 → 无」跨越边沿触发一次。
         判定条件必须排除首次渲染（_cdPrev 为 undefined）与被动技。
         ★ 历史 bug：下面原有一行无条件 if(cdLeft<=0)remove('ready') 紧跟在
         add 之后执行，触发帧刚加的类立刻被删 → 金边动画永远播不出来。
         现改为「跨 0 帧 add，进 CD 帧（cdLeft>0）清除」两分支互斥。 */
      const pv=_cdPrev[key];
      if(!isPassive&&pv>0&&cdLeft<=0){
        b.classList.remove('ready');
        void b.offsetWidth;          /* 强制重排 → 重放 CSS 动画（连续就绪可重复触发） */
        b.classList.add('ready');
      }else if(cdLeft>0){
        b.classList.remove('ready'); /* 重新进入 CD 时清掉上一次的 ready 残留 */
      }
      _cdPrev[key]=cdLeft;
      /* v5 渲染（最终版）：按钮面只剩三个元素 —— 图标 / CD 红环 / 锁定罩。
         图标恒定金色（不再变灰），自动/手动靠 .noauto 的名字明暗，CD 靠红色描边环。
         读秒数字（v4 取消）与耗蓝角标（v5 取消，易被误读成倒计时）均已移除。 */
      b.innerHTML='<span>'+sk.ico+'</span>'+
       (cdLeft>0?'<div class="cdRing'+(CD_RING_OK?'':' nomask')+'" style="--cdA:'+ang.toFixed(1)+'deg"></div>':'');
    }
  }
}
