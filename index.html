/* ---------------- 装备强化系统（全槽位） ----------------
   ① 武器 / 头盔 / 衣服 / 项链 / 手镯 / 戒指 均可强化
   ② 上限 +12（原 +7）
   ③ 每级主属性 +12% 不变，故 +12 约 +290%，需要提高单级收益的成长感
   ④ 风险：+8 起失败**有概率直接损坏消失**（等级越高越危险），
      +1~+7 仍为「失败仅消耗材料、装备无损」的安全区 */
const PLUS_MAX=12;
/* 安全上限：+1~+7 失败不损坏；+8 起进入危险区 */
const PLUS_SAFE=7;
function forgeRate(plus){
  /* 成功率曲线：+1~4 必成，之后逐级下降，+11→+12 仅 18% */
  const t=[1,1,1,1,.86,.72,.6,.46,.36,.28,.22,.18];
  return t[clamp(plus,0,PLUS_MAX-1)];
}
/* 损坏概率（仅在 +8 起的失败分支生效）：失败后装备直接消失的概率
   参数 plus 为「当前强化等级」，即本次要升到 plus+1 级。
   需求：「超过 7 级有概率导致装备损坏消失」→ +7→+8 属安全区，故 plus<=PLUS_SAFE 时返回 0。
   真正的危险从 +8→+9 开始（plus=8 → 14%），每级 +5%，+11→+12 时 29%，上限 50% */
function forgeBreakRate(plus){
  if(plus<=PLUS_SAFE)return 0;
  return Math.min(.5,.14+(plus-PLUS_SAFE-1)*.05);
}
/* 强化成本：矿石线性、金币按档跃升。
   +1~+7 为安全养成区（累计约 40 矿石 / 4.6 万金币）
   +8~+12 为豪赌区，金币陡增，配合"控制金币消耗"的设计目标 */
function forgeCost(plus){
  const g=[260,520,980,1700,2800,4600,7200,12000,19000,30000,46000,68000][clamp(plus,0,PLUS_MAX-1)];
  return{ore:plus+1,gold:g};
}
function plusMul(e){return Math.pow(1.12,e.plus||0);}
/* 装备光芒颜色（任意部位）：神兵(赤月级)职业色 > 强化+10 强金光 > +7 暖光 > +4 微光 > 小极品金光 */
function weaponGlowColor(e){
  if(!e)return null;
  const d=EQMAP[e.id];if(!d)return null;
  if(d.tier===4&&d.slot==='weapon')return CLASSES[player.cls].color;
  if((e.plus||0)>=10)return '#ffd84a';
  if((e.plus||0)>=7)return '#ffb050';
  if((e.plus||0)>=4)return '#e8b060';
  if(qOf(e)===2)return EQQ[2].color;
  return null;
}
function countOre(){let n=0;for(const i of inv)if(i.pid&&i.id==='ore')n+=i.n;return n;}
function takeOre(n){
  for(let i=inv.length-1;i>=0&&n>0;i--){const it=inv[i];
    if(it.pid&&it.id==='ore'){const take=Math.min(n,it.n);it.n-=take;n-=take;
      if(it.n<=0)inv.splice(i,1);}}
}

/* 槽位中文名（提示文案用） */
const SLOT_CN={weapon:'武器',helmet:'头盔',armor:'衣服',necklace:'项链',bracelet:'手镯',ring:'戒指'};
/* 强化任意装备实例（背包内或身上已装备，六个部位通吃） */
function forgeDo(w,after){
  const e=EQMAP[w.id];
  if(!e||!e.slot){toast('只有装备可以强化');return;}
  const cur=w.plus||0;
  if(cur>=PLUS_MAX){toast('已达到强化上限 +'+PLUS_MAX);return;}
  const cost=forgeCost(cur);
  if(countOre()<cost.ore){toast('黑铁矿石不足（需要 '+cost.ore+' 个，现有 '+countOre()+' 个）');return;}
  if(ST.gold<cost.gold){toast('金币不足（需要 '+cost.gold+'）');return;}
  takeOre(cost.ore);ST.gold-=cost.gold;
  ST.stat.goldSpend=(ST.stat.goldSpend||0)+cost.gold;
  ST.stat.craft=(ST.stat.craft||0)+1;
  const nm=eqName(w);
  if(Math.random()<forgeRate(cur)){
    w.plus=cur+1;ST.stat.craftOK=(ST.stat.craftOK||0)+1;
    ST.maxPlus=Math.max(ST.maxPlus||0,w.plus);
    const onBody=Object.values(equip).includes(w);
    if(onBody)recalcStats();
    SFX.lvl();
    banner('✦ 强化成功 ✦',nm+'（主属性 +'+Math.round((Math.pow(1.12,w.plus)-1)*100)+'%）');
    addLog('⚒ '+nm+' 强化成功，当前 +'+w.plus);
    checkAchv();
  }else{
    /* 失败分支：+8 起有概率直接损坏消失 */
    const onBody=Object.values(equip).includes(w);
    if(cur>PLUS_SAFE&&Math.random()<forgeBreakRate(cur)){
      ST.stat.craftBreak=(ST.stat.craftBreak||0)+1;
      SFX.die();
      const i=inv.indexOf(w);if(i>=0)inv.splice(i,1);
      if(onBody){for(const k in equip)if(equip[k]===w)equip[k]=null;recalcStats();}
      banner('✖ 装备已碎裂 ✖',nm+' 在 +'+(cur+1)+' 强化中化为齑粉');
      addLog('⚒ '+nm+' 强化 +'+(cur+1)+' 失败，装备永久损坏消失了…');
      toast('强化失败，装备已损坏');
    }else{
      SFX.die();
      toast(cur>PLUS_SAFE?'⚒ 强化失败…材料已消耗（装备侥幸保住）':'⚒ 强化失败…材料已消耗（装备无损）');
      addLog('⚒ '+nm+' 强化 +'+(cur+1)+' 失败，黑铁矿石碎裂了');
    }
  }
  if(after)after();
}

/* 自动拾取配置兜底：旧存档 autoPick 没有 eqT/dan 字段，这里补齐
   eqT = 按品质档（1普通/2沃玛/3祖玛/4赤月）勾选是否自动拾取该档装备 */
function ensureAutoPickCfg(){
  if(!ST.autoPick)ST.autoPick={gold:true,pot:true,eq:true,eqT:{1:true,2:true,3:true,4:true},dan:true};
  const p=ST.autoPick;
  if(!p.eqT||typeof p.eqT!=='object')p.eqT={1:true,2:true,3:true,4:true};
  for(const k of[1,2,3,4])if(p.eqT[k]===undefined)p.eqT[k]=true;
  if(p.dan===undefined)p.dan=true;
  return p;
}
/* 自动出售配置（背包满触发）：
   t = 参与出售的颜色档（tier1白/2蓝/3紫/4金，默认只勾白，兼容旧存档行为）
   oc = 是否同时出售「非本职业专属」装备（通用 all 装备不算非本职业）
   恒定保护：强化过的、身上穿的不卖；药水/矿石不参与 */
function ensureAutoSellCfg(){
  if(!ST.autoSellCfg)ST.autoSellCfg={t:{1:true,2:false,3:false,4:false},oc:false};
  const t=ST.autoSellCfg.t;
  for(const k of[1,2,3,4])if(t[k]===undefined)t[k]=(k===1);
  if(ST.autoSellCfg.oc===undefined)ST.autoSellCfg.oc=false;
  return ST.autoSellCfg;
}
/* 背包满时自动出售：按颜色档与非本职业配置清理无强化装备，返回是否成功腾出空间 */
function autoSellWhite(){
  const cfg=ensureAutoSellCfg();
  let total=0,cnt=0;
  for(let i=inv.length-1;i>=0;i--){const it=inv[i];
    if(it.pid)continue;                      // 药水/矿石不自动卖
    const e=EQMAP[it.id];if(!e)continue;
    /* 出售条件：颜色档勾选 中 或 非本职业专属且开启 oc */
    const want=cfg.t[e.tier]||(cfg.oc&&e.cls!==player.cls&&e.cls!=='all');
    if(!want)continue;
    if((it.plus||0)>0)continue;              // 强化过的不卖
    const worn=Object.values(equip).includes(it);
    if(worn)continue;                         // 身上穿的不卖
    total+=eqPrice(it);cnt++;
    inv.splice(i,1);
    if(inv.length<=38)break;                  // 腾出足够空间即可
  }
  if(!cnt)return false;
  ST.gold+=total;ST.stat.goldEarn=(ST.stat.goldEarn||0)+total;
  addText(player.x,player.y-60,'自动出售 +'+total+'G','#ffd84a',13);
  SFX.gold();
  return true;
}
function sellInvItem(idx){
  const it=inv[idx];if(!it)return false;
  /* 不可出售：已强化过的装备、Boss 内丹（noSell）、黑铁矿石（强化材料）
     详情面板已屏蔽按钮，此处再兜一层，防止直接调用绕过 */
  if((it.plus||0)>0){toast('已强化的装备不可出售');return false;}
  if(it.pid){
    const p=POTMAP[it.id];
    if(p&&(p.noSell||p.dan)){toast('该道具珍贵，不可出售');return false;}
    if(p&&p.ore){toast('强化材料不可出售');return false;}
  }
  let price;
  if(it.pid){const p=POTMAP[it.id];price=Math.floor((p?p.price:90)*.3);}
  else{price=eqPrice(it);}
  ST.gold+=price;ST.stat.goldEarn=(ST.stat.goldEarn||0)+price;inv.splice(idx,1);
  addLog('出售 『'+itemName(it)+'』 获得 '+price+' 金币');
  SFX.gold();openBag();
  return true;
}
/* 一键出售弹窗：自选品质档与药水 */
const sellSel={w:true,b:true,p:false,pot:false,g:false};
function showSellDialog(){
  const d=$('itemDetail');showItemDetailBox();
  function calc(){
    let total=0,cnt=0;
    for(const it of inv){
      if(it.pid){if(sellSel.pot&&!POTMAP[it.id].ore){total+=Math.floor(POTMAP[it.id].price*.3);cnt++;}continue;}
      const e=EQMAP[it.id];if(!e)continue;
      if(e.tier===1&&sellSel.w){total+=eqPrice(it);cnt++;}
      else if(e.tier===2&&sellSel.b){total+=eqPrice(it);cnt++;}
      else if(e.tier===3&&sellSel.p){total+=eqPrice(it);cnt++;}
      else if(e.tier===4&&sellSel.g){total+=eqPrice(it);cnt++;}
    }
    return{total,cnt};
  }
  function render(){
    const {total,cnt}=calc();
    const mk=(key,label,desc,color)=>'<div class="row" data-sellkey="'+key+'" style="cursor:pointer;padding:7px 0"><span>'+label+' <small style="color:#8a7a50">'+desc+'</small></span><b style="color:'+(sellSel[key]?'#5aff8a':'#5a4a28')+'">'+(sellSel[key]?'☑':'☐')+'</b></div>';
    d.innerHTML='<b style="font-size:16px;color:#ffd870">一键出售</b>'+
     '<div style="margin-top:8px">'+
     mk('w','白色装备','普通',0)+mk('b','蓝色装备','沃玛级',0)+mk('p','紫色装备','祖玛级',0)+
     mk('g','金色装备','赤月级（慎选）',0)+mk('pot','药水','按30%回收（不含矿石）',0)+
     '</div>'+
     '<div class="row"><span>预计出售 <b id="sellCnt">'+cnt+'</b> 件</span><b style="color:#ffd84a">得 '+total+' 金币</b></div>'+
     '<div><button class="goldbtn" style="margin:10px 4px 0 0;background:linear-gradient(180deg,#8a2a1a,#5a180e)" id="sellGo">确认出售</button>'+
     '<button class="goldbtn" style="margin:10px 0 0" id="sellCancel">取消</button></div>';
    d.querySelectorAll('[data-sellkey]').forEach(row=>{
      row.addEventListener('pointerdown',()=>{sellSel[row.dataset.sellkey]=!sellSel[row.dataset.sellkey];render();});
    });
    $('sellGo').addEventListener('pointerdown',()=>{
      let total=0,cnt=0;
      const keep=[];
      for(const it of inv){
        let sell=false;
        if(it.pid)sell=sellSel.pot&&!POTMAP[it.id].ore; // 矿石是强化材料，不参与一键出售
        else{const e=EQMAP[it.id];
          if(!e){continue;}
          if(e.tier===1)sell=sellSel.w;else if(e.tier===2)sell=sellSel.b;
          else if(e.tier===3)sell=sellSel.p;else if(e.tier===4)sell=sellSel.g;}
        if(sell){total+=it.pid?Math.floor(POTMAP[it.id].price*.3):eqPrice(it);cnt++;}
        else keep.push(it);
      }
      if(!cnt){toast('未勾选任何可出售物品');return;}
      inv.length=0;keep.forEach(i=>inv.push(i));
      ST.gold+=total;
      hideItemDetail();
      banner('一键出售完成','出售 '+cnt+' 件 · 获得 '+total+' 金币');
      SFX.gold();updateQuestBtn();openBag();
    });
    $('sellCancel').addEventListener('pointerdown',()=>hideItemDetail());
  }
  render();
}
/* ---------------- 任务系统 ---------------- */
function maxEquipTier(){
  let mx=0;
  for(const k in equip){const e=equip[k];if(e&&EQMAP[e.id])mx=Math.max(mx,EQMAP[e.id].tier);}
  return mx;
}
function countOwnTier(t){
  let c=0;
  for(const it of inv){if(!it.pid&&EQMAP[it.id]&&EQMAP[it.id].tier>=t)c++;}
  for(const k in equip){const e=equip[k];if(e&&EQMAP[e.id]&&EQMAP[e.id].tier>=t)c++;}
  return c;
}
function questProgress(q){
  if(q.type==='kill'){let c=0;for(const id of q.t)c+=(ST.qKills[id]||0);return c;}
  if(q.type==='level')return player.level;
  if(q.type==='equip')return maxEquipTier()>=q.t?1:0;
  if(q.type==='own')return countOwnTier(q.t);
  return 0;
}
function questRewardText(q){
  const parts=[];
  if(q.rw.gold)parts.push(q.rw.gold+' 金币');
  if(q.rw.exp)parts.push(q.rw.exp+' 经验');
  if(q.rw.items)q.rw.items.forEach(it=>parts.push((POTMAP[it.id]?POTMAP[it.id].n:EQMAP[it.id].n)+'×'+it.n));
  if(q.rw.loot)parts.push(TIER_NAME[q.rw.loot]+'级装备×1');
  return parts.join(' + ');
}
function giveQuestReward(q){
  if(q.rw.gold){ST.gold=clampGold((ST.gold||0)+q.rw.gold);ST.stat.goldEarn=(ST.stat.goldEarn||0)+q.rw.gold;}
  if(q.rw.exp)gainExp(q.rw.exp);
  /* 任务奖励满包时折算金币，不再静默丢失 */
  if(q.rw.items)addOrConvertAll(q.rw.items.map(it=>({id:it.id,pid:it.pid,n:it.n||1})),{silent:false});
  if(q.rw.loot){
    const pool=EQUIPS.filter(e=>e.tier===q.rw.loot&&(e.cls==='all'||CLS_FULL[e.cls]===player.cls));
    const eq=pool.length?pick(pool):EQMAP.wood_sword;
    const inst={id:eq.id,q:rollEqQ()};
    const r=addOrConvert(inst,{silent:true});
    if(r.ok)addLog('额外奖励 『'+eqName(inst)+'』');
    else if(r.conv>0)addLog('背包已满，奖励折算为 '+r.conv+' 金币');
  }
}
function questNotifyCheck(){
  let newly=false;
  for(const q of QUESTS){
    if(ST.qClaimed.includes(q.id))continue;
    if(!ST.qMemo[q.id]&&questProgress(q)>=q.n){
      ST.qMemo[q.id]=1;newly=true;
      banner('任务完成：'+q.n,'打开任务面板领取奖励');
    }
  }
  if(newly)updateQuestBtn();
}
function openQuests(){
  let html='<div style="font-size:12px;color:#a89058;margin-bottom:10px">完成任务即可领取奖励，杀怪、升级、集装备都会自动计数</div>';
  let canClaim=0;
  for(const q of QUESTS){
    const claimed=ST.qClaimed.includes(q.id);
    const done=questProgress(q)>=q.n;
    if(done&&!claimed)canClaim++;
    const prog=claimed?q.n+'/'+q.n:Math.min(questProgress(q),q.n)+'/'+q.n;
    html+='<div class="skItem'+(claimed?' lockd':'')+'" style="border-color:'+(done&&!claimed?'#ffca4a':'#5a4a28')+'">'+
     '<b>'+q.n+'</b> <span style="font-size:11px;color:'+(done&&!claimed?'#ffd870':'#a89058')+'">'+
     (claimed?'✓ 已完成':(done?'可领取！':prog))+'</span>'+
     '<p>'+q.d+' <span style="color:#8ad8ff">('+prog+')</span></p>'+
     '<p style="color:#ffd84a;font-size:11px">奖励：'+questRewardText(q)+'</p>'+
     (done&&!claimed?'<button class="goldbtn" style="margin-top:6px" data-claim="'+q.id+'">领取奖励</button>':'')+
     '</div>';
  }
  openPanel('任务',html);
  $('panelBody').querySelectorAll('[data-claim]').forEach(b=>{
    b.addEventListener('pointerdown',()=>claimQuest(b.dataset.claim));
  });
  updateQuestBtn();
}
function claimQuest(qid){
  const q=QUESTS.find(x=>x.id===qid);
  if(!q||ST.qClaimed.includes(qid)||questProgress(q)<q.n)return;
  ST.qClaimed.push(qid);
  giveQuestReward(q);
  banner('领取成功：'+q.n,questRewardText(q));
  SFX.lvl();
  addLog('完成任务「'+q.n+'」');
  openQuests();
  saveGame();
}
function updateQuestBtn(){
  let canClaim=0;
  for(const q of QUESTS){
    if(!ST.qClaimed.includes(q.id)&&questProgress(q)>=q.n)canClaim++;
  }
  const dot=$('questDot');
  if(dot)dot.style.display=canClaim>0?'block':'none';
}
function buyPotion(pid,count){
  const p=POTMAP[pid];const cost=p.price*count;
  if(ST.gold<cost){toast('金币不足');return;}
  let slot=inv.find(i=>i.id===pid&&i.pid);
  if(!slot){
    if(inv.length>=40){toast('背包已满');return;}
    slot={id:pid,pid:1,n:0};inv.push(slot);
  }
  ST.gold-=cost;ST.stat.goldSpend=(ST.stat.goldSpend||0)+cost;
  ST.stat.pots=(ST.stat.pots||0)+count;
  slot.n+=count;
  SFX.gold();openShop();
}

const joy={active:false,dx:0,dy:0,bx:0,by:0,id:null};
const cv=$('cv');
function initInput(){
  const opt={passive:false};
  cv.addEventListener('touchstart',e=>{e.preventDefault();
    /* 物品详情打开时（遮罩未拦住的部分），触摸只用于关闭面板，不驱动摇杆 */
    if(isItemDetailOpen()){hideItemDetail();return;}
    SFX.init();
    for(const t of e.changedTouches){
      // 先判断是否点中 NPC
      const npc=hitNpcAt(t.clientX,t.clientY);
      if(npc){
        if(Math.hypot(player.x-(MAP.portal.x+npc.dx),player.y-(MAP.portal.y+npc.dy))<150){
          SFX.click();npc.act==='shop'?openShop():openMapPanel();
        }else toast('走近'+npc.n+'才能交易');
        return;
      }
      if(!joy.active){
        joy.active=true;joy.id=t.identifier;
        joy.bx=t.clientX;joy.by=t.clientY;joy.dx=0;joy.dy=0;
        const j=$('joy');j.style.display='block';
        j.style.left=(t.clientX-55)+'px';j.style.top=(t.clientY-55)+'px';
      }
    }
  },opt);
  cv.addEventListener('touchmove',e=>{e.preventDefault();
    for(const t of e.changedTouches){
      if(joy.active&&t.identifier===joy.id){
        let dx=t.clientX-joy.bx,dy=t.clientY-joy.by;
        const l=Math.hypot(dx,dy),max=48;
        if(l>max){dx=dx/l*max;dy=dy/l*max;}
        joy.dx=dx/max;joy.dy=dy/max;
        $('joyKnob').style.left=(29+dx)+'px';$('joyKnob').style.top=(29+dy)+'px';
      }
    }
  },opt);
  const endT=e=>{e.preventDefault();
    for(const t of e.changedTouches){
      if(joy.active&&t.identifier===joy.id){
        joy.active=false;joy.dx=0;joy.dy=0;$('joy').style.display='none';
        $('joyKnob').style.left='29px';$('joyKnob').style.top='29px';
      }
    }};
  cv.addEventListener('touchend',endT,opt);cv.addEventListener('touchcancel',endT,opt);
  // 鼠标（桌面试玩）
  let mDown=false;
  cv.addEventListener('mousedown',e=>{
    if(isItemDetailOpen()){hideItemDetail();return;}
    SFX.init();
    const npc=hitNpcAt(e.clientX,e.clientY);
    if(npc){
      if(Math.hypot(player.x-(MAP.portal.x+npc.dx),player.y-(MAP.portal.y+npc.dy))<150){
        SFX.click();npc.act==='shop'?openShop():openMapPanel();
      }else toast('走近'+npc.n+'才能交易');
      return;
    }
    mDown=true;joy.active=true;joy.id='m';
    joy.bx=e.clientX;joy.by=e.clientY;
    const j=$('joy');j.style.display='block';j.style.left=(e.clientX-55)+'px';j.style.top=(e.clientY-55)+'px';});
  window.addEventListener('mousemove',e=>{if(mDown&&joy.active){
    let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;const l=Math.hypot(dx,dy),max=48;
    if(l>max){dx=dx/l*max;dy=dy/l*max;}
    joy.dx=dx/max;joy.dy=dy/max;
    $('joyKnob').style.left=(29+dx)+'px';$('joyKnob').style.top=(29+dy)+'px';}});
  window.addEventListener('mouseup',()=>{if(mDown){mDown=false;
    if(joy.id==='m'){joy.active=false;joy.dx=0;joy.dy=0;$('joy').style.display='none';}}});
  // 防双指缩放
  document.addEventListener('gesturestart',e=>e.preventDefault());
}

function initUI(){
  // 技能按钮
  const grid=$('skillGrid');grid.innerHTML='';
  const nSk=CLASSES[player.cls].skills.length;
  for(let i=0;i<nSk;i++){
    const b=document.createElement('div');b.className='skillBtn';b.dataset.idx=i;
    let lpT=null,lp=false;
    b.addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();
      lp=false;clearTimeout(lpT);
      lpT=setTimeout(()=>{ // 长按 550ms 切换自动释放
        lp=true;
        if(SKILLS[CLASSES[player.cls].skills[i]].type==='passive'){toast('被动技能无需设置');return;}
        ST.autoSkill[i]=!ST.autoSkill[i];
        updateSkillBtns();
        toast(SKILLS[CLASSES[player.cls].skills[i]].name+'：'+(ST.autoSkill[i]?'已加入自动释放':'改为手动释放'));
        SFX.click();
      },550);
    });
    b.addEventListener('pointerup',e=>{e.preventDefault();clearTimeout(lpT);
      if(!lp)castSkill(i);});
    b.addEventListener('pointerleave',()=>clearTimeout(lpT));
    b.addEventListener('pointercancel',()=>clearTimeout(lpT));
    grid.appendChild(b);
  }
  $('autoBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();
    ST.auto=!ST.auto;updateAutoBtn();
    toast(ST.auto?'自动挂机已开启':'自动挂机已关闭');if(ST.auto)acquireTarget();});
  $('cfgBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();SFX.click();openSkillConfig();});
  $('plFrame').addEventListener('pointerdown',e=>{e.preventDefault();openChar();});
  /* 「角色」按钮已并入左上角头像（点头像即打开角色面板），原 btnChar 移除 */
  $('btnBag').addEventListener('pointerdown',e=>{e.preventDefault();openBag();});
  $('btnMap').addEventListener('pointerdown',e=>{e.preventDefault();openMapPanel();});
  $('btnSet').addEventListener('pointerdown',e=>{e.preventDefault();openSettings();});
  $('btnHome').addEventListener('pointerdown',e=>{e.preventDefault();
    if(player.mapId==='village'){toast('已经在村里啦');return;}
    switchMap('village');toast('已回到玛法村');});
  $('btnShop').addEventListener('pointerdown',e=>{e.preventDefault();openShop();});
  $('btnQuest').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();openQuests();});
  $('btnAchv').addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();openAchvPanel();});
  $('npcBtn').addEventListener('pointerdown',e=>{e.preventDefault();
    if(_npcShown){SFX.click();_npcShown.act==='shop'?openShop():openMapPanel();}});
  $('guide').addEventListener('pointerdown',e=>{e.preventDefault();openQuests();});
  $('panelClose').addEventListener('pointerdown',e=>{
    e.preventDefault();
    /* 子面板 → 返回上一层面板（如设置）；顶层 → 关闭 */
    if(_panelBack){SFX.click();const f=_panelBack;f();}
    else closePanel();
  });
  /* 点详情卡之外的任意位置（红白区域）→ 关闭物品详情 */
  const dtb=$('dtBack');
  if(dtb)dtb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();hideItemDetail();});
  $('panel').addEventListener('pointerdown',e=>{if(e.target===$('panel'))closePanel();});
  window.addEventListener('resize',resizeCanvas);
  /* ---- 关页/切后台保存三保险 ----
     手机端最难保住进度的是"上滑杀进程 / 直接关闭标签"这两种情况：
     · visibilitychange 只在切后台/锁屏时触发，杀进程时不一定来得及
     · pagehide 在 iOS Safari 与多数安卓浏览器上更可靠
     · beforeunload 覆盖桌面端关闭标签
     三个都挂上，配合 3 秒自动存档，把丢失窗口压到最小 */
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
  window.addEventListener('pagehide',()=>{saveGame();});
  window.addEventListener('beforeunload',()=>{saveGame();});
}
/* 面板返回链：从设置等父面板打开子页面时记录返回函数，
   点 ✕ 优先"返回上一层面板"，栈空才真正关闭面板 */
let _panelBack=null;
function openPanel(title,html,back){
  _panelBack=(typeof back==='function')?back:null;
  $('panelTitle').textContent=title;$('panelBody').innerHTML=html;
  $('panel').classList.remove('hidden');
}
const _iconURL={},_iconImg={};
function iconURL(def){
  if(_iconURL[def.id])return _iconURL[def.id];
  const c=document.createElement('canvas');c.width=40;c.height=40;
  const g=c.getContext('2d');
  if(def.slot){
    const col=TIER_COLOR[def.tier];
    g.fillStyle='#241a0c';g.fillRect(0,0,40,40);
    g.strokeStyle=col;g.lineWidth=2;g.strokeRect(3,3,34,34);
    g.fillStyle=col;
    if(def.slot==='weapon'){g.beginPath();g.moveTo(20,6);g.lineTo(26,20);g.lineTo(20,34);g.lineTo(14,20);g.closePath();g.fill();}
    else if(def.slot==='armor'){g.beginPath();g.moveTo(8,10);g.lineTo(32,10);g.lineTo(28,32);g.lineTo(12,32);g.closePath();g.fill();}
    else if(def.slot==='helmet'){g.beginPath();g.arc(20,18,11,3.14,0);g.fill();g.fillRect(9,18,22,5);}
    else{g.beginPath();g.arc(20,20,9,0,6.29);g.fill();
      g.fillStyle='#241a0c';g.beginPath();g.arc(20,20,5,0,6.29);g.fill();}
  }else if(def.dan){
    // Boss 内丹：暗紫丹丸 + 金色纹路 + 高光，与药水（蓝/红十字瓶）明显区分
    const grd=g.createRadialGradient(16,16,2,20,20,15);
    grd.addColorStop(0,'#f0d0ff');grd.addColorStop(.35,'#a24bd8');
    grd.addColorStop(.75,'#5e1f8a');grd.addColorStop(1,'#2a0a40');
    g.fillStyle=grd;g.beginPath();g.arc(20,21,13,0,6.29);g.fill();
    g.strokeStyle='#ffd84a';g.lineWidth=1.6;g.beginPath();g.arc(20,21,13,0,6.29);g.stroke();
    // 金色太极/纹路简笔
    g.strokeStyle='#ffe9a0';g.lineWidth=1.4;
    g.beginPath();g.arc(20,21,8,-Math.PI/2,Math.PI/2,false);g.stroke();
    g.beginPath();g.arc(20,21,8,Math.PI/2,Math.PI*1.5,false);g.stroke();
    g.fillStyle='#ffe9a0';g.beginPath();g.arc(20,15.5,2.1,0,6.29);g.fill();
    g.fillStyle='#5e1f8a';g.beginPath();g.arc(20,26.5,2.1,0,6.29);g.fill();
    // 顶部高光
    g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(14.5,14,2.6,0,6.29);g.fill();
  }else{
    // 药水
    g.fillStyle=def.heal?'#c03028':'#2848a8';
    g.fillRect(15,12,10,22);g.fillRect(17,7,6,6);
    g.fillStyle='#ffe9b0';g.fillRect(16,16,8,4);
  }
  _iconURL[def.id]=c.toDataURL();
  return _iconURL[def.id];
}
function itemIcon(def){
  // 返回 img 元素（可安全 append 到多处，不影响其他位置显示）
  const im=document.createElement('img');
  im.src=iconURL(def);
  return im;
}
function itemIconImg(def){
  // 供 canvas drawImage 使用（缓存 Image 对象）
  if(!_iconImg[def.id]){_iconImg[def.id]=new Image();_iconImg[def.id].src=iconURL(def);}
  return _iconImg[def.id];
}

/* 属性权重：折算成"战力分"用于优劣总评。
   攻击类权重最高（直接决定清怪速度），防御类次之，HP/MP 按比例给分。 */
const CMP_W={atk:2.0,matk:2.0,def:1.2,mdef:1.0,hp:.15,mp:.10};
function statCompareRows(def,q,plus){
  // 与当前已穿戴同部位装备对比（计入品质与强化系数）
  const cur=equip[def.slot];
  const curDef=cur?EQMAP[cur.id]:null;
  const myMul=qmul({q})*(def.slot==='weapon'?Math.pow(1.12,plus||0):1);
  const keys=['atk','matk','def','mdef','hp','mp'];
  let rows='',score=0,nUp=0,nDown=0,nSame=0;
  for(const k of keys){
    const nv=(def.st&&def.st[k]||0)*myMul;
    const cv=curDef?(curDef.st[k]||0)*qmul(cur)*(curDef.slot==='weapon'?plusMul(cur):1):0;
    if(!nv&&!cv)continue;
    const delta=Math.floor(nv)-Math.floor(cv);
    if(curDef){
      if(delta>0)nUp++;else if(delta<0)nDown++;else nSame++;
      score+=delta*(CMP_W[k]||0);
    }
    const dTxt=curDef?(delta>=0?' <span class="up">▲+'+delta+'</span>':' <span class="down">▼'+delta+'</span>'):'';
    rows+='<div class="row"><span>'+STAT_NAMES[k]+'</span><b>+'+Math.floor(nv)+dTxt+'</b></div>';
  }
  if(curDef){
    /* 优劣总评：加权总分 + 属性条目数共同决定结论 */
    const sc=Math.round(score);
    const mean=Math.floor(score/Math.max(1,nUp+nDown+nSame));
    let tone,icon;
    if(sc>=0&&mean>=0){tone='up';icon='▲';}
    else if(sc<0&&mean<0){tone='down';icon='▼';}
    else {tone=(sc>=0?'up':'down');icon=(sc>=0?'▲':'▼');}
    let verdict;
    const abs=Math.abs(sc);
    if(nUp>0&&nDown===0&&abs>0)      verdict='全面强于当前装备';
    else if(nDown>0&&nUp===0&&abs>0) verdict='全面弱于当前装备';
    else if(abs===0)                 verdict='与当前装备基本持平';
    else if(abs<8)                   verdict='与当前装备差异不大';
    else                             verdict=(sc>0?'综合强于当前装备':'综合弱于当前装备');
    const sameTxt=nSame?('（'+nSame+' 项持平）'):'';
    const flat=(abs===0);            // 完全持平用中性灰样式，不标 ▲/▼
    const bg=flat?'rgba(120,120,120,.14)':(tone==='up'?'rgba(80,160,80,.16)':'rgba(170,60,60,.16)');
    const bd=flat?'#5a5a52':(tone==='up'?'#3f6b3f':'#7a3a3a');
    const cl=flat?'#c8c0a8':(tone==='up'?'up':'down');
    rows+='<div style="margin-top:8px;padding:6px 8px;border-radius:6px;background:'+bg+
      ';border:1px solid '+bd+'">'+
      '综合评估：<b class="'+cl+'">'+(flat?'◆':'')+' '+verdict+'</b>'+
      '<span style="color:#a89058">（战力分 '+(flat?'±':icon)+(flat?'0':((sc>=0?'+':'')+sc))+
      ' · 提升 '+nUp+' 项 / 下降 '+nDown+' 项'+sameTxt+'）</span></div>';
    rows+='<div style="font-size:11px;color:#8a7a50;margin-top:6px">当前已装备：'+eqName(cur)+'（对比已计入品质'+(cur.plus?'与强化':'')+'）</div>';
  }
  return rows;
}
function showItemDetail(def,idx){
  const d=$('itemDetail');showItemDetailBox();
  const it=idx>=0?inv[idx]:null;
  /* 品质越界保护：正常掉落只会产生 0/1/2，但损坏的存档可能带出非法值，
     直接索引 EQQ[q] 会令整个详情面板崩溃 */
  const q=it&&!it.pid?Math.max(0,Math.min(EQQ.length-1,(it.q|0)||1)):1;
  const plus=it&&!it.pid?(it.plus||0):0;
  let stats='';
  if(def.pid){
    if(def.heal)stats+='<div class="row"><span>恢复生命</span><b>'+def.heal+'</b></div>';
    if(def.mana)stats+='<div class="row"><span>恢复魔法</span><b>'+def.mana+'</b></div>';
    if(def.dan)stats+='<div style="font-size:12px;color:#c88aff;margin-top:4px">✦ 炼化后永久获得 <b>1 点技能点</b>（可直接投入天赋树）</div>'+
      '<div style="font-size:11px;color:#8a7a50;margin-top:3px">当前技能点余额：<b style="color:#7ab0ff">'+(ST.skillPt||0)+'</b> 点</div>';
    if(def.ore)stats+='<div style="font-size:11px;color:#8a7a50;margin-top:4px">背包存量：'+countOre()+' 个（击败怪物有几率掉落）</div>';
  }else if(def.slot){
    stats=statCompareRows(def,q,plus);
  }
  let extra='';
  /* 强化区：六个部位全部可强化（仅背包内装备） */
  let forgeBtn='';
  if(def.slot&&it&&!it.pid)forgeBtn=forgePanelHtml(it,false);
  if(def.slot){
    const cur=equip[def.slot];
    // 同 id 且品质/强化等级完全一致才算"已装备"，否则允许更换（如普通→小极品同名装备）
    const same=cur&&cur.id===def.id&&qOf(cur)===q&&(cur.plus||0)===plus;
    if(!same)extra='<button class="goldbtn" style="margin:10px 4px 0 0" id="dtUse">'+(cur?'更换':'装备')+'</button>';
  }
  /* 道具（有实际效果的）显示「使用」按钮：药水 / Boss 内丹 */
  if(it&&it.pid&&(def.heal||def.mana||def.dan))
    extra='<button class="goldbtn" style="margin:10px 4px 0 0;border-color:#c88aff;color:#e8d0ff" id="dtUse">'+
      (def.dan?'✦ 炼化内丹（技能点 +1）':'使用')+'</button>';
  /* 出售 / 丢弃（仅背包内物品，非已穿戴）。
     注意：sp/sellMsg 必须声明在函数级——下方出售按钮的回调会引用，
     若在 if 块内 const 声明，回调执行时会 ReferenceError: sp is not defined */
  let tradeBtn='',sellMsg='';
  if(it&&idx>=0){
    /* 不可出售：已强化过的装备（任何部位）、以及标记 noSell 的道具（Boss 内丹） */
    const isDan=it.pid&&POTMAP[it.id]&&POTMAP[it.id].dan;
    const isOre=it.pid&&POTMAP[it.id]&&POTMAP[it.id].ore;
    const canSell=!(plus>0)&&!isDan&&!isOre;
    const sp=it.pid?Math.floor((POTMAP[it.id]?POTMAP[it.id].price:90)*.3):eqPrice(it);
    if(canSell)sellMsg='出售可获得 '+sp+' 金币';
    const sellTxt=canSell?('出售 '+sp+'G'):(isDan?'珍贵·不可售':isOre?'强化材料·不可售':'已强化·不可售');
    tradeBtn='<button class="goldbtn" style="margin:10px 4px 0 0;'+(canSell?'':'opacity:.4')+'" id="dtSell"'+(canSell?'':' disabled')+'>'+
      sellTxt+'</button>'+
      '<button class="goldbtn" style="margin:10px 4px 0 0;background:#4a1e1e;border-color:#8a3a3a;color:#ffb0a0" id="dtDrop">丢弃</button>';
  }
  d.innerHTML='<div style="display:flex;gap:12px;align-items:center"><div id="dtIcon"></div>'+
   '<div><b class="tq'+(def.tier||1)+'" style="font-size:16px">'+(def.slot?eqName({id:def.id,q,plus}):def.n)+'</b>'+
   (def.slot?'<div style="font-size:11px;color:#a89058;margin-top:3px">'+({weapon:'武器',armor:'衣服',helmet:'头盔',necklace:'项链',bracelet:'手镯',ring:'戒指'})[def.slot]+
   (def.cls&&def.cls!=='all'?' · '+({w:'战士',m:'法师',t:'道士'})[def.cls]+'专属':'')+' · '+TIER_NAME[def.tier]+'品质'+
   (q!==1?' · <span style="color:'+EQQ[q].color+'">'+EQQ[q].n+(q===2?'(+32%)':'(-30%)')+'</span>':'')+
   (plus?' · <span style="color:#ffd84a">强化+'+plus+'</span>':'')+'</div>':'<div style="font-size:11px;color:#a89058;margin-top:3px">'+(def.ore?'强化材料':def.dan?'稀有道具 · 炼化得技能点':'消耗品')+'</div>')+
   '</div></div><div style="margin-top:8px">'+stats+
   (def.d?'<div style="font-size:11px;color:#8a7a50;margin-top:6px">「'+def.d+'」</div>':'')+'</div>'+
   forgeBtn+
   '<div>'+extra+tradeBtn+'<button class="goldbtn" style="margin:10px 0 0" id="dtClose">关闭</button></div>';
  $('dtIcon').appendChild(itemIcon(def));
  $('dtClose').addEventListener('pointerdown',()=>hideItemDetail());
  const u=$('dtUse');if(u)u.addEventListener('pointerdown',()=>{useInvItem(idx);hideItemDetail();});
  const f=$('dtForge');if(f)f.addEventListener('pointerdown',()=>{forgeWeapon(idx);hideItemDetail();});
  const sl=$('dtSell');if(sl)sl.addEventListener('pointerdown',()=>{
    /* 出售后保持背包打开：sellInvItem 内部已重开背包刷新列表与金币 */
    confirmItem('出售',def,it,sellMsg,()=>{sellInvItem(idx);});});
  const dp=$('dtDrop');if(dp)dp.addEventListener('pointerdown',()=>{
    confirmItem('丢弃',def,it,'丢弃后物品将永久消失，无法找回',()=>{dropInvItem(idx);});});
}
/* 危险操作二次确认（丢弃/出售）——回调式，onYes 在用户确认后执行 */
function confirmItem(act,def,it,msg,onYes){
  const d=$('itemDetail');showItemDetailBox();
  const nm=itemName(it);
  const nn=(it.pid&&it.n>1)?(' ×'+it.n):'';
  const canDo=!((act==='出售'||act==='丢弃')&&!inv.includes(it)); // 物品已不在背包则拒绝
  d.innerHTML='<div style="text-align:center;padding:6px 0">'+
   '<div style="font-size:15px;color:#ffca4a;font-weight:900">确认'+act+'？</div>'+
   '<div style="margin:8px 0;font-size:14px">'+nm+nn+'</div>'+
   '<div style="font-size:12px;color:#a89058;line-height:1.7">'+msg+'</div>'+
   '<div style="margin-top:12px">'+
   '<button class="goldbtn" style="margin:0 4px" id="cfNo">取消</button>'+
   '<button class="goldbtn" style="margin:0 4px;background:#4a1e1e;border-color:#8a3a3a;color:#ffb0a0" id="cfYes">确认'+act+'</button>'+
   '</div></div>';
  const yes=$('cfYes'),no=$('cfNo');
  /* 确认/取消后都要收起确认弹窗本身：
     确认 → 执行 onYes（onYes 内部会重开背包刷新列表，背包保持打开）
     取消 → 回到背包（重开背包刷新显示）
     物品已不在背包（canDo=false）→ 直接关闭全部面板 */
  if(yes)yes.addEventListener('pointerdown',()=>{ if(canDo){hideItemDetail();onYes();} else closePanel(); });
  if(no)no.addEventListener('pointerdown',()=>{ hideItemDetail();openBag(); });
}

/* 小地图：当前地图全貌 + 玩家/宠物/传送阵/精英/BOSS 实时位置 */
function drawMinimap(){
  const cvm=$('minimapCv');if(!cvm)return;
  const cw=320,ch=Math.max(120,Math.round(cw*MAP.Hpx/MAP.Wpx));
  cvm.width=cw;cvm.height=ch;
  const g=cvm.getContext('2d');
  const s=cw/MAP.Wpx;
  g.fillStyle=MAP.def.pal.g;g.fillRect(0,0,cw,ch);
  // 障碍地形
  g.fillStyle='rgba(0,0,0,.3)';
  for(const o of MAP.obs)g.fillRect(o.x*s-1,o.y*s-1,Math.max(2,o.w*s),Math.max(2,o.h*s));
  // 传送阵
  g.strokeStyle='#5ad8ff';g.lineWidth=2;
  g.beginPath();g.arc(MAP.portal.x*s,MAP.portal.y*s,5,0,6.29);g.stroke();
  // NPC（仅村庄）
  if(player.mapId==='village'){g.fillStyle='#5aff8a';
    for(const n of NPCS){g.beginPath();g.arc((MAP.portal.x+n.dx)*s,(MAP.portal.y+n.dy)*s,3,0,6.29);g.fill();}}
  // 怪物：精英紫点 / BOSS 红点脉动
  for(const m of MAP.mobs){
    if(m.dead)continue;
    if(m.d.boss){
      g.fillStyle='#ff3c1c';g.beginPath();
      g.arc(m.x*s,m.y*s,5+Math.sin(ST.time*4)*1.2,0,6.29);g.fill();
      g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';
      g.fillText('BOSS',m.x*s,m.y*s-8);
    }else if(m.d.elite){
      g.fillStyle='#c88aff';g.beginPath();g.arc(m.x*s,m.y*s,3.5,0,6.29);g.fill();
    }
  }
  // 宠物
  if(pet&&!pet.dead){g.fillStyle='#e8e4d8';g.beginPath();g.arc(pet.x*s,pet.y*s,2.5,0,6.29);g.fill();}
  // 玩家：金点 + 呼吸白圈
  g.fillStyle='#ffd84a';g.beginPath();g.arc(player.x*s,player.y*s,4,0,6.29);g.fill();
  g.strokeStyle='#fff';g.lineWidth=1.5;
  g.beginPath();g.arc(player.x*s,player.y*s,5.5+Math.sin(ST.time*5)*1.5,0,6.29);g.stroke();
}

     '<div class="mi"><b>'+m.n+'</b><small>推荐等级 '+m.lv[0]+'+'+(m.boss?' · 危险：'+MONSTERS[m.boss].n:'')+'</small></div>'+
     '<button class="goldbtn'+(ok?'':' dis')+'">前往</button></div>';
  }
  openPanel('当前地图 · '+MAP.def.n,html);
  drawMinimap();
  if(_mmTimer)clearInterval(_mmTimer);
  _mmTimer=setInterval(drawMinimap,600);
  $('panelBody').querySelectorAll('[data-map]').forEach(el=>{
    let sx=0,sy=0,moved=false,pid=null;
    el.addEventListener('pointerdown',e=>{
      // 按下立即捕获指针，滚动时不误触发传送
      sx=e.clientX;sy=e.clientY;moved=false;
      pid=e.pointerId;
      try{el.setPointerCapture(pid);}catch(_){}
    });
    el.addEventListener('pointermove',e=>{
      if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)moved=true;
    });
    el.addEventListener('pointerup',e=>{
      try{if(pid!==null)el.releasePointerCapture(pid);}catch(_){}
      if(moved)return; // 滑动过 → 视为滚动，不传送
      const id=el.dataset.map;const m=MAPMAP[id];
      if(!m)return;
      if(player.level<m.lv[0]-2){toast('等级不足，需 '+Math.max(1,m.lv[0]-2)+' 级');return;}
      switchMap(id);closePanel();
    });
    el.addEventListener('pointercancel',()=>{moved=true;});
  });
}

     '<div style="font-size:11px;color:#a89058;margin-top:2px">'+(s.empty?'空存档 —— 可用于开始新游戏':
       (s.name+' · '+clsInfo.name+' Lv.'+s.level+' · '+(MAPMAP[s.mapId]?MAPMAP[s.mapId].n:'—')+' · '+s.gold+'G'))+'</div>'+
     '<div style="font-size:10px;color:#6a5a38;margin-top:2px">'+(s.empty?'':saveTimeText(s.ts))+'</div></div>'+

     (s.empty?'':'<button class="goldbtn" data-slotUse="'+s.slot+'" style="padding:4px 11px;font-size:11px">'+(cur?'重新载入':'载入')+'</button>')+
     (s.empty||cur?'':'<button class="goldbtn" data-slotDel="'+s.slot+'" style="padding:4px 11px;font-size:11px;background:linear-gradient(180deg,#8a2a1a,#5a180e)">删除</button>')+
     '</div></div></div>';

  return html;

function openSlotPanel(back){
  openPanel('存档管理',genSlotPanel(),back);
  $('panelBody').querySelectorAll('[data-slotUse]').forEach(b=>{
    b.addEventListener('pointerdown',()=>{
      const sl=parseInt(b.dataset.slot);
      saveGame(curSlot);
      const sv=loadGame(sl);
      if(!sv){toast('该槽位无存档');return;}
      closePanel();
      if(confirm('载入存档槽 #'+sl+' ？当前进度已保存到 #'+curSlot+'。'))startGame(null,sv,sl);
    });
  });
  $('panelBody').querySelectorAll('[data-slotDel]').forEach(b=>{
    b.addEventListener('pointerdown',()=>{
      const sl=parseInt(b.dataset.slot);
      if(confirm('确定删除存档槽 #'+sl+' ？（不可恢复）')){delSave(sl);openSlotPanel(back);}
    });
  });
}

/* 角色头像（左上角图标）：绘制当前职业精灵半身像 */
function drawAvatar(){
  const cv=$('plAv');if(!cv)return;
  const spr=SPRITES['h_'+player.cls];
  const img=spr&&spr.f&&spr.f[0];
  if(!img){cv.style.display='none';return;}
  cv.style.display='block';
  if(cv.width!==img.width||cv.height!==img.height){
    cv.width=img.width;cv.height=img.height;
  }
  const g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  g.drawImage(img,0,0);
}

    const key=order[i],sk=SKILLS[key];

    const cfg=Object.assign({},ST.autoCfg,ov);
    const on=ST.autoSkill[i]!==false&&sk.type!=='passive';
    html+='<div class="skItem" style="'+(lock?'opacity:.5':'')+'">'+
     '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">'+sk.ico+' '+sk.name+'</b>'+
     '<span style="font-size:10px;color:#a89058">'+(typeTag[sk.type]||sk.type)+' · CD'+sk.cd+'s · '+sk.mp+'MP'+(lock?' · Lv'+sk.unlock+'解锁':'')+'</span>'+

      const rows=[];

/* ---------------- S11 存档（3 槽位） ---------------- */
const SAVE_N=3;
const SAVE_KEY=i=>'mf176_save_'+i;      // 槽位 1~3
const SAVE_BAK=i=>'mf176_bak_'+i;       // 上一次成功的存档（回滚用）
const META_KEY='mf176_meta';            // 存档指纹：即使槽位全空也能判断"这里曾经玩过"
const LEGACY_KEY='mf176_save';          // 旧版单存档，首次启动自动迁移到槽位1
const SAVE_VER=4;                       // 存档结构版本（迁移用，见 MIGRATIONS）
let curSlot=1;
/* 存档健康状态：写入失败时置位，UI 顶部显示常驻警示条 */
const SaveHealth={ok:true,msg:'',failCount:0,lastOk:0};

/* 统一的安全读取（损坏的 JSON 不抛异常，返回 null 并计数） */
function safeGet(key){
  try{return localStorage.getItem(key);}catch(e){return null;}
}
function safeSet(key,val){
  try{localStorage.setItem(key,val);return true;}
  catch(e){
    /* QuotaExceededError / SecurityError 等：交给调用方决定如何处理 */
    return false;
  }
}
/* ---------- 存档指纹：记录"这个存储空间曾经有过进度" ----------
   浏览器对 file:// 不同路径的 localStorage 是物理隔离的：
   换一个路径打开同一个 html，看到的是空白存储。
   指纹让我们能判断"这里本来有进度"，从而给出准确提示而不是默默丢失。 */
function touchMeta(){
  try{
    const cur=JSON.parse(safeGet(META_KEY)||'null')||{};
    const meta={
      first:cur.first||Date.now(),
      last:Date.now(),
      plays:(cur.plays||0)+1,
      best:Math.max(cur.best||0,player.level||1),
      name:(player&&player.name)||cur.name||'',
      level:(player&&player.level)||cur.level||1,
      ver:SAVE_VER
    };
    safeSet(META_KEY,JSON.stringify(meta));
    return meta;
  }catch(e){return null;}
}
function readMeta(){
  try{return JSON.parse(safeGet(META_KEY)||'null');}catch(e){return null;}
}
/* 是否处于"曾在此路径玩过，但现在三个槽位全空"的可疑状态 */
function detectLostStorage(){
  const meta=readMeta();
  if(!meta||!meta.first)return null;
  const any=loadGame(1)||loadGame(2)||loadGame(3);
  if(any)return null;
  return meta;   // 有指纹但没存档 → 高度怀疑换了打开路径
}
/* 标题画面上的"存档疑似丢失"警示条。
   本地 localStorage 按「页面路径+源」隔离：若把 html 换到别的文件夹/用别的
   方式打开（file:// 直开 vs 服务器），或换了浏览器/清了数据，就会读不到旧档。
   这里给出可操作的引导，而不是让玩家一脸茫然地发现存档"凭空消失"。 */
function renderLostWarn(){
  const el=$('lostWarn');if(!el)return;
  const meta=detectLostStorage();
  if(!meta){el.classList.add('hidden');el.innerHTML='';return;}
  const when=meta.last?saveTimeText(meta.last):'—';
  el.classList.remove('hidden');
  el.innerHTML='<b>⚠ 未找到存档</b><br>'+
   '这台设备上次游玩记录：'+(meta.name?('<b>'+meta.name+'</b> '):'')+
   (meta.level?('Lv.'+meta.level+' '):'')+'（'+when+'，共 '+((meta.plays|0)+1)+' 次）<br>'+
   '<span style="color:#c8a878">常见原因：把 html 文件换了位置/换了浏览器打开，'+
   '或清理过浏览器数据。请用<b>原来那个文件位置</b>再次打开。</span>'+
   '<div class="lwBtn">'+
   '<button class="goldbtn" id="lwNew">就当新游戏开始</button>'+
   '<button class="goldbtn" id="lwHide">我知道了</button>'+
   '</div>';
  const nw=$('lwNew');if(nw)nw.addEventListener('pointerdown',()=>{el.classList.add('hidden');});
  const hd=$('lwHide');if(hd)hd.addEventListener('pointerdown',()=>{el.classList.add('hidden');});

/* ---------- 数值边界校验（防止存档带出脏数据） ---------- */
const GOLD_MAX=9999999999;        // 金币上限（防溢出显示成科学计数）
const STACK_MAX=9999;             // 单格堆叠上限
function clampGold(v){
  let n=Math.floor(Number(v)||0);
  if(!isFinite(n))n=0;
  if(n<0)return 0;
  return n>GOLD_MAX?GOLD_MAX:n;
}
function normQ(q){q=Math.floor(Number(q));if(isNaN(q))return 1;return q<0?0:q>2?2:q;}
/* 装备实例规范化：补齐品质、钳制强化等级、剔除非法 id。
   非法装备（旧版本已删除的 id）直接返回 null，由调用方丢弃。 */
function normItem(it){
  if(!it||typeof it!=='object')return null;
  const def=it.pid?POTMAP[it.id]:EQMAP[it.id];
  if(!def)return null;                       // 未知 id → 丢弃，避免渲染崩溃
  let n=Math.floor(Number(it.n)||1);
  if(!isFinite(n)||n<1)n=1;                  // 0 / NaN / Infinity → 1
  if(n>STACK_MAX)n=STACK_MAX;                // 药水堆叠封顶，防 999999
  const out={id:it.id,pid:it.pid?1:0,n:n};
  if(!out.pid){
    out.q=normQ(it.q);
    const p=Math.floor(Number(it.plus)||0);
    if(isFinite(p)&&p>0)out.plus=Math.max(0,Math.min(PLUS_MAX,p));
  }
  return out;
}
/* 校验整份存档：返回 {data, broken:[]}，broken 记录被修正的项 */
function sanitizeSave(o){
  const broken=[];
  o.gold=clampGold(o.gold);
  o.level=Math.max(1,Math.min(99,Math.floor(Number(o.level)||1)));
  o.exp=Math.max(0,Math.floor(Number(o.exp)||0));
  o.kills=Math.max(0,Math.floor(Number(o.kills)||0));
  o.skillPt=Math.max(0,Math.floor(Number(o.skillPt)||0));
  /* 背包：逐件规范化，剔除非法 id 与重复的 null */
  const inv0=Array.isArray(o.inv)?o.inv:[];
  const inv1=[];
  for(const it of inv0){
    const n=normItem(it);
    if(n)inv1.push(n); else broken.push('背包物品#'+(it&&it.id));
  }
  o.inv=inv1.slice(0,40);
  /* 装备：非法 id 置 null（不会崩，只是少一件） */
  const eq=o.equip&&typeof o.equip==='object'?o.equip:{};
  for(const k of ['weapon','helmet','armor','necklace','bracelet','ring']){
    if(!eq[k]){eq[k]=null;continue;}
    const n=normItem(eq[k]);
    if(n&&EQMAP[n.id]&&EQMAP[n.id].slot===k)eq[k]=n;
    else{broken.push('装备#'+k+':'+(eq[k]&&eq[k].id));eq[k]=null;}
  }
  o.equip=eq;
  /* 天赋：只保留合法技能键、数值 0..TAL_MAX */
  if(o.talents&&typeof o.talents==='object'){
    const t={};
    for(const k in o.talents){
      if(SKILLS[k])t[k]=Math.max(0,Math.min(TAL_MAX,Math.floor(Number(o.talents[k])||0)));
      else broken.push('天赋#'+k);
    }
    o.talents=t;
  }else o.talents={};
  /* 成就：只保留存在的 id */
  if(Array.isArray(o.achv))o.achv=o.achv.filter(id=>ACHV.some(a=>a.id===id));
  else o.achv=[];
  /* 已通关地图 / 统计对象兜底 */
  if(!Array.isArray(o.qClaimed))o.qClaimed=[];
  if(!o.qKills||typeof o.qKills!=='object')o.qKills={};
  if(!o.qMemo||typeof o.qMemo!=='object')o.qMemo={};
  if(!o.stat||typeof o.stat!=='object')o.stat={};
  /* 数值型统计统一非负 */
  for(const k in o.stat)if(typeof o.stat[k]==='number'&&o.stat[k]<0)o.stat[k]=0;
  o.towerBest=Math.max(0,Math.floor(Number(o.towerBest)||0));
  o.dayN=Math.max(1,Math.floor(Number(o.dayN)||1));
  o.petLvl=Math.max(0,Math.min(PET_MAX,Math.floor(Number(o.petLvl)||0)));
  o.petExp=Math.max(0,Math.floor(Number(o.petExp)||0));
  /* 音画开关：只接受布尔，其余一律回落到默认「开」 */
  if(typeof o.vibe!=='boolean')o.vibe=true;
  if(typeof o.sfxOn!=='boolean')o.sfxOn=true;
  if(typeof o.bgmOn!=='boolean')o.bgmOn=true;
  return {data:o,broken};
}
/* 版本迁移钩子：旧结构 → 新结构。
   按「逐步升版」组织：每一步只负责把一个版本升到下一个版本，
   新增版本时在 MIGRATIONS 里追加一条即可，无需改动调用方。 */
const MIGRATIONS={
  /* v0/v1 → v2：早期装备没有品质字段，统一补为普通品质(1) */
  2:function(o){
    (o.inv||[]).forEach(i=>{if(i&&!i.pid&&i.q===undefined)i.q=1;});
    if(o.equip)for(const k in o.equip){
      if(o.equip[k]&&!o.equip[k].pid&&o.equip[k].q===undefined)o.equip[k].q=1;
    }
    if(!Array.isArray(o.inv))o.inv=[];
  },
  /* v2 → v3：新增自动拾取装备档位、统计对象兜底 */
  3:function(o){
    if(!o.stat)o.stat={};
    if(o.autoPick&&!o.autoPick.eqT)o.autoPick.eqT={1:true,2:true,3:true,4:true};
  },
  /* v3 → v4：为未来扩展预留 —— 补齐可能缺失的容器字段 */
  4:function(o){
    if(!Array.isArray(o.qClaimed))o.qClaimed=[];
    if(!o.qKills||typeof o.qKills!=='object')o.qKills={};
    if(!o.talents||typeof o.talents!=='object')o.talents={};
  }
};
function migrateSave(o){
  if(!o||typeof o!=='object')return null;
  let v=Math.floor(Number(o.v)||1);
  if(v<1)v=1;
  if(v>=SAVE_VER){o.v=SAVE_VER;return o;}    // 已是新版（或更新），不降级
  let guard=0;
  while(v<SAVE_VER&&guard++<16){
    const next=v+1;
    const fn=MIGRATIONS[next];
    if(typeof fn==='function'){
      try{fn(o);}catch(e){/* 单步迁移失败不阻塞，交给 sanitizeSave 兜底 */}
    }
    v=next;
  }
  o.v=SAVE_VER;
  return o;
}

/* 写存档：返回 true=成功，false=失败（失败原因见 SaveHealth.msg）
   成功时会先把"上一次的存档"复制到备份槽，实现一键回滚 */
function saveGame(slot){
  const sl=clamp(slot||curSlot,1,SAVE_N);
  curSlot=sl;
  let data;
  try{
    /* 写盘前对背包做一次轻量净化：剔除非法 id、钳制堆叠数，
       避免运行时偶发脏数据（如 n=0/NaN）被固化进存档 */
    const invClean=[];
    for(const it of (Array.isArray(inv)?inv:[])){
      const n=normItem(it);
      if(n)invClean.push(n);
    }
    data={v:SAVE_VER,slot:sl,ts:Date.now(),
     cls:player.cls,name:player.name,level:player.level,exp:player.exp,
     gold:clampGold(ST.gold),kills:ST.kills,mapId:player.mapId,x:player.x,y:player.y,
     hp:player.hp,mp:player.mp,inv:invClean,equip,auto:ST.auto,
     qKills:ST.qKills,qClaimed:ST.qClaimed,qMemo:ST.qMemo,     bossKills:ST.bossKills,q2Got:ST.q2Got,t4Got:ST.t4Got,maxPlus:ST.maxPlus,
     petMaxed:ST.petMaxed,achv:ST.achv,
     autoSkill:ST.autoSkill,autoPick:ST.autoPick,autoSellFull:ST.autoSellFull,
     autoSellCfg:ST.autoSellCfg,
     autoCfg:ST.autoCfg,autoSkillCfg:ST.autoSkillCfg,
     petLvl:pet?pet.lvl:0,petExp:pet?pet.exp:0,petStage:petCarry.stage||0,
     stat:ST.stat,skillPt:ST.skillPt,talents:ST.talents,talentReset:ST.talentReset,
     towerBest:ST.towerBest,towerClear:ST.towerClear,dayT:ST.dayT,dayN:ST.dayN,
     weather:ST.weather,weatherT:ST.weatherT,setOwn:ST.setOwn,
     /* 音画设置：此前这两个开关没落盘，重开后会被重置为默认值 */
     vibe:ST.vibe,sfxOn:SFX.on,bgmOn:SFX.bgm};
  }catch(e){
    /* 序列化前的数据组装出错（循环引用等）：明确报错，不静默 */
    noteSaveFail('数据异常：'+(e&&e.message||e));
    return false;
  }
  let json;
  try{json=JSON.stringify(data);}
  catch(e){noteSaveFail('数据序列化失败：'+(e&&e.message||e));return false;}
  /* 备份上一版（仅在已有内容时覆盖，保证备份总是"上一个好档"） */
  const old=safeGet(SAVE_KEY(sl));
  if(old)safeSet(SAVE_BAK(sl),old);
  if(!safeSet(SAVE_KEY(sl),json)){
    noteSaveFail('存储空间写入失败（可能已满或被浏览器限制）');
    return false;
  }
  noteSaveOk();
  touchMeta();
  return true;
}
/* 存档健康状态更新 —— 失败时常驻警示条，成功则自动收起 */
function noteSaveFail(msg){
  SaveHealth.ok=false;SaveHealth.msg=msg;SaveHealth.failCount++;
  updateSaveWarn();
}
function noteSaveOk(){
  SaveHealth.ok=true;SaveHealth.msg='';SaveHealth.failCount=0;SaveHealth.lastOk=Date.now();
  updateSaveWarn();
}
/* 顶部常驻警示条：存档写不进去时必须让玩家立刻知道，而不是"玩得挺好、退出全没" */
function updateSaveWarn(){
  let bar=document.getElementById('saveWarn');
  if(!bar){
    bar=document.createElement('div');bar.id='saveWarn';
    const gui=document.getElementById('gameUI');
    if(!gui)return;
    gui.appendChild(bar);
  }
  if(SaveHealth.ok){bar.classList.add('hidden');return;}
  bar.classList.remove('hidden');
  bar.innerHTML='⚠ 存档写入失败 · '+SaveHealth.msg+
    '<br><span style="font-size:10px;opacity:.85">请勿关闭页面，建议清理浏览器存储空间或换用浏览器</span>';
}
function loadGame(slot){
  const sl=clamp(slot||curSlot,1,SAVE_N);
  const s=safeGet(SAVE_KEY(sl));
  if(!s)return null;
  try{
    const o=JSON.parse(s);
    if(!o||typeof o!=='object')return null;
    o.slot=sl;
    return migrateSave(o);
  }catch(e){return null;}
}
/* 读备份档（回滚入口用） */
function loadBackup(slot){
  const sl=clamp(slot||curSlot,1,SAVE_N);
  const s=safeGet(SAVE_BAK(sl));
  if(!s)return null;
  try{const o=JSON.parse(s);if(!o||typeof o!=='object')return null;o.slot=sl;return migrateSave(o);}
  catch(e){return null;}
}
/* 用备份覆盖当前槽（回滚） */
function restoreBackup(slot){
  const sl=clamp(slot||curSlot,1,SAVE_N);
  const bak=safeGet(SAVE_BAK(sl));
  if(!bak)return false;
  if(!safeSet(SAVE_KEY(sl),bak))return false;
  return true;
}
/* 全部槽位摘要（标题画面用），无存档返回 null */
function listSaves(){
  const out=[];
  for(let i=1;i<=SAVE_N;i++){
    const s=loadGame(i);
    out.push(s?{slot:i,cls:s.cls,name:s.name||'玛法勇士',level:s.level||1,
      gold:s.gold||0,mapId:s.mapId||'village',ts:s.ts||0,petStage:s.petStage||0,
      towerBest:s.towerBest||0,hasBak:!!loadBackup(i)}:{slot:i,empty:true,hasBak:!!loadBackup(i)});

}
function saveTimeText(ts){

/* ============ 装备重铸 / 洗练系统 ============
   消耗黑铁矿石 + 金币重掷装备品质档（劣质 / 普通 / 小极品），可小幅跳档。
   重铸不会降低已强化的等级，且对同部位已穿戴装备即时生效。 */
const REROLL_COST=eq=>{const t=EQMAP[eq.id]?EQMAP[eq.id].tier:1;
  return{ore:t*2,gold:600*t};};
/* 单次重铸的品质概率：偏向高走，但仍有小概率掉档 */
function rollRerollQ(cur){
  const r=Math.random();
  if(cur===0)  return r<.55?1:r<.90?2:0;      // 劣质 → 多为提升
  if(cur===1)  return r<.10?0:r<.72?1:2;      // 普通 → 小极品 28%
  return r<.14?1:r<.22?0:2;                   // 小极品 → 14% 掉普通，8% 掉劣质
}
/* 重铸任意装备实例（背包内或身上） */
function reforgeDo(item,after){
  if(!item||item.pid){toast('只有装备可以重铸');return false;}
  const d=EQMAP[item.id];if(!d){toast('未知装备');return false;}
  const cost=REROLL_COST(item);
  if(countOre()<cost.ore){toast('黑铁矿石不足（需 '+cost.ore+' 个，现有 '+countOre()+' 个）');return false;}
  if(ST.gold<cost.gold){toast('金币不足（需 '+cost.gold+'）');return false;}
  takeOre(cost.ore);ST.gold-=cost.gold;
  ST.stat.goldSpend=(ST.stat.goldSpend||0)+cost.gold;
  ST.stat.reroll=(ST.stat.reroll||0)+1;
  const before=qOf(item);
  const nq=rollRerollQ(before);
  item.q=nq;
  const onBody=Object.values(equip).includes(item);
  if(onBody)recalcStats();
  if(nq>before){SFX.lvl();banner('✦ 重铸提升 ✦',EQQ[before].n+' → '+EQQ[nq].n+' · '+eqName(item));}
  else if(nq<before){SFX.die();toast('重铸失败…品质下降为「'+EQQ[nq].n+'」');}
  else{SFX.click();toast('品质未变，仍是「'+EQQ[nq].n+'」');}
  addLog('⚗ 重铸 '+d.n+'：'+EQQ[before].n+' → '+EQQ[nq].n);
  checkAchv();
  if(after)after();
  return true;
}

const REROLL_PROB=[[.35,.55,.10],[.10,.62,.28],[.08,.14,.78]];
function rerollProb(cur,target){return REROLL_PROB[clamp(cur,0,2)][target];}

/* ============ 离线挂机收益 ============ */
const OFFLINE_MAX=8*3600;         // 最多结算 8 小时
const OFFLINE_MIN=120;            // 低于 2 分钟不弹结算
/* 依据等级与当前地图推算每秒收益（与掉落表量级匹配） */
function offlineRate(){
  const lv=player.level||1;
  const mapDef=MAPMAP[player.mapId]||MAPMAP.village;
  const lvBand=(mapDef&&mapDef.lv?mapDef.lv[0]:1);
  const scale=Math.max(1,lvBand/6);
  const goldPerSec=(1.6+lv*0.55)*scale;
  const expPerSec=(2.2+lv*0.85)*scale;
  const orePerMin=0.06*scale*(1+(lv>=30?1:.5));
  return{gold:goldPerSec,exp:expPerSec,ore:orePerMin};
}
/* 计算离线收益（seconds 已截断） */
function calcOffline(seconds){
  const s=clamp(Math.floor(seconds),0,OFFLINE_MAX);
  const r=offlineRate();
  return{sec:s,gold:Math.floor(r.gold*s),exp:Math.floor(r.exp*s),
    ore:Math.floor(r.ore*s/60)};
}
function doOfflineSettle(seconds){
  const o=calcOffline(seconds);
  if(o.sec<OFFLINE_MIN||(o.gold<=0&&o.exp<=0&&o.ore<=0))return null;
  ST.gold=clampGold((ST.gold||0)+o.gold);ST.stat.goldEarn=(ST.stat.goldEarn||0)+o.gold;
  gainExp(o.exp);
  if(o.ore>0){
    ST.stat.oreGet=(ST.stat.oreGet||0)+o.ore;
    /* 满包不再静默丢弃：统一走 addOrConvert 折算金币 */
    const r=addOrConvert({id:'ore',pid:1,n:o.ore},{silent:true});
    if(!r.ok&&r.conv>0){o.convGold=(o.convGold||0)+r.conv;
      addLog('背包已满，'+o.ore+' 个黑铁矿石折算为 '+r.conv+' 金币');}
  }
  ST.stat.time=(ST.stat.time||0)+o.sec;
  return o;
}

function checkOffline(save){
  if(!save||!save.ts)return null;

/* ============ 试炼副本（试炼塔） ============
   限时多层挑战：每层清空全部怪物进入下一层，层数越高怪物越强。
   奖励：每层金矿 + 通关层宝箱；阵亡或超时结束，记录最高层。 */
const TOWER_MAX=15;
const TOWER_TIME=75;              // 每层限时（秒）
function towerMobIds(floor){
  const bands=[
    ['skeleton','maggot','axe_skel'],                                  // 1-3
    ['zombie','rotten','skel_elite'],                                  // 4-6
    ['black_maggot','woma_soldier','woma_hero'],                       // 7-9
    ['zuma_guard','zuma_archer','zuma_statue'],                        // 10-12
    ['crimson_worm','devil_spider','gorilla']                          // 13-15
  ];
  return bands[clamp(Math.floor((floor-1)/3),0,bands.length-1)];
}
function towerMobCount(floor){return clamp(6+floor,7,22);}
function towerScale(floor){return 1+(floor-1)*0.22;}   // 每层属性 +22%
function startTower(){
  ST.tower={floor:1,killed:0,t:TOWER_TIME,alive:0,runBest:0,reward:{gold:0,exp:0,ore:0}};
  ST.towerRuns=(ST.towerRuns||0)+1;ST.stat.towerRuns=(ST.stat.towerRuns||0)+1;
  enterTowerFloor(1);
}
/* 生成试炼竞技场地图（复用 genMap，替换怪物组） */
function enterTowerFloor(floor){
  const t=ST.tower;if(!t)return;
  t.floor=floor;t.t=TOWER_TIME;t.killed=0;
  const scale=towerScale(floor);
  const arena={id:'tower',n:'试炼塔 · 第 '+floor+' 层',lv:[1,99],w:30,h:30,
    pal:{g:'#2a2438',g2:'#241e30',g3:'#322a42',deco:'pillar'},mobs:[],max:0};
  arena.mobs=towerMobIds(floor).map((id,i)=>({id,w:5}));
  arena.max=0;
  MAP=genMap(arena);
  player.mapId='tower';player.x=MAP.spawn.x;player.y=MAP.spawn.y;
  projectiles=[];aoes=[];zones=[];player.target=null;bossRef=null;
  MAP.mobs.length=0;
  /* 生成强化后的试炼怪（以原型数值为基准乘算，避免重复叠加） */
  const n=towerMobCount(floor),ids=towerMobIds(floor);
  for(let i=0;i<n;i++){
    let x,y,tries=0;
    do{x=rnd(90,MAP.Wpx-90);y=rnd(90,MAP.Hpx-90);tries++;}while(mapObsAt(x,y,16)&&tries<30);
    const m=spawnMob(pick(ids),x,y);
    const base=MONSTERS[m.id];
    m.bossHp=Math.floor(base.hp*scale);
    m.hp=m.maxHp=m.bossHp;
    m.d=Object.assign({},base,{atk:Math.floor(base.atk*scale),
      exp:Math.floor(base.exp*scale*.9),
      gold:[Math.floor(base.gold[0]*scale),Math.floor(base.gold[1]*scale)]});
    m.towerMob=true;
  }
  t.alive=MAP.mobs.filter(m=>!m.dead).length;
  $('mapName').textContent=arena.n;
  ST.auto=true;updateAutoBtn();
  banner('⚔ 试炼塔 第 '+floor+' 层','清空全部怪物（'+n+' 只）· 限时 '+TOWER_TIME+' 秒');
  addLog('⚔ 试炼塔第 '+floor+' 层开始，怪物强度 ×'+scale.toFixed(2));
  SFX.boss();
}
function updateTower(dt){
  const t=ST.tower;if(!t||player.mapId!=='tower')return;
  t.t-=dt;
  t.alive=MAP.mobs.filter(m=>!m.dead).length;
  if(t.alive<=0){towerFloorClear();return;}
  if(t.t<=0){failTower('时间耗尽，止步第 '+t.floor+' 层');return;}
}
function towerFloorClear(){
  const t=ST.tower;if(!t)return;
  const floor=t.floor;
  /* 每层奖励：金币 + 经验 + 概率矿石 */
  const gold=Math.floor((220+player.level*70)*towerScale(floor));
  const exp=Math.floor((120+player.level*45)*towerScale(floor));
  const ore=Math.random()<.55?1+Math.floor(floor/5):0;
  ST.gold=clampGold((ST.gold||0)+gold);ST.stat.goldEarn+=gold;t.reward.gold+=gold;t.reward.exp+=exp;t.reward.ore+=ore;
  gainExp(exp);
  if(ore){ST.stat.oreGet+=ore;const cr=addOrConvert({id:'ore',pid:1,n:ore},{silent:true});
    if(!cr.ok&&cr.conv>0){t.reward.gold+=cr.conv;addLog('背包已满，'+(ore)+' 个黑铁矿石折算为 '+cr.conv+' 金币');}}
  if(floor+1>ST.towerBest)ST.towerBest=floor+1;
  if(floor>=TOWER_MAX){towerClear();return;}
  banner('✔ 第 '+floor+' 层 通过','+'+gold+' 金币 · +'+exp+' 经验'+(ore?' · 黑铁矿石 ×'+ore:''));
  addLog('✔ 试炼塔第 '+floor+' 层通过（+' +gold+'G / +'+exp+'EXP）');
  SFX.lvl();
  setTimeout(()=>{if(ST.tower)enterTowerFloor(floor+1);},900);
}
function towerClear(){
  const t=ST.tower;if(!t)return;
  ST.towerClear=(ST.towerClear||0)+1;
  ST.towerBest=TOWER_MAX;
  /* 试炼塔不再直接发放技能点（技能点唯一来源为 Boss 内丹）——
     改为奖励黑铁矿石与金币，保留挑战价值 */
  const oreReward=12+TOWER_MAX*2;
  ST.stat.oreGet=(ST.stat.oreGet||0)+oreReward;
  /* 满包折算金币，不再静默丢失全通大奖 */
  const cRes=addOrConvert({id:'ore',pid:1,n:oreReward},{silent:true});
  const goldReward=TOWER_MAX*3000+(cRes.conv||0);
  ST.gold=clampGold((ST.gold||0)+goldReward);ST.stat.goldEarn=(ST.stat.goldEarn||0)+goldReward;
  if(!cRes.ok&&cRes.conv>0)addLog('背包已满，全通奖励矿石折算为 '+cRes.conv+' 金币');
  banner('🏆 试炼塔 全通 ！','奖励黑铁矿石 ×'+oreReward+' · 金币 '+goldReward.toLocaleString()+' · 称号「塔顶之人」');
  addLog('🏆 试炼塔全通！获得黑铁矿石 ×'+oreReward+' 与 '+goldReward.toLocaleString()+' 金币');
  ST.setOwn=ST.setOwn||{};ST.setOwn.tower=1;
  const r=t.reward;ST.tower=null;
  endTower('恭喜通关试炼塔！',r,true);
}
function failTower(reason){
  const t=ST.tower;if(!t)return;

/* 昼夜与天气推进 */
function updateWorld(dt){
  /* 昼夜 */
  ST.dayT+=dt;
  const prevPhase=ST._phaseId;
  const ph=curPhase();
  if(prevPhase!==ph.id){
    ST._phaseId=ph.id;
    if(prevPhase)addLog(ph.ico+' 天色转为「'+ph.n+'」'+(ph.id==='night'?'（怪物更强、掉落更丰）':ph.id==='day'?'（回血更快）':''));
    if(ph.id==='day'){ST.dayN=(ST.dayN||1)+1;}
  }
  /* 天气 */
  ST.weatherT-=dt;
  if(ST.weatherT<=0){
    const w=rollWeather();
    if(w.id!==ST.weather){
      ST.weather=w.id;
      addLog(w.ico+' 天气：「'+w.n+'」 '+w.desc);
      /* 天气切换 → 旧天气 BOSS 退场，新天气 BOSS 降临 */
      if(MAP&&mapAllowsWeatherBoss()){
        if(MAP.mobs.some(m=>m.weatherBossKlass)){
          clearWeatherBoss();
          addLog('⚡ 天象更替，此前凝聚的天气化身已消散');
        }
        weatherBossTick();
      }
    }
    ST.weatherT=rnd(w.dur[0],w.dur[1]);
  }
  /* 天气 BOSS 兜底投放：切图后/击杀冷却结束后补投 */
  if(!ST._wbSeen||ST._wbSeen!==ST.weather+(MAP?MAP.def.id:'')){
    ST._wbSeen=ST.weather+(MAP?MAP.def.id:'');
    weatherBossTick();
  }
  /* 天气粒子（雨/雷暴/浓雾） */
  if(ST.weather==='rain'||ST.weather==='thunder'){
    const vw=window.innerWidth/zoom(),vh=window.innerHeight/zoom();
    const n=ST.weather==='thunder'?10:7;
    for(let i=0;i<n;i++){
      if(Math.random()<.8)particles.push({x:cam.x+rnd(-40,vw+40),y:cam.y+rnd(-60,0),
        vx:rnd(-40,-10),vy:rnd(380,520),t:rnd(.35,.6),color:'#a8d8ff',r:rnd(1.5,2.5),g:0,rain:1});
    }
    if(ST.weather==='thunder'&&Math.random()<.006){
      const lx=cam.x+rnd(0,vw),ly=cam.y+rnd(0,vh);
      boltFx(lx,ly+60);SFX.bolt();
    }
  }else if(ST.weather==='fog'){
    const vw=window.innerWidth/zoom(),vh=window.innerHeight/zoom();
    if(Math.random()<.5)particles.push({x:cam.x+rnd(-60,vw+60),y:cam.y+rnd(0,vh),
      vx:rnd(6,22),vy:0,t:rnd(1.4,2.4),color:'#c8c8d8',r:rnd(8,18),g:0,fog:1});
  }
  ST.stat.time=(ST.stat.time||0)+dt;
}
let cam={x:0,y:0};
function resizeCanvas(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=window.innerWidth*dpr;cv.height=window.innerHeight*dpr;
  cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';
  cv._dpr=dpr;
}
function updateCamera(){
  const vw=window.innerWidth/zoom(),vh=window.innerHeight/zoom();
  cam.x=clamp(player.x-vw/2,0,Math.max(0,MAP.Wpx-vw));
  cam.y=clamp(player.y-vh/2,0,Math.max(0,MAP.Hpx-vh));
}
function zoom(){return Math.max(1,window.innerWidth/440,window.innerHeight/760);}
function render(){
  /* 标题画面 / 切换地图瞬间 MAP 尚未就绪，直接跳过渲染（否则读取 MAP.Wpx 抛异常） */
  if(!MAP)return;
  const ctx=cv.getContext('2d');
  const dpr=cv._dpr||1;
  const z=zoom();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  ctx.save();
  ctx.scale(z,z);
  /* 震屏：只在 shakeT>0 时给一个随机偏移，二次衰减让收尾更自然。
     注意偏移加在相机平移上而非独立变换，这样 UI 层（restore 之后）完全不受影响 */
  let shx=0,shy=0;
  if(shakeT>0){
    const k=Math.max(0,shakeT/SHAKE_DUR);
    const a=shakeAmp*k*k;
    shx=(Math.random()*2-1)*a;
    shy=(Math.random()*2-1)*a;
  }
  ctx.translate(-cam.x+shx,-cam.y+shy);
  // 地面（视口裁剪绘制）
  const vw=window.innerWidth/z,vh=window.innerHeight/z;
  const sx=clamp(cam.x,0,MAP.Wpx),sy=clamp(cam.y,0,MAP.Hpx);
  const sw=clamp(vw,0,MAP.Wpx-sx),sh=clamp(vh,0,MAP.Hpx-sy);
  if(sw>0&&sh>0)ctx.drawImage(MAP.base,sx,sy,sw,sh,sx,sy,sw,sh);
  // 装饰
  for(const d of MAP.deco){
    if(d.x<cam.x-40||d.x>cam.x+window.innerWidth/z+40||d.y<cam.y-40||d.y>cam.y+window.innerHeight/z+40)continue;
    const sp=SPRITES[d.k].f[0];
    ctx.drawImage(sp,d.x-sp.width/2,d.y-sp.height);
  }
  // 障碍
  for(const o of MAP.obs){
    if(o.x<cam.x-80||o.x>cam.x+window.innerWidth/z+80||o.y<cam.y-80||o.y>cam.y+window.innerHeight/z+80)continue;
    ctx.drawImage(SPRITES[o.k].f[0],o.x,o.y);
  }
  // 传送门
  drawPortal(ctx,MAP.portal.x,MAP.portal.y);
  // NPC
  drawNPCs(ctx);
  // 掉落
  for(const d of MAP.drops){
    if(d.gold){
      ctx.fillStyle='#ffd84a';ctx.beginPath();
      ctx.ellipse(d.x,d.y-4+Math.sin(d.bob)*2,5,7,0,0,6.29);ctx.fill();
      ctx.strokeStyle='#8a6a10';ctx.stroke();
    }else{
      const def=d.item.pid?POTMAP[d.item.id]:EQMAP[d.item.id];
      if(d.beam&&d.beam>=3){
        const g=ctx.createLinearGradient(0,d.y-90,0,d.y);
        g.addColorStop(0,'rgba(255,255,255,0)');
        g.addColorStop(1,d.beam===4?'#ffca4a99':'#c88aff99');
        ctx.fillStyle=g;ctx.fillRect(d.x-5,d.y-90,10,90);
      }
      ctx.save();ctx.translate(d.x,d.y-6+Math.sin(d.bob)*3);
      const ic=itemIconImg(def);
      if(ic.complete&&ic.width)ctx.drawImage(ic,-14,-20,28,24);
      ctx.restore();
      // 名字标签：仅在玩家附近显示，小极品金色高亮
      if(dist(d,player)<170){
        const qn=d.item.q===2?'小极品·':d.item.q===0?'劣质·':'';
        ctx.font='bold 9px sans-serif';ctx.textAlign='center';
        const lbl=qn+def.n;
        ctx.fillStyle='#000a';ctx.fillText(lbl,d.x+1,d.y-31);
        ctx.fillStyle=d.item.q===2?'#ffca4a':(def.tier?TIER_COLOR[def.tier]:'#fff');
        ctx.fillText(lbl,d.x,d.y-32);
      }
    }
  }
  // AOE 警示圈（地面层）——带颜色主题（毒雾绿/火焰橙/雷霆金…）
  for(const a of aoes){
    const p=1-a.t/a.max;
    const col=a.color||'#ff3c1e';
    ctx.globalAlpha=.5+.4*Math.sin(ST.time*12);
    ctx.strokeStyle=col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.29);ctx.stroke();
    ctx.globalAlpha=.12+p*.25;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(a.x,a.y,a.r*p,0,6.29);ctx.fill();
    ctx.globalAlpha=1;
  }
  // 灼烧地带（地面持续伤害区域）
  for(const z of zones){
    const fade=clamp(z.t/z.max,0,1);
    ctx.globalAlpha=(.14+.06*Math.sin(ST.time*7))*fade+.06;
    ctx.fillStyle=z.color;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.29);ctx.fill();
    ctx.globalAlpha=.55*fade+.15;
    ctx.strokeStyle=z.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.29);ctx.stroke();
    // 内圈随机火星
    for(let k=0;k<3;k++){
      const a=ST.time*3+k*2.1;
      ctx.globalAlpha=.5*fade;
      ctx.fillRect(z.x+Math.cos(a)*z.r*.55-2,z.y+Math.sin(a)*z.r*.4-2,3,3);
    }
    ctx.globalAlpha=1;
  }
  // 实体收集 y 排序
  const ents=[];
  for(const m of MAP.mobs)if(!m.dead)ents.push(m);
  if(pet&&!pet.dead)ents.push(pet);
  if(!player.dead)ents.push(player);
  ents.sort((a,b)=>a.y-b.y);
  // 阴影
  for(const e of ents){
    const sp=e===player?SPRITES['h_'+player.cls]:e===pet?SPRITES['h_skel']:monSpr(e);
    const sc=e===player?1:(e===pet?1:(e.d.sc||1));
    const w=sp.f[0].width*sc,h=sp.f[0].height*sc;
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(e.x,e.y-2,w*.32,7,0,0,6.29);ctx.fill();
  }
  for(const e of ents){
    const isPl=e===player,isPet=e===pet;
    const d=isPl?null:e.d;
    const spr=isPl?SPRITES['h_'+player.cls]:isPet?SPRITES['h_skel']:monSpr(e);
    const sc=isPl?1:isPet?1:(d.sc||1);
    const frame=Math.floor(e.animT)%2;
    let img=spr.f[frame];
    const w=img.width*sc,h=img.height*sc;
    ctx.save();
    ctx.translate(e.x,e.y);
    if(e.face<0)ctx.scale(-1,1);
    ctx.drawImage(img,-w/2,-h+6,w,h);
    /* 受击泛白：用 source-atop 只在"刚画上去的精灵像素"范围内铺白，
       比原先的透明脉动更接近街机的"打中变白"手感。
       source-atop 只影响当前已有像素，不会盖到背景，也不破坏 save/restore 语义 */
    if(e.flash>0){
      ctx.save();
      ctx.globalCompositeOperation='source-atop';
      ctx.globalAlpha=clamp(e.flash/.15,0,1);
      ctx.fillStyle='#fff';
      ctx.fillRect(-w/2,-h+6,w,h);
      ctx.restore();
    }
    // 手中武器：在躯干之上绘制，随朝向翻转；攻击时挥砍偏转
    if(isPl||isPet||e.d.armed)drawHandWeapon(e,ctx,e.face,frame);
    ctx.restore();
    /* 光武特效：脚下光环 + 环绕光点 + 手中武器辉光（小极品 / 强化+4/+7/+10 / 神兵）
       —— 原实现仅脚下圈，现补上"手中武器本身发光"，让光武真正长在武器上 */
    if(isPl){
      const wg=weaponGlowColor(equip.weapon);
      if(wg){
        const plus=equip.weapon.plus||0,strong=plus>=7||EQMAP[equip.weapon.id].tier===4;
        ctx.globalAlpha=.28+.08*Math.sin(ST.time*3.1);
        ctx.fillStyle=wg;
        ctx.beginPath();ctx.ellipse(e.x,e.y+4,17,6.5,0,0,6.29);ctx.fill();
        if(strong){ctx.globalAlpha=.15;
          ctx.beginPath();ctx.ellipse(e.x,e.y+4,27,10.5,0,0,6.29);ctx.fill();}
        ctx.globalAlpha=.55;ctx.strokeStyle=wg;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.ellipse(e.x,e.y+4,17,6.5,0,0,6.29);ctx.stroke();
        ctx.globalAlpha=.85;
        const nDots=strong?5:3;
        for(let k=0;k<nDots;k++){const a=ST.time*2.6+k*6.28/nDots;
          ctx.fillRect(e.x+Math.cos(a)*h*.52-2,e.y-h*.52+Math.sin(a)*h*.42-2,4,4);}
        ctx.globalAlpha=1;
        // 手中武器辉光（沿剑身分布的柔光晕）
        const hp2=handPos(e,e.face);
        const ang=e.face*WEAPON_TILT+weaponSwing(e);
        ctx.save();
        ctx.translate(hp2.x,hp2.y);ctx.rotate(ang);
        const pulse=.22+.14*Math.sin(ST.time*4.6);
        ctx.globalAlpha=pulse;ctx.fillStyle=wg;
        ctx.beginPath();ctx.ellipse(e.face*2,-WEAPON_LEN*.42,10,WEAPON_LEN*.56,0,0,6.29);ctx.fill();
        if(strong){
          ctx.globalAlpha=pulse*.7;
          ctx.beginPath();ctx.ellipse(e.face*2,-WEAPON_LEN*.42,17,WEAPON_LEN*.8,0,0,6.29);ctx.fill();
        }
        ctx.globalAlpha=.9;ctx.strokeStyle=wg;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,4);ctx.lineTo(e.face*3,-WEAPON_LEN);ctx.stroke();
        ctx.globalAlpha=1;
        ctx.restore();
      }
    }
    // 玩家魔法盾
    if(isPl&&player.shieldT>0){
      ctx.strokeStyle='rgba(90,160,255,'+(0.4+0.3*Math.sin(ST.time*8))+')';
      ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y-h*.5,h*.55,0,6.29);ctx.stroke();
      // 环绕光点
      for(let k=0;k<3;k++){const a=ST.time*3.2+k*2.09;
        ctx.fillStyle='#9cc8ff';ctx.globalAlpha=.85;
        ctx.fillRect(e.x+Math.cos(a)*h*.55-2,e.y-h*.5+Math.sin(a)*h*.55-2,4,4);
        ctx.globalAlpha=1;}
    }
    // 名字与血条
    if(isPl){
      ctx.font='bold 10px sans-serif';ctx.textAlign='center';
      ctx.fillStyle='#7affb0';ctx.fillText(player.name+' Lv.'+player.level,e.x,e.y-h-16);
    }else if(isPet){
      const plc=PET_LV[pet.lvl]||PET_LV[0];
      ctx.font='bold 10px sans-serif';ctx.textAlign='center';
      ctx.fillStyle=plc.c;ctx.fillText(plc.n+' LV'+(pet.lvl+1),e.x,e.y-h-16);
      ctx.fillStyle='#000c';ctx.fillRect(e.x-13,e.y-h-12,26,4);
      ctx.fillStyle=plc.c;
      ctx.fillRect(e.x-12,e.y-h-11,24*clamp(e.hp/e.maxHp,0,1),2);
      // 经验条（血条下方细条）
      if(pet.lvl<PET_MAX){
        const cur=pet.exp-PET_LV[pet.lvl].exp,nxt=PET_LV[pet.lvl+1].exp-PET_LV[pet.lvl].exp;
        ctx.fillStyle='#000a';ctx.fillRect(e.x-12,e.y-h-8,24,2);
        ctx.fillStyle='#ffd84a';ctx.fillRect(e.x-12,e.y-h-8,24*clamp(cur/nxt,0,1),2);
      }
    }else{
      /* 人机玩家：职业色名字 + 敌对标记 + 橙色血条 */
      if(e.isBot){
        ctx.font='bold 10px sans-serif';ctx.textAlign='center';
        ctx.fillStyle=({warrior:'#ff8a70',mage:'#7ab0ff',taoist:'#5ad8a0'})[e.botCls]||'#e8d9b0';
        ctx.fillText(e.botName+' Lv.'+e.botLv,e.x,e.y-h-16);
        if(e.aggro===player){ // 敌对标记：红色战斗标记闪烁
          ctx.fillStyle='#ff3c1c';
          ctx.globalAlpha=.6+.4*Math.sin(ST.time*9);
          ctx.fillText('⚔',e.x,e.y-h-27);ctx.globalAlpha=1;
        }
        if(e.aggro||e.hp<e.maxHp){
          ctx.fillStyle='#000c';ctx.fillRect(e.x-16,e.y-h-12,32,4);
          ctx.fillStyle='#ff9a3c';
          ctx.fillRect(e.x-15,e.y-h-11,30*clamp(e.hp/e.maxHp,0,1),2);
        }
      }else{
      const showBar=e.aggro||e.hp<e.maxHp||d.boss||d.elite;
      ctx.font=(d.boss?'bold ':'')+'10px sans-serif';ctx.textAlign='center';
      ctx.fillStyle=d.boss?'#ff6a4c':d.elite?'#ffd84a':'#e8d9b0';
      ctx.fillText(d.n,e.x,e.y-h-16);
      if(showBar){
        const bw=d.boss?46:26;
        ctx.fillStyle='#000c';ctx.fillRect(e.x-bw/2,e.y-h-12,bw,4);
        ctx.fillStyle=d.boss?'#ff3c1c':'#3cff5a';
        ctx.fillRect(e.x-bw/2+1,e.y-h-11,(bw-2)*clamp(e.hp/e.maxHp,0,1),2);
      }
      if(d.boss){updateBossBar(e);}
      }
      /* 狂暴光环：红雾 + 环绕火星 */
      if(e.raged){
        ctx.globalAlpha=.22+.09*Math.sin(ST.time*6);
        ctx.fillStyle='#ff3c1c';
        ctx.beginPath();ctx.ellipse(e.x,e.y+2,h*.6,12,0,0,6.29);ctx.fill();
        ctx.globalAlpha=.85;
        for(let k=0;k<4;k++){const a=ST.time*4+k*1.57;
          ctx.fillStyle='#ff6a3c';
          ctx.fillRect(e.x+Math.cos(a)*h*.5-2,e.y-h*.45+Math.sin(a)*h*.38-2,3,3);}
        ctx.globalAlpha=1;
      }
    }
  }
  // 投射物
  for(const p of projectiles){
    ctx.save();ctx.translate(p.x,p.y);
    if(p.px)ctx.rotate(Math.atan2(p.py,p.px));
    if(p.kind==='fireball'){ctx.fillStyle='#ff8a2c';ctx.beginPath();ctx.arc(0,0,6,0,6.29);ctx.fill();
      ctx.fillStyle='#ffe0a0';ctx.beginPath();ctx.arc(0,0,3,0,6.29);ctx.fill();}
    else if(p.kind==='charm'){ctx.fillStyle='#ffe95a';ctx.fillRect(-6,-3,12,6);
      ctx.fillStyle='#c08010';ctx.fillRect(-2,-3,2,6);}
    else if(p.kind==='axe'||p.kind==='darkaxe'){ctx.fillStyle=p.kind==='axe'?'#b09068':'#8a4a68';
      ctx.fillRect(-6,-2,12,4);ctx.fillRect(-2,-6,4,12);}
    else if(p.color){ // 通用法术弹（BOSS 弹幕/人机法弹）：单色光球 + 白芯
      ctx.fillStyle=p.color;ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(0,0,6,0,6.29);ctx.fill();
      ctx.fillStyle='#fff';ctx.globalAlpha=.95;
      ctx.beginPath();ctx.arc(0,0,2.6,0,6.29);ctx.fill();
      ctx.globalAlpha=1;}
    ctx.restore();
  }
  // 斩击特效
  for(const s of slashes){
    if(s.arc){ // 半月弯刀：双向旋转剑气
      ctx.strokeStyle=s.color;ctx.lineWidth=5;ctx.globalAlpha=clamp(s.t*4,0,1);
      const a0=s.a0+(0.4-s.t)*22,ar=Math.max(2,s.r*(0.55+0.45*clamp(1-s.t/.4,0,1)));
      for(let k=0;k<2;k++){ctx.beginPath();
        ctx.arc(s.x,s.y-10,ar,a0+k*Math.PI,a0+k*Math.PI+1.15);ctx.stroke();}
      ctx.globalAlpha=1;continue;
    }
    ctx.strokeStyle=s.color;ctx.lineWidth=s.big?4:2;ctx.globalAlpha=clamp(s.t*6,0,1);
    ctx.beginPath();ctx.arc(s.x,s.y-10,s.big?26:16,-.6,1.6);ctx.stroke();
    ctx.globalAlpha=1;
  }
  // 粒子
  for(const p of particles){
    if(p.bolt){ // 闪电折线
      ctx.strokeStyle=p.color;ctx.lineWidth=2.5;ctx.globalAlpha=clamp(p.t*3.5,0,1);
      ctx.beginPath();p.pts.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));ctx.stroke();
      ctx.lineWidth=1;ctx.strokeStyle='#ffffff';ctx.globalAlpha=clamp(p.t*2,0,1);ctx.stroke();
      ctx.globalAlpha=1;continue;
    }
    if(p.ring){ctx.strokeStyle=p.color;ctx.globalAlpha=clamp(p.t*2.2,0,1);ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.stroke();ctx.globalAlpha=1;continue;}
    ctx.fillStyle=p.color;ctx.globalAlpha=clamp(p.t*2,0,1);
    ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);ctx.globalAlpha=1;
  }
  // 飘字
  ctx.textAlign='center';
  for(const t of texts){
    ctx.font='bold '+t.size+'px sans-serif';
    ctx.globalAlpha=clamp(t.t*1.6,0,1);
    ctx.fillStyle='#000';ctx.fillText(t.txt,t.x+1,t.y+1);
    ctx.fillStyle=t.color;ctx.fillText(t.txt,t.x,t.y);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  /* 昼夜色调 + 天气视野遮罩（屏幕空间叠加层） */
  {
    const pt=phaseTint();
    if(pt){ctx.fillStyle=pt;ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);}
    const w=curWeather();
    if(w.vis<1){
      ctx.fillStyle='rgba(180,190,210,'+(clamp(1-w.vis,0,1)*.55)+')';
      ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
    }
  }
  // 屏幕边缘红光（低血量）
  if(!player.dead&&player.hp<player.maxHp*.25){
    const g=ctx.createRadialGradient(cv.width/dpr/2,cv.height/dpr/2,Math.min(cv.width,cv.height)/dpr*.3,cv.width/dpr/2,cv.height/dpr/2,cv.width/dpr/2);
    g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,'rgba(255,0,0,'+(0.25+0.1*Math.sin(ST.time*6))+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  }
  updateTopHud();
}
let bossRef=null;
function updateBossBar(b){bossRef=b;}
function updateTopHud(){
  $('hpBar').querySelector('i').style.transform='scaleX('+clamp(player.hp/player.maxHp||0,0,1)+')';
  $('hpBar').querySelector('b').textContent=Math.min(player.maxHp,Math.ceil(player.hp)||0)+' / '+player.maxHp;
  $('mpBar').querySelector('i').style.transform='scaleX('+clamp(player.mp/player.maxMp||0,0,1)+')';
  $('mpBar').querySelector('b').textContent=Math.min(player.maxMp,Math.ceil(player.mp)||0)+' / '+player.maxMp;
  $('xpBar').querySelector('i').style.transform='scaleX('+clamp(player.exp/expNeed(player.level),0,1)+')';
  $('plLv').textContent=player.level;
  const bb=$('bossBar');
  if(bossRef&&!bossRef.dead&&dist(player,bossRef)<600){
    bb.style.display='block';
    bb.querySelector('.bn').textContent=bossRef.d.n;
    bb.querySelector('i').style.transform='scaleX('+clamp(bossRef.hp/bossRef.maxHp,0,1)+')';
  }else bb.style.display='none';
}
function drawPortal(ctx,x,y){
  ctx.save();ctx.translate(x,y);
  for(let i=0;i<3;i++){
    const r=18+i*7+Math.sin(ST.time*3+i)*2;
    ctx.strokeStyle=['#8ad8ff','#5a9ae0','#3a5ac0'][i];
    ctx.globalAlpha=.7-i*.18;
    ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,r,r*.42,0,0,6.29);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='#8ad8ff';ctx.fillText('◈ 传送阵 ◈',0,-30);
  ctx.restore();
}
function drawNPCs(ctx){
  if(player.mapId!=='village')return;
  for(const n of NPCS){
    const nx=MAP.portal.x+n.dx,ny=MAP.portal.y+n.dy;
    const sp=SPRITES[n.spr];
    const img=sp.f[Math.floor(ST.time*3)%2];
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(nx,ny-2,12,5,0,0,6.29);ctx.fill();
    ctx.drawImage(img,nx-img.width/2,ny-img.height+6);
    ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='#ffd84a';ctx.fillText(n.n,nx,ny-img.height-4);
    ctx.fillStyle='#fff';ctx.font='9px sans-serif';
    ctx.fillText(n.hint,nx,ny+12);
    // 靠近提示
    if(Math.hypot(player.x-nx,player.y-ny)<85){
      ctx.font='bold 12px sans-serif';ctx.fillStyle='#ffe9b0';
      ctx.fillText('点击'+n.n+'交易',nx,ny-70);
    }
  }
}
/* NPC 交互按钮：靠近时出现，点击打开面板 */
let _npcShown=null;
function updateNPCBtn(){
  const btn=$('npcBtn');
  let found=null;
  if(player.mapId==='village'&&!player.dead&&ST.mode==='game'){
    for(const n of NPCS){
      if(Math.hypot(player.x-(MAP.portal.x+n.dx),player.y-(MAP.portal.y+n.dy))<85){found=n;break;}
    }
  }
  if(found!==_npcShown){
    _npcShown=found;
    if(found){
      btn.textContent=found.btnText;
      btn.style.display='block';
    }else btn.style.display='none';
  }
}
/* 屏幕坐标 → 世界坐标，并检测是否点中 NPC */
function hitNpcAt(cx,cy){
  if(player.mapId!=='village')return null;
  const wx=cam.x+cx/zoom(),wy=cam.y+cy/zoom();
  for(const n of NPCS){
    const nx=MAP.portal.x+n.dx,ny=MAP.portal.y+n.dy;
    if(Math.hypot(wx-nx,wy-ny+14)<42)return n;
  }
  return null;
}

/* ---------------- S13 主循环 ---------------- */
let lastT=0,_qbtnT=0;
/* ---------------- 手感三件套：顿帧 / 震屏 / 震动 ----------------
   设计约束：挂机自动战斗时画面绝不能持续抖动。
   因此「顿帧」与「震屏」只给关键打击（暴击/击杀/玩家受击/阵亡），普攻完全不参与；
   震动则靠 45ms 节流兜住高频命中。 */
let hitStop=0;    // 顿帧剩余时长（秒）。>0 时当帧 dt 归零，世界暂停但画面照常渲染
let shakeT=0;     // 震屏剩余时长（秒）
let shakeAmp=0;   // 震屏振幅（像素），取多次触发中的最大值
/* 单步推进世界（与 frame 内的逻辑完全一致，但由调用方给定 dt）
   抽出的目的：主循环与自动化测试共用同一份逻辑，避免"测试走的是另一条路径" */
function stepWorld(dt){
  if(ST.mode!=='game'||!MAP)return;
  ST.time+=dt;
  updateWorld(dt);
  updatePlayer(dt);
  if(!player.dead){
    updatePet(dt);
    for(const m of MAP.mobs)updateMonster(m,dt);
  }
  updateBots(dt);   // 人机玩家：敌意判定/自愈（移动与攻击复用 updateMonster）
  updateProjectiles(dt);updateAoes(dt);updateZones(dt);updateDrops(dt);updateParticles(dt);
  if(ST.tower)updateTower(dt);
  updateNPCBtn();
  _qbtnT+=dt;
  if(_qbtnT>1){_qbtnT=0;updateQuestBtn();}
  updateCamera();
}
function frame(t){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(t-lastT)/1000)||0;
  lastT=t;                  // ★ 必须无条件执行：若顿帧时跳过，t-lastT 会累积整个顿帧时长，
                            //   顿帧结束那一帧就会被截断成 0.05s 的"快进跳变"，怪物/弹幕瞬移
  if(hitStop>0){hitStop-=dt;dt=0;}   // 顿帧：世界停住，渲染照常（画面定格制造打击感）
  if(shakeT>0)shakeT-=dt;            // 震屏计时（只递减，不移除已产生的偏移）
  stepWorld(dt);
  render();
}

/* 进入游戏（事务式）：任何一步失败都回滚到标题画面，
   绝不留下"半初始化"状态被 3 秒自动存档写回、把好档覆盖成坏档。 */
function startGame(cls,save,slot){
  if(slot)curSlot=clamp(slot,1,SAVE_N);
  SFX.init();
  if(SFX.ctx&&SFX.ctx.state==='suspended')SFX.ctx.resume();
  /* 读档进入时先做数据体检：剔除非法装备/天赋/成就等脏数据。
     体检是纯函数式修补，不会因为坏数据抛异常。 */
  let broken=[];
  if(save){
    const r=sanitizeSave(save);
    save=r.data;broken=r.broken;
  }
  try{
    startGameInner(cls,save,broken);
  }catch(e){
    /* --- 回滚：恢复标题画面，坏档不写回 --- */
    try{ ST.mode='title'; }catch(_){}
    $('title').classList.remove('hidden');
    $('gameUI').classList.add('hidden');
    try{ closePanel(); }catch(_){}
    showStartFailed(e,save);
    return false;
  }
  /* 初始化全部成功后才置为游戏态（原先提前置位是坏档污染的根源） */
  hideItemDetail();                         // 清掉标题画面可能开着的弹窗（槽位覆盖/失败提示）
  ST.mode='game';
  SFX.startBgm();
  saveGame(curSlot);
  return true;
}
/* 读档失败的用户提示：明确告知"这份存档读不了"，并给出可操作选项 */
/* 统一的"回到标题画面"入口：任何异常/退出路径都走它，保证 UI 不残留半截面板 */
function openTitle(){
  try{ST.mode='title';}catch(e){}
  const t=$('title');if(t)t.classList.remove('hidden');
  const g=$('gameUI');if(g)g.classList.add('hidden');
  const r=$('revive');if(r)r.classList.add('hidden');
  try{closePanel();}catch(e){}
  try{renderTitleSlots();}catch(e){}
}
/* 读档失败弹窗：走标题层弹窗（#itemDetail 已提升到 body 层，标题画面可见） */
function showStartFailed(err,save){
  const sl=curSlot;
  const hasBak=!!loadBackup(sl);
  const d=$('itemDetail');showTitleDialog();
  d.innerHTML='<div style="text-align:center">'+
   '<b style="font-size:16px;color:#ff8a70">⚠ 存档读取失败</b>'+
   '<div style="font-size:12px;color:#a89058;margin-top:6px;line-height:1.7">'+
    '槽位 #'+sl+' 的数据可能已损坏或不兼容当前版本。<br>'+
    '为避免覆盖，游戏已停止载入并停留在标题画面。</div>'+
   '<div style="font-size:11px;color:#6a5a38;margin-top:6px;word-break:break-all">'+
    '原因：'+String((err&&err.message)||err||'未知')+'</div>'+
   '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center">'+
   (hasBak?'<button class="goldbtn" id="sfRestore" style="border-color:#5aff8a;color:#c8ffd8">↩ 恢复上一版本存档</button>':'')+
   '<button class="goldbtn" id="sfNew">另起新角色</button>'+
   '<button class="goldbtn" id="sfClose">返回标题</button>'+
   '</div></div>';
  const rs=$('sfRestore');
  if(rs)rs.addEventListener('pointerdown',()=>{
    if(!restoreBackup(sl)){toast('没有可用的备份存档');return;}
    toast('已恢复到上一版本，正在重新载入…');
    hideItemDetail();openTitle();
    setTimeout(()=>{const sv=loadGame(sl);if(sv)startGame(sv.cls,sv,sl);},350);
  });
  const nw=$('sfNew');
  if(nw)nw.addEventListener('pointerdown',()=>{hideItemDetail();openTitle();showSlotPicker('warrior');});
  const cl=$('sfClose');
  if(cl)cl.addEventListener('pointerdown',()=>{hideItemDetail();openTitle();});
}
function startGameInner(cls,save,slot,broken){
  broken=broken||[];
  /* 重置本次会话的运行时状态 */
  resetRuntime();
  let offline=null;
  if(save){
    player.cls=save.cls;player.name=save.name||'玛法勇士';
    player.level=save.level||1;player.exp=save.exp||0;
    ST.gold=save.gold||0;ST.kills=save.kills||0;
    ST.qKills=save.qKills||{};ST.qClaimed=save.qClaimed||[];ST.qMemo=save.qMemo||{};
    ST.bossKills=save.bossKills||0;ST.q2Got=save.q2Got||0;ST.t4Got=save.t4Got||0;
    ST.maxPlus=save.maxPlus||0;ST.petMaxed=!!save.petMaxed;
    ST.achv=Array.isArray(save.achv)?save.achv:[];ST.achvNew=0;
    if(Array.isArray(save.autoSkill))ST.autoSkill=save.autoSkill;
    if(save.autoCfg)ST.autoCfg=Object.assign({hpPct:55,mpKeep:0,cnt:3},save.autoCfg);
    if(save.autoSkillCfg&&typeof save.autoSkillCfg==='object')ST.autoSkillCfg=save.autoSkillCfg;
    if(save.autoPick)ST.autoPick=Object.assign({gold:true,pot:true,eq:true},save.autoPick);
    ST.autoSellFull=!!save.autoSellFull;
    if(save.autoSellCfg&&typeof save.autoSellCfg==='object'){
      ST.autoSellCfg=save.autoSellCfg;
      ensureAutoSellCfg();          // 补齐缺省键，防止旧版本配置缺字段
    }
    /* 新系统字段 */
    ST.stat=Object.assign({dmg:0,hits:0,heal:0,hurt:0,deaths:0,goldEarn:0,goldSpend:0,
      expEarn:0,maxHit:0,streak:0,maxStreak:0,eliteKills:0,craft:0,craftOK:0,
      reroll:0,towerRuns:0,towerBestRun:0,pots:0,oreGet:0,time:0},save.stat||{});
    ST.skillPt=(save.skillPt!==undefined)?save.skillPt:0;   // 默认 0：技能点只能靠炼化 Boss 内丹
    ST.talents=save.talents||{};
    ST.talentReset=save.talentReset||0;
    ST.towerBest=save.towerBest||0;ST.towerClear=save.towerClear||0;
    ST.dayT=save.dayT||0;ST.dayN=save.dayN||1;
    ST.weather=save.weather||'sun';ST.weatherT=save.weatherT||rnd(30,60);
    /* 音画设置：老存档没有这些字段 → 一律回落到"开"，不因升级而静音 */
    ST.vibe=(save.vibe!==undefined)?!!save.vibe:true;
    if(save.sfxOn!==undefined)SFX.on=!!save.sfxOn;
    if(save.bgmOn!==undefined)SFX.bgm=!!save.bgmOn;
    petCarry={lvl:Math.min(save.petLvl||0,PET_MAX),exp:save.petExp||0,stage:save.petStage||0};
    inv.length=0;(save.inv||[]).forEach(i=>{if(!i.pid&&i.q===undefined)i.q=1;inv.push(i);});
    for(const k in equip){equip[k]=save.equip&&save.equip[k]||null;if(equip[k]&&equip[k].q===undefined)equip[k].q=1;}
    recalcStats();
    player.hp=clamp(save.hp||player.maxHp,1,player.maxHp);
    player.mp=clamp(save.mp||player.maxMp,1,player.maxMp);
    ST.auto=!!save.auto;
    $('title').classList.add('hidden');$('gameUI').classList.remove('hidden');
    switchMap(save.mapId||'village');
    if(save.x&&save.y){player.x=save.x;player.y=save.y;}
    offline=checkOffline(save);
  }else{
    player.cls=cls||'warrior';
    player.name=($('nameInput')?$('nameInput').value:'').trim()||pick(NAMES1)+pick(NAMES2);
    player.level=1;player.exp=0;ST.gold=0;ST.kills=0;
    ST.qKills={};ST.qClaimed=[];ST.qMemo={};
    inv.length=0;
    for(const k in equip)equip[k]=null;
    // 新手礼包
    inv.push({id:'hp_s',pid:1,n:5});inv.push({id:'mp_s',pid:1,n:5});
    recalcStats();player.hp=player.maxHp;player.mp=player.maxMp;
    // 初始武器（补 q:1，避免初始装备品质为 undefined 导致属性倍率异常）
    const w=player.cls==='warrior'?{id:'wood_sword',q:1}:player.cls==='mage'?{id:'wood_staff',q:1}:{id:'yinshe',q:1};
    equip.weapon=w;recalcStats();
    $('title').classList.add('hidden');$('gameUI').classList.remove('hidden');
    switchMap('village');
    player.x=MAP.spawn.x;player.y=MAP.spawn.y;
    ST.auto=false;
    addLog('欢迎来到玛法大陆，'+player.name+'！');
    addLog('新手礼包已发放：金创药×5 魔法药×5');
    addLog('存档已写入槽位 #'+curSlot+' · 另有 2 个空槽可另起角色');
  }
  player.skills=CLASSES[player.cls].skills;
  player.cd={};
  ST._phaseId=curPhase().id;
  $('plCls').textContent=CLASSES[player.cls].tag;
  $('plCls').style.color=CLASSES[player.cls].color;
  $('plFrame').style.borderColor=CLASSES[player.cls].color;
  drawAvatar();
  updateAutoBtn();updateSkillBtns();updateGuide();updateQuestBtn();
  /* 注意：ST.mode / SFX.startBgm / saveGame 由外层 startGame 在全部成功后执行，
     这里只负责把世界状态准备好，保证异常时不留下"游戏态但半初始化"的现场 */
  if(offline)setTimeout(()=>showOfflinePanel(offline),700);
  else if(ST.auto)setTimeout(()=>toast('自动挂机已恢复'),600);
  if(broken&&broken.length){
    /* 读档时剔除了脏数据：明确告知，避免玩家以为"装备凭空少了" */

  }
}

<script>
/* ---- PWA Service Worker 注册 + 自动更新（仅 https / localhost 生效，file:// 静默跳过） ---- */
(function(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(location.hostname))return;

  /* 底部更新提示条：不自动刷新，避免打断玩家正在进行的战斗 */
  function showUpdateBar(onUpdate){
    if(document.getElementById('pwaUpdateBar'))return;
    var bar=document.createElement('div');
    bar.id='pwaUpdateBar';
    bar.style.cssText=[
      'position:fixed','left:50%','bottom:calc(18px + env(safe-area-inset-bottom))',
      'transform:translateX(-50%)','z-index:9999','display:flex','align-items:center','gap:10px',
      'padding:10px 14px','border-radius:22px','border:1.5px solid #ffca4a',
      'background:linear-gradient(180deg,#3a2a10,#1a1208)',
      'color:#ffe9b0','font-size:13px','line-height:1.4',
      'box-shadow:0 6px 24px rgba(0,0,0,.7),0 0 18px rgba(255,202,74,.28)',
      'max-width:92%','cursor:pointer','user-select:none','-webkit-tap-highlight-color:transparent'
    ].join(';');
    bar.innerHTML='<span>✦ 发现新版本</span>'+
      '<span style="padding:4px 14px;border-radius:16px;background:linear-gradient(180deg,#ffd870,#c8901c);'+
      'color:#2a1a04;font-weight:bold">点击更新</span>';
    bar.addEventListener('pointerdown',function(ev){
      ev.preventDefault();
      bar.querySelector('span:last-child').textContent='更新中…';
      onUpdate();
    });
    document.body.appendChild(bar);
    setTimeout(function(){ if(bar.parentNode)bar.remove(); },30000);  // 30 秒后自动消失
  }

  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      /* --- 场景1：页面打开时已有新 SW 在等待 --- */
      if(reg.waiting){ showUpdateBar(function(){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }); }

      /* --- 场景2：页面打开后才检测到新版本 --- */
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;
        if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            // 有 controller 才是"更新"，否则是首次安装
            showUpdateBar(function(){ nw.postMessage({type:'SKIP_WAITING'}); });
          }
        });
      });

      /* 每次打开主动查一次更新（浏览器自身检查可能有延迟） */
      reg.update().catch(function(){});
    }).catch(function(){/* 注册失败不影响游戏 */});

    /* --- 新 SW 接管后，自动刷新一次拿到最新页面 --- */
    var refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(refreshing)return;
      refreshing=true;
      location.reload();
    });
  });
})();
</script>
